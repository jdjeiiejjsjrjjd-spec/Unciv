'The Scourge of God' united the Hunnic tribes, and led them to great wealth and glory, antagonizing the Romans across his borders relentlessly. = 'سوط الله' وحّد قبائل الهون وقادهم إلى ثروة ومجد عظيمين، وناصب الرومان العداء بلا هوادة عبر حدوده.

The creator of the Pax Romana and the Roman Empire, who ended a long civil war and brought peace to the entire Mediterranean, possibly the greatest emperor of Rome. = مبتكر السلام الروماني (باكس رومانا) والإمبراطورية الرومانية، أنهى حرباً أهلية طويلة وجلب السلام إلى المتوسط بأكمله، ولعله أعظم أباطرة روما.

The successful political career of the Iron Chancellor cannot be undermined, for he united Germany as we know it today, in his own way. = لا يمكن التقليل من المسيرة السياسية الناجحة للمستشار الحديدي، فقد وحّد ألمانيا كما نعرفها اليوم، بطريقته الخاصة.

The noble warrior fought with bravery and courage to gain the freedom of the Celtic people from the Roman subjugation, inspiring many others after her. = قاتلت المحاربة النبيلة بشجاعة وإقدام لانتزاع حرية الشعب السلتي من الاستعباد الروماني، وألهمت الكثيرين من بعدها.

