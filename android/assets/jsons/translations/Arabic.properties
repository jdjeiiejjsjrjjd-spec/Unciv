Haile Selassie = هايلي سيلاسي
I have tried all other avenues, but yet you persist in this madness. I hope, for your sake, your end is swift. = جربت كل السبل الأخرى، لكنك ما زلت تصر على هذا الجنون. آمل، من أجلك، أن تكون نهايتك سريعة.
It is silence that allows evil to triumph. We will not stand mute and allow you to continue on this mad quest unchecked. = الصمت هو ما يسمح للشر بالانتصار. لن نقف صامتين ونسمح لك بمواصلة هذه المهمة المجنونة دون رادع.
God and history will remember your actions this day. I hope you are ready for your impending judgment. = الله والتاريخ سيتذكران أفعالك هذا اليوم. آمل أن تكون مستعداً لحسابك الوشيك.
What a waste of time. = يا لها من مضيعة للوقت.
A thousand welcomes to our fair nation. I am Selassie, the Ras Tafari Makonnen and Emperor of Ethiopia, your humble servant. = ألف مرحباً بك في أمتنا الجميلة. أنا سيلاسي، راس تافاري ماكونن وإمبراطور إثيوبيا، خادمك المتواضع.
I request that you consider this offer between our two peoples. I believe it will do us both good. = أرجو أن تنظر في هذا العرض بين شعبينا. أعتقد أنه سيفيدنا معاً.
Spirit of Adwa = روح عدوة
May God bless you, wise and righteous Emperor of Ethiopia, Haile Selassie. As one of Ethiopia's greatest rulers and a spiritual leader of the Rastafarian movement, your good influence on diplomacy and political cooperation are praised throughout the world. You created Ethiopia's first written constitution, and favorized democracy for years to come, your great wisdom making Ethiopia enter as a charter member in the United Nations. Always aiming to reform and modernize your nation, you changed Ethiopian destiny for the best. = ليباركك الله أيها الإمبراطور الحكيم العادل لإثيوبيا هايلي سيلاسي. كأحد أعظم حكام إثيوبيا وقائد روحي للحركة الراستافارية، يُشاد بتأثيرك الإيجابي في الدبلوماسية والتعاون السياسي في أنحاء العالم. وضعت أول دستور مكتوب لإثيوبيا، وناصرت الديمقراطية لسنوات قادمة، وبفضل حكمتك العظيمة دخلت إثيوبيا عضواً مؤسساً في الأمم المتحدة.
Revered King, your knowledge and intelligence are required once again to protect your people from many threats in the world. Will you secure peace and stability, with benevolence and authority, in the radiance of the Kebra Nagast? Will your new empire shine through the ages of history? = أيها الملك الموقر، معرفتك وذكاؤك مطلوبان مرة أخرى لحماية شعبك من تهديدات كثيرة في العالم. هل ستؤمن السلام والاستقرار، بالرحمة والسلطة، في ضياء كيبرا ناغاست؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
