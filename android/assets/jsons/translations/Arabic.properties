Genghis Khan = جنكيز خان
You stand in the way of my armies. Let us solve this like warriors! = أنت تقف في طريق جيوشي. لنحل هذا كالمحاربين!
No more words. Today, Mongolia charges toward your defeat. = لا مزيد من الكلام. اليوم تندفع منغوليا نحو هزيمتك.
You have hobbled the Mongolian clans. My respect for you nearly matches the loathing. I am waiting for my execution. = لقد كبّلت العشائر المنغولية. احترامي لك يكاد يعادل احتقاري. أنا في انتظار إعدامي.
Your bravery must be commended. = شجاعتك تستحق الثناء.
I am Temuujin, conqueror of cities and countries. Before me lie future Mongolian lands. Behind me is the only cavalry that matters. = أنا تيموجين، فاتح المدن والبلدان. أمامي تقع الأراضي المنغولية المستقبلية. وخلفي الفرسان الوحيدون الذين يهمون.
I am not always this generous, but we hope you take this rare opportunity we give you. = لست كريماً دوماً هكذا، لكننا نأمل أن تغتنم هذه الفرصة النادرة التي نمنحها لك.
So what now? = إذن ماذا الآن؟
Mongol Terror = الرعب المغولي
O great Temuujin, immortal leader of the mighty Mongol Empire! Your name alone was enough to make cities crumble, and the sound of the mighty Mongol cavalry to make your enemies flee! O Great Khan! Once Northern Asia united into a mighty people, producing one of the greatest armies the world has ever known, your skillful mounted archers conquered in only a few years, most of China, Eastern Asia, and even reached the gates of Europe at the West. With cunning diplomacy and brilliant warfare, you swept your enemies one after another, creating the greatest empire ever seen, reducing Roman or Greek conquests to minor achievements. = أيها التيموجين العظيم، القائد الخالد للإمبراطورية المغولية الجبارة! اسمك وحده كان يكفي لانهيار المدن، وصوت الفرسان المغول العظيم ليفر أعداؤك! أيها الخان العظيم! حين اتحدت شمال آسيا في شعب عظيم، منتجة أحد أعظم الجيوش التي عرفها العالم، فتح رماتك الخيالة المهرة في سنوات قليلة معظم الصين وشرق آسيا، وبلغوا أبواب أوروبا غرباً.
Divine Temuujin, battles and conquests run through the veins of the Mongols. Are you ready to shatter the will of your enemies? Will your cavalry ride in the steppes once again and strike as lightning and thunder? Will your new empire shine through the ages of history? = أيها التيموجين الإلهي، المعارك والفتوحات تجري في عروق المغول. هل أنت مستعد لتحطيم إرادة أعدائك؟ هل سيركض فرسانك في السهوب مرة أخرى ويضربون كالبرق والرعد؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
