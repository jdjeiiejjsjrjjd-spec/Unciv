My God, be merciful to my soul. My God, feel pity for this... my poor people! = يا إلهي، ارحم روحي. يا إلهي، اشفق على هذا... شعبي المسكين!
I am William of Orange, stadtholder of The Netherlands. Did you need anything? I still have a lot to do. = أنا ويليام أوف أورانج، حاكم هولندا. هل احتجت إلى شيء؟ ما زال لدي الكثير لأفعله.
I believe I have something that may be of some importance to you. = أظن أن لدي شيئاً قد يكون ذا أهمية لك.
Once again, greetings. = تحياتي مرة أخرى.
Dutch East India Company = شركة الهند الشرقية الهولندية
Greetings to the wise and brave Prince William of Orange, who freed the Netherlands and gave strength to the Dutch people. In 1568, you led a rebellion against Spanish dominion, to gain freedom for your people, and therefore starting the Eighty Years' War. Your actions were all aimed to create one of Europe's first modern republics, the Seven United Provinces. The rebellion was the meaning of your very life and death, as it was also the cause of your assassination in 1584. But your death has given even more pride and courage to your people, to fight for liberty against any oppressors. Carved in history as the 'Father of the Fatherland', your name is a symbol of Dutch independence for eternity. = تحياتي للأمير الحكيم الشجاع ويليام أوف أورانج، محرر هولندا ومانح الشعب الهولندي القوة. في عام 1568 قدت تمرداً ضد الهيمنة الإسبانية لنيل الحرية لشعبك، فبدأت بذلك حرب الثمانين عاماً. وكانت أفعالك كلها تهدف إلى إنشاء إحدى أولى الجمهوريات الحديثة في أوروبا، المقاطعات السبع المتحدة. كان التمرد معنى حياتك وموتك ذاته.
Brave Prince, your people ask for your wisdom to gain its freedom once more, and to illuminate the world with progressive and modern ideas. Will your new empire shine through the ages of history? = أيها الأمير الشجاع، شعبك يطلب حكمتك لنيل حريته مرة أخرى، ولإنارة العالم بالأفكار التقدمية الحديثة. هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
