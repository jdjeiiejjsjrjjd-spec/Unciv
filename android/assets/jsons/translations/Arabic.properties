You shall stain this land no longer with your vileness! To arms, my countrymen. We ride to war! = لن تدنس هذه الأرض بخستك بعد الآن! إلى السلاح يا أبناء وطني. نخرج إلى الحرب!
Traitorous man! The Celtic peoples will not stand for such wanton abuse and slander - I shall have your balls! = أيها الرجل الخائن! لن تتحمل الشعوب السلتية مثل هذه الإساءة والافتراء العابث - سأقطع رأسك!
Vile ruler, know you have won this war in name alone. Your cities lie buried and your troops defeated. I have my own victory. = أيها الحاكم الخسيس، اعلم أنك فزت بهذه الحرب بالاسم وحده. مدنك مدفونة وجنودك مهزومون. لدي نصري الخاص.
Don't forget who you're dealing with. Arrogant moves can get you in danger. = لا تنس مع من تتعامل. التحركات المتغطرسة قد تعرضك للخطر.
I am Boudicca, Queen of the Celts. Let no-one underestimate me! = أنا بوديكا، ملكة السلت. لا يستهِن بي أحد!
Let us join our forces together and reap the rewards. = لنوحد قوانا ونحصد المكافآت.
God has given good to you. = لقد أنعم الله عليك بالخير.
Druidic Lore = علم الدرويد
May glory and honor always be upon you, Warrior Queen! In a time dominated by men, you successfully claimed the throne and the power, but also valiantly defied the mighty Roman Empire. Punished and humiliated by the hand of the Roman bloody invaders, you united your people and led a terrible revolt, to seek revenge. Many legions fell under your fierce attacks and you burned the city of London with your anger. While the Romans still kept ownership of your land after your final defeat, your actions nonetheless showed Rome that this land could never be fully conquered, making Nero himself consider to withdraw all troops and leaving Britain forever. = ليكن المجد والشرف عليك دائماً أيتها الملكة المحاربة! في زمن هيمن عليه الرجال، نجحت في المطالبة بالعرش والسلطة، لكنك تحديت بشجاعة الإمبراطورية الرومانية العظيمة. وبعدما عاقبك الغزاة الرومان الدمويون وأذلوك، وحدت شعبك وقدت ثورة رهيبة سعياً للانتقام. سقطت فيالق كثيرة تحت هجماتك الضارية وأحرقت مدينة لندن بغضبك.
O raging lioness, will you lead the Celts again under the glory of your name, to spread the fires of liberty, and achieve a final victory? Will your new empire shine through the ages of history? = أيتها اللبوة الغاضبة، هل ستقودين السلت مرة أخرى تحت مجد اسمك، لتنشري نيران الحرية وتحققي نصراً نهائياً؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
