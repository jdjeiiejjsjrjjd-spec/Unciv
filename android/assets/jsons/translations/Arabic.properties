Darius I = داريوس الأول
Your continue existence is an embarrassment to all leaders everywhere! You must be destroyed! = استمرار وجودك عار على جميع القادة في كل مكان! يجب أن تُدمَّر!
Curse you! You are beneath me, son of a donkey driver! I will crush you! = لعنة عليك! أنت أدنى مني يا ابن سائق الحمير! سأسحقك!
You mongrel! Cursed be you! The world will long lament your heinous crime! = أيها الهجين! ملعون أنت! سيبكي العالم طويلاً على جريمتك الشنيعة!
Peace be on you! I am Darius, the great and outstanding king of kings of great Persia... but I suppose you knew that. = السلام عليكم! أنا داريوس، ملك الملوك العظيم والمتميز لبلاد فارس العظيمة... لكنني أظن أنك كنت تعلم ذلك.
In my endless magnanimity, I am making you this offer. You agree, of course? = بكرمي اللامتناهي أقدم لك هذا العرض. أنت موافق بالطبع؟
Good day to you! = يوم سعيد لك!
Ahh... you... = آه... أنت...
Achaemenid Legacy = الإرث الأخميني
Great King Darius of Persia, the heaven casts its light upon you! Persian people are strong and wise, as their leader. In old ages, the great Persian king Cyrus fought back the mighty Median empire and finally destroyed the Medes in 550 BC. Cunning diplomacy and military achievements helped then to conquer the wealthy Lydia and the powerful Babylon, Cyrus' son conquering the eternal Egypt some years later. At the height of its power, the Persian Empire reached the shores of Macedonia, at the very door of the upstart Greek city-states. Persia would have prospered for centuries if Alexander of Macedon hadn't brutally destroyed the great empire in one violent strike. = أيها الملك العظيم داريوس ملك فارس، تلقي السماء عليك نورها! الشعب الفارسي قوي وحكيم كقائده. في العصور القديمة صد الملك الفارسي العظيم قورش إمبراطورية الميديين العظيمة وحطم الميديين أخيراً عام 550 ق.م. ثم ساعدت الدبلوماسية الماكرة والإنجازات العسكرية على فتح ليديا الغنية وبابل القوية، وفتح ابن قورش مصر الخالدة بعد سنوات. وفي أوج قوتها بلغت الإمبراطورية الفارسية شواطئ مقدونيا، عند باب دول المدن اليونانية الصاعدة.
King Darius, the people of Persia await, longing for its past glory and power! Persia of the Immortals must reborn, to punish its foes and rebuild the gleaming Persepolis! Will your new empire shine through the ages of history? = أيها الملك داريوس، شعب فارس ينتظر، متوقاً إلى مجده وقوته الماضيين! يجب أن تُبعث فارس الخالدين، لتعاقب أعداءها وتعيد بناء برسيبوليس المتألقة! هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
