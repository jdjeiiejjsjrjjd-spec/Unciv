Napoleon = نابليون
You're disturbing us, prepare for war. = أنتم تزعجوننا، استعدوا للحرب.
You've fallen into my trap. I'll bury you. = لقد وقعت في فخي. سأدفنك.
I congratulate you for your victory. = أهنئك على انتصارك.
Welcome. I'm Napoleon, of France; the smartest military man in world history. = أهلاً بك. أنا نابليون، من فرنسا؛ أذكى رجل عسكري في تاريخ العالم.
France offers you this exceptional proposition. = تقدم لك فرنسا هذا العرض الاستثنائي.
Hello. = أهلاً.
It's you. = إنه أنت.
Ancien Régime = النظام القديم
Vive Napoleon I, First Consul and Emperor of France! After the glorious Revolution which suppressed the centuries-old monarchy, the French nation stood at the heart of Europe as a Republic, and intended to export its ideals to the entire European continent, either by diplomacy or war. The French Capital Paris was more than ever the world center of Culture, Arts, and Letters. With its Great Army, reputed as one of the greatest in the History, France fought gloriously all surrounding enemies, but eventually fell against the coalition of other European powers. = يحيا نابليون الأول، القنصل الأول وإمبراطور فرنسا! بعد الثورة المجيدة التي أطاحت بالملكية العريقة، وقفت الأمة الفرنسية في قلب أوروبا كجمهورية، وعزمت على تصدير مثلها إلى القارة الأوروبية كلها، بالدبلوماسية أو بالحرب. وكانت العاصمة الفرنسية باريس أكثر من أي وقت مضى مركز العالم للثقافة والفنون والآداب. وبجيشها العظيم، المشهود له بأنه من أعظم الجيوش في التاريخ، حاربت فرنسا بمجد جميع الأعداء المحيطين بها، لكنها سقطت في النهاية أمام تحالف القوى الأوروبية الأخرى.
Napoleon Bonaparte, ruler of the French people, will you rebuild the Empire to take revenge on your foes, and make again of its Capital the City of Lights? Will your new empire shine through the ages of history? = يا نابليون بونابرت، حاكم الشعب الفرنسي، هل ستعيد بناء الإمبراطورية لتنتقم من خصومك، وتجعل عاصمتها مدينة الأنوار من جديد؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
