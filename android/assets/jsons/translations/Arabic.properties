Askia = أسكيا
You are an abomination to heaven and earth, the chief of ignorant savages! You must be destroyed! = أنت رجس على السماء والأرض، يا زعيم المتوحشين الجهلة! يجب أن تُدمَّر!
Fool! You have doomed your people to fire and destruction! = أيها الأحمق! لقد حكمت على شعبك بالنار والدمار!
We have been consumed by the fires of hatred and rage. Enjoy your victory in this world - you shall pay a heavy price in the next! = لقد التهمتنا نيران الكراهية والغضب. استمتع بانتصارك في هذه الدنيا - فستدفع ثمناً باهظاً في الآخرة!
This insult shall cost you. = هذه الإهانة ستكلفك.
I am Askia of the Songhai. We are a fair people - but those who cross us will find only destruction. You would do well to avoid repeating the mistakes others have made in the past. = أنا أسكيا من الصنغاي. نحن شعب عادل - لكن من يعبر طريقنا لن يجد سوى الدمار. من الأفضل لك تجنب تكرار الأخطاء التي ارتكبها الآخرون في الماضي.
Can I interest you in this deal? = هل أستطيع أن أثير اهتمامك بهذه الصفقة؟
River Warlord = أمير حرب النهر
Askia, leader of the Songhai people and greatest of all, may God watch your path towards glory! Songhai was under the rule of the mighty West African state of Mali until the middle of the 14th century. Great King Sunni Ali Ber fought for independance, and showed to all Songhai's power, by conquering territories and repelling many foes who sought to destroy the rising kingdom. Ultimately, conquest of the wealthy cities of Timbuktu and Jenne made Songhai an empire with enough economic power to survive for a century, until the empire bowed down before foes with advanced technology - muskets against spearmen. = أسكيا، قائد شعب الصنغاي وأعظمهم، ليرعَ الله دربك نحو المجد! كانت الصنغاي تحت حكم دولة مالي القوية في غرب أفريقيا حتى منتصف القرن الرابع عشر. وناضل الملك العظيم سني علي بير من أجل الاستقلال، وأظهر للجميع قوة الصنغاي بفتح الأراضي وصد أعداء كثيرين سعوا لتدمير المملكة الصاعدة. وأخيراً جعل فتح مدينتي تمبكتو وجِني الغنيتين الصنغاي إمبراطورية ذات قوة اقتصادية تكفي للبقاء قرناً.
King Askia, your people know there's still hope, that the hour of revenge is coming. Give them wealth and power, give them mighty weapons of iron and fire, to destroy any foe, for Songhai to revive! Will your new empire shine through the ages of history? = أيها الملك أسكيا، شعبك يعلم أنه ما زال هناك أمل، وأن ساعة الانتقام آتية. أعطهم الثروة والقوة، أعطهم أسلحة الحديد والنار الجبارة، لتدمير أي عدو، لتُبعث الصنغاي! هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
