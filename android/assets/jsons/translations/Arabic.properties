Elizabeth = إليزابيث
By the grace of God, your days are numbered. = بنعمة الله، أيامك معدودة.
We shall never surrender. = لن نستسلم أبداً.
You have triumphed over us. The day is yours. = لقد انتصرت علينا. اليوم لك.
Watch yourself, your pride will be your downfall. = احذر، فكبرياؤك سيكون سقوطك.
We are pleased to meet you. = يسعدنا لقاؤك.
Would you be interested in a trade agreement with England? = هل تهتم باتفاقية تجارية مع إنجلترا؟
Hello, again. = أهلاً مجدداً.
Oh, it's you! = آه، إنه أنت!
Sun Never Sets = الشمس لا تغيب
Long live to Your Highness, Queen Elizabeth Gloriana, leader and protector of the glorious England! Through history, enduring many invasions, England strengthened its will, playing smartly with diplomacy, cunning, and military power, to eventually rose as one of the most dominant Empires the world has ever known. Their matchless navy, brilliant scientists and artists, and powerful merchants, have shaped the known world for centuries. = يحيا جلالتك أيتها الملكة إليزابيث غلوريانا، قائدة إنجلترا المجيدة وحاميتها! عبر التاريخ، وبعد تحمل غزوات كثيرة، قوّت إنجلترا إرادتها، وأحسنت اللعب بالدبلوماسية والدهاء والقوة العسكرية، لتبرز في النهاية كواحدة من أكثر الإمبراطوريات هيمنة عرفها العالم. وقد شكّل أسطولها الذي لا نظير له وعلماؤها وفنانوها اللامعون وتجارها الأقوياء العالم المعروف قروناً.
Queen Elizabeth, will England cast once more its brightness upon all lands and seas of the world? Will your new empire shine through the ages of history? = أيتها الملكة إليزابيث، هل ستلقي إنجلترا ببهائها مرة أخرى على كل أراضي العالم وبحاره؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
