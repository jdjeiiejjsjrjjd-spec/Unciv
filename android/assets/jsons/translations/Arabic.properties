#################### Lines from Quests from Civ V - Vanilla ####################

Route = طريق
Build a road to connect your capital to our city. = ابنِ طريقاً يربط عاصمتك بمدينتنا.

Clear Barbarian Camp = إزالة معسكر برابرة
We feel threatened by a Barbarian Camp near our city. Please take care of it. = نشعر بالتهديد من معسكر برابرة قرب مدينتنا. يرجى التعامل معه.

Connect Resource = ربط مورد
In order to make our civilizations stronger, connect [tileResource] to your trade network. = لجعل حضاراتنا أقوى، اربط [tileResource] بشبكتك التجارية.

Construct Wonder = بناء عجيبة
We recommend you to start building [wonder] to show the whole world your civilization strength. = ننصحك بالبدء ببناء [wonder] لتُري العالم كله قوة حضارتك.

Acquire Great Person = اكتساب شخصية عظيمة
Great People can change the course of a Civilization! You will be rewarded for acquiring a new [greatPerson]. = الشخصيات العظيمة قادرة على تغيير مسار الحضارة! ستُكافأ على اكتساب [greatPerson] جديد.

Conquer City State = احتلال دولة مدينة
It's time to erase the City-State of [cityState] from the map. You will be greatly rewarded for conquering them! = حان الوقت لمحو دولة المدينة [cityState] من الخريطة. ستُكافأ بسخاء على احتلالها!

Find Player = العثور على لاعب
You have yet to discover where [civName] set up their cities. You will be rewarded for finding their territories. = لم تكتشف بعد أين أقامت [civName] مدنها. ستُكافأ على العثور على أراضيها.

Find Natural Wonder = العثور على عجيبة طبيعية
Send your best explorers on a quest to discover Natural Wonders. Nobody knows the location of [naturalWonder] yet. = أرسل أفضل مستكشفيك في مهمة لاكتشاف العجائب الطبيعية. لا أحد يعرف موقع [naturalWonder] بعد.

Give Gold = إعطاء ذهب
We are suffering great poverty after being robbed by [civName], and unless we receive a sum of Gold, it's only a matter of time before we collapse. = نعاني من فقر شديد بعد أن سرقتنا [civName]، وما لم نتلقَّ مبلغاً من الذهب فهي مسألة وقت قبل أن ننهار.

Pledge to Protect = التعهد بالحماية
We need your protection to stop the aggressions of [civName]. By signing a Pledge of Protection, you'll confirm the bond that ties us. = نحتاج إلى حمايتك لوقف اعتداءات [civName]. بتوقيعك تعهد الحماية ستؤكد الرابط الذي يجمعنا.

Contest Culture = مسابقة الثقافة
The civilization with the largest Culture growth will gain a reward. = ستنال الحضارة التي تحقق أكبر نمو في الثقافة مكافأة.

Contest Faith = مسابقة الإيمان
The civilization with the largest Faith growth will gain a reward. = ستنال الحضارة التي تحقق أكبر نمو في الإيمان مكافأة.

Contest Technologies = مسابقة التقنيات
The civilization with the largest number of new Technologies researched will gain a reward. = ستنال الحضارة التي تبحث أكبر عدد من التقنيات الجديدة مكافأة.

Invest = استثمار
Our people are rejoicing thanks to a tourism boom. For a certain amount of time, any Gold donation will yield [50]% extra Influence. = شعبنا يحتفل بفضل ازدهار السياحة. لفترة من الزمن، أي تبرع بالذهب سيمنح [50]% نفوذاً إضافياً.

Bully City State = التنمر على دولة مدينة
We are tired of the pretensions of [cityState]. If someone were to put them in their place by Demanding Tribute from them, they would be rewarded. = سئمنا من ادعاءات [cityState]. إن وضعها أحد في مكانها بالمطالبة بالجزية منها فسيُكافأ.

Denounce Civilization = استنكار حضارة
We have been forced to pay tribute to [civName]! We need you to tell the world of their ill deeds. = لقد أُجبرنا على دفع الجزية لـ [civName]! نريدك أن تخبر العالم بأفعالها الشنيعة.

We have heard the tenets of [religionName] and are most curious. Will you send missionaries to teach us about your religion? = سمعنا تعاليم [religionName] ونحن فضوليون جداً. هل سترسل مبشرين ليعلمونا عن دينك؟


