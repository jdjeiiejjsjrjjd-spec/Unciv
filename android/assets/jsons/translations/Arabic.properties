Ramkhamhaeng = رامخمهنغ
You lowly, arrogant fool! I will make you regret of your insolence! = أيها الأحمق المتغطرس الوضيع! سأجعلك تندم على وقاحتك!
You scoundrel! I shall prepare to fend you off! = أيها الوغد! سأستعد لصدك!
Although I lost, my honor shall endure. I wish you good luck. = رغم أنني خسرت، فشرفي سيبقى. أتمنى لك حظاً سعيداً.
I, Pho Kun Ramkhamhaeng, King of Siam, consider it a great honor that you have walked to visit my country of Siam. = أنا فو كون رامخمهنغ، ملك سيام، أعد من عظيم الشرف أنك جئت لزيارة بلدي سيام.
Greetings. I believe this is a fair proposal for both parties. What do you think? = تحياتي. أظن أن هذا اقتراح عادل للطرفين. ما رأيك؟
Welcome. = أهلاً.
Father Governs Children = الأب يحكم الأبناء
O Great King Ramkhamhaeng, the Siamese people obey you with respect and fear! The beautiful and mysterious land of Siam is an ancient country in the heart of Southeast Asia, which was besieged by many foes, plagued by bloody war and great poverty, but eventually the smart and loyal Siamese people have endured and triumphed. Siam was a part of the Khmer Empire until the 13th century AD, before its brave people took arms and led a revolution to form the small Sukhothai kingdom. After many battles and diplomacy prowess, this tiny kingdom became a mighty empire, which would dominate South East Asia for more than a century. = أيها الملك العظيم رامخمهنغ، الشعب السيامي يطيعك باحترام وخوف! سيام الجميلة الغامضة بلد قديم في قلب جنوب شرق آسيا، حاصرها أعداء كثيرون وأصابتها حروب دامية وفقر مدقع، لكن الشعب السيامي الذكي الوفي صمد وانتصر في النهاية. كانت سيام جزءاً من إمبراطورية الخمير حتى القرن الثالث عشر الميلادي، قبل أن يحمل شعبها الشجاع السلاح ويقود ثورة لتشكيل مملكة سوخوثاي الصغيرة.
Wise and powerful King Ramkhamhaeng, your people want to revive these days of glory! Can you make a new dawn break on Siam? Will your new empire shine through the ages of history? = أيها الملك الحكيم القوي رامخمهنغ، شعبك يريد إحياء أيام المجد هذه! هل تستطيع جعل فجر جديد يبزغ على سيام؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
