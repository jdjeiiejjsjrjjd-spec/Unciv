Dido = ديدو
Tell me, do you all know how numerous my armies, elephants and the gdadons are? No? Today, you shall find out! = قل لي، هل تعلمون كم عدد جيوشي وفيلتي والغدادون؟ لا؟ اليوم ستكتشفون!
Fate is against you. You earned the animosity of Carthage in your exploration. Your days are numbered. = القدر ضدك. لقد كسبت عداء قرطاج في استكشافك. أيامك معدودة.
The fates became to hate me. This is it? You wouldn't destroy us so without their help. = بدأ القدر يكرهني. هذا هو الأمر؟ لن تدمرنا هكذا لولا مساعدتهم.
You aren't meeting my expectations. You can do so much better. = أنت لا تلبي توقعاتي. يمكنك أن تكون أفضل بكثير.
The Phoenicians welcome you to this most pleasant kingdom. I am Dido, the queen of Carthage and all that belongs to it. = الفينيقيون يرحبون بك في هذه المملكة اللطيفة جداً. أنا ديدو، ملكة قرطاج وكل ما ينتمي إليها.
I just had the marvelous idea, and I think you'll appreciate it too. = خطرت لي للتو فكرة رائعة، وأظنك ستقدرها أيضاً.
What is it now? = ما الأمر الآن؟
Phoenician Heritage = التراث الفينيقي
Greetings to you, revered Queen Dido, ruler of the legendary kingdom of Carthage. The great poet Virgil related your great history, how your husband Acerbas was murdered by your own brother, King Pygmalion of Tyre, to steal the treasures of your family that were rightfully yours. But you endured his pressure until you and your compatriots decided to flee and sail for new lands. The gods led you to the shores of North Africa, and with cunning diplomacy, you expanded the territory of your new home, and laid the basis for the future kingdom of Carthage. = تحياتي لك أيتها الملكة الموقرة ديدو، حاكمة مملكة قرطاج الأسطورية. روى الشاعر العظيم فيرجيل تاريخك العظيم، كيف قُتل زوجك أسرباس على يد أخيك الملك بيغماليون ملك صور، ليسرق كنوز عائلتك التي كانت من حقك. لكنك صمدت أمام ضغطه حتى قررت أنت ورفاقك الفرار والإبحار إلى أراضٍ جديدة. وقادتك الآلهة إلى شواطئ شمال أفريقيا.
Clever and proud Dido, the storm is coming and your people look for a shelter under your wise and powerful protection. Can you create a new and radiant Carthage able to cleave the darkness? Will your new empire shine through the ages of history? = أيتها الماكرة الفخورة ديدو، العاصفة قادمة وشعبك يبحث عن ملجأ تحت حمايتك الحكيمة القوية. هل تستطيعين إنشاء قرطاج جديدة متألقة قادرة على شق الظلام؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
