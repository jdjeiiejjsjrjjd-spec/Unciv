#################### Lines from Events from Civ V - Gods & Kings ####################

Tutorial Task: [Move unit] = مهمة تعليمية: [Move unit]
Move a unit! = حرّك وحدة!
Click on a unit → Click on a destination → Click the arrow popup. = انقر على وحدة ← انقر على الوجهة ← انقر على سهم النافذة المنبثقة.

Found a city! = أسّس مدينة!
Select the Settler → Click on 'Found city'. = اختر المستوطن ← انقر على 'تأسيس مدينة'.

Enter the city screen! = ادخل شاشة المدينة!
Click the city button twice. = انقر على زر المدينة مرتين.

Pick a technology to research! = اختر تقنية للبحث!
Click on the tech button → Select technology → Click 'Research' (bottom right). = انقر على زر التقنيات ← اختر تقنية ← انقر على 'بحث' (أسفل اليمين).

Pick a construction! = اختر مشروع بناء!
Enter city screen → Click on a unit or building → Click 'add to queue'. = ادخل شاشة المدينة ← انقر على وحدة أو مبنى ← انقر على 'إضافة إلى القائمة'.

Pass a turn! = مرّر دوراً!
Cycle through units with 'Next unit' → Click 'Next turn'. = تنقّل بين الوحدات بـ 'الوحدة التالية' ← انقر على 'الدور التالي'.

Reassign worked tiles! = أعد تعيين المربعات المشغولة!
Enter city screen → Click the assigned tile to unassign → Click an unassigned tile to assign population. = ادخل شاشة المدينة ← انقر على المربع المعيّن لإلغاء تعيينه ← انقر على مربع غير معيّن لتعيين السكان.

Got it = فهمت
Meet another civilization! = قابل حضارة أخرى!
Explore the map until you encounter another civilization! = استكشف الخريطة حتى تصادف حضارة أخرى!

Open the options dialog! = افتح نافذة الخيارات!
Click the menu button (top left) → Click 'Options'. = انقر على زر القائمة (أعلى اليسار) ← انقر على 'الخيارات'.

Construct an improvement! = ابنِ تحسيناً!
Construct a Worker unit → Move it to a Plains or Grassland tile → Click 'Construct improvement' → Choose the farm → Leave the worker there until it's finished. = ابنِ وحدة عامل ← انقلها إلى مربع سهول أو مراعٍ ← انقر على 'بناء تحسين' ← اختر المزرعة ← اترك العامل هناك حتى ينتهي.

Create a trade route! = أنشئ طريقاً تجارياً!
Construct roads between your capital and another city. Or, automate your worker and let him get to that eventually. = ابنِ طرقاً بين عاصمتك ومدينة أخرى. أو أتمتِ عاملك ودعه يصل إلى ذلك في النهاية.

Conquer a city! = احتل مدينة!
Bring an enemy city down to low health → Enter the city with a melee unit. = اخفض صحة مدينة معادية ← ادخل المدينة بوحدة قتال قريب.

Move an air unit! = حرّك وحدة جوية!
Select an air unit → Select another city within range → Move the unit to the other city. = اختر وحدة جوية ← اختر مدينة أخرى ضمن المدى ← انقل الوحدة إلى المدينة الأخرى.

See your stats breakdown! = اطلع على تفاصيل إحصائياتك!
Enter the Overview screen (top right corner) → Click on 'Stats'. = ادخل شاشة النظرة العامة (الزاوية العليا اليمنى) ← انقر على 'الإحصائيات'.


