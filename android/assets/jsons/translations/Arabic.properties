Complete all the spaceship parts to win! = أكمل جميع أجزاء المركبة الفضائية لتفوز!
spaceship parts = أجزاء المركبة الفضائية
You have achieved victory through mastery of Science! You have conquered the mysteries of nature and led your people on a voyage to a brave new world! Your triumph will be remembered as long as the stars burn in the night sky! = لقد حققت النصر بإتقان العلم! لقد قهرت أسرار الطبيعة وقدت شعبك في رحلة إلى عالم جديد شجاع! سيُذكر انتصارك ما دامت النجوم تتوهج في سماء الليل!

Complete 5 policy branches and build the Utopia Project to win! = أكمل 5 فروع سياسات وابنِ مشروع اليوتوبيا لتفوز!
You have achieved victory through the awesome power of your Culture. Your civilization's greatness - the magnificence of its monuments and the power of its artists - have astounded the world! Poets will honor you as long as beauty brings gladness to a weary heart. = لقد حققت النصر بقوة ثقافتك الهائلة. عظمة حضارتك - روعة آثارها وقوة فنانيها - أذهلت العالم! سيكرمك الشعراء ما دام الجمال يُدخل البهجة على القلب المتعب.

Capture all enemy Capitals to win! = استولِ على جميع العواصم المعادية لتفوز!
The world has been convulsed by war. Many great and powerful civilizations have fallen, but you have survived - and emerged victorious! The world will long remember your glorious triumph! = لقد اهتز العالم من الحرب. سقطت حضارات عظيمة وقوية كثيرة، لكنك نجوت - وخرجت منتصراً! سيتذكر العالم انتصارك المجيد طويلاً!

Build the UN and be voted world leader to win! = ابنِ الأمم المتحدة وانتُخب زعيماً للعالم لتفوز!
Anyone should build [buildingFilter] = يجب أن يبني أحد ما [buildingFilter]
Win diplomatic vote = الفوز بالتصويت الدبلوماسي
You have triumphed over your foes through the art of diplomacy! Your cunning and wisdom have earned you great friends - and divided and sown confusion among your enemies! Forever will you be remembered as the leader who brought peace to this weary world! = لقد انتصرت على أعدائك بفن الدبلوماسية! دهاؤك وحكمتك أكسباك أصدقاء عظاماً - وفرّقا أعداءك وزرعا الارتباك بينهم! سيُذكر اسمك للأبد كالزعيم الذي جلب السلام لهذا العالم المتعب!

Do things to win! = افعل أشياء لتفوز!
Have highest score after max turns = امتلاك أعلى نقاط بعد أقصى عدد للدورات


