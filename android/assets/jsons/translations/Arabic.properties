Maria Theresa = ماريا تيريزا
Shame that it has come this far. But ye wished it so. Next time, be so good, choose your words more wisely. = يا للأسف أن وصل الأمر إلى هذا الحد. لكنكم أردتموه. في المرة القادمة، تفضلوا باختيار كلماتكم بحكمة أكبر.
What a fool ye are! Ye will end swiftly and miserably. = يا لكم من أحمق! ستنتهون سريعاً وبائسين.
The world is pitiful! There's no beauty in it, no wisdom. I am almost glad to go. = العالم مثير للشفقة! لا جمال فيه ولا حكمة. أنا فرحة تقريباً بالرحيل.
The archduchess of Austria welcomes your Eminence to... Oh let's get this over with! I have a luncheon at four o'clock. = تحيي أرشيدوقة النمسا فخامتك في... آه لننهِ هذا بسرعة! لدي غداء في الرابعة.
I see you admire my new damask. Nobody should say that I am an unjust woman. Let's reach an agreement! = أرى أنك معجب بنسيجي الدمشقي الجديد. لا ينبغي لأحد أن يقول إنني امرأة ظالمة. لنتوصل إلى اتفاق!
Oh, it's ye! = آه، إنه أنتم!
Diplomatic Marriage = الزواج الدبلوماسي
Noble and pious Queen Maria Theresa, Holy Roman Empress and sovereign of Austria, the people revere your grace. After the death of your father King Charles VI, you inherited the throne of Austria during difficult economic and military times. But you used your wisdom and unflinching determination to fend off your foes and resolve any obstacles to stability and prosperity. With your husband Francis Stephen at your side as co-ruler, you assured your place as Empress of the Holy Roman Empire. During your reign, you reformed Austria in several domains, as you gifted it with a powerful army, a stable economic model, and an improved educational system. = أيتها الملكة النبيلة التقية ماريا تيريزا، إمبراطورة الإمبراطورية الرومانية المقدسة وحاكمة النمسا، الشعب يجل نعمتك. بعد وفاة والدك الملك تشارلز السادس ورثت عرش النمسا في أوقات اقتصادية وعسكرية صعبة. لكنك استخدمت حكمتك وعزيمتك الراسخة لصد أعدائك وحل أي عقبات أمام الاستقرار والازدهار.
O Great Queen, proud and dignified, by the will of God and the Divine right, can you reach the height of prosperity and splendor the kingdom of Austria deserves? Will your new empire shine through the ages of history? = أيتها الملكة العظيمة الفخورة الوقورة، بإرادة الله والحق الإلهي، هل تستطيعين بلوغ قمة الازدهار والروعة التي تستحقها مملكة النمسا؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
