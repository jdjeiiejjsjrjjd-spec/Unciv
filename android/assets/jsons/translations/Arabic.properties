Augustus Caesar = أغسطس قيصر
My treasury contains little and my soldiers are getting impatient... (sigh) ...therefore you must die. = خزينتي شبه فارغة وجنودي ينفد صبرهم... (تنهد) ...لذلك يجب أن تموت.
So brave, yet so stupid! If only you had a brain similar to your courage. = يا للشجاعة والغباء! ليتك تملك عقلاً يضاهي شجاعتك.
The gods have deprived Rome of their favour. We have been defeated. = حرمت الآلهة روما من رضاها. لقد هُزمنا.
I wasn't sure, but it seems you do have some grit. = لم أكن متأكداً، لكن يبدو أنك تملك بعض الصلابة فعلاً.
I greet you. I am Augustus, Imperator and Pontifex Maximus of Rome. If you are a friend of Rome, you are welcome. = أحييك. أنا أغسطس، الإمبراطور والحبر الأعظم لروما. إن كنت صديقاً لروما فأنت مرحب بك.
I offer this, for your consideration. = أعرض هذا لتنظر فيه.
Hail. = السلام.
What do you want? = ماذا تريد؟
The Glory of Rome = مجد روما
Ave Caesar Augustus, Emperor of Rome and Dominus of the Roman Empire! Your empire was the most powerful and feared of all in Western civilization. The Roman people crafted so brilliantly its culture, law, art, and warfare, that no one could contest the supremacy of Rome. Force and Honor led to glorious conquests, a domination of all the lands from Spain in the west to Syria in the east, even reaching the remote barbarian lands of England and Germany. Roman art and architecture have been praised for millenia and have been envied by all lesser civilizations who have followed. = السلام على قيصر أغسطس، إمبراطور روما وسيد الإمبراطورية الرومانية! كانت إمبراطوريتك أقوى الإمبراطوريات وأكثرها رهبة في الحضارة الغربية. صاغ الشعب الروماني ثقافته وقانونه وفنه وحربه ببراعة حتى لم يستطع أحد منازعة سيادة روما. القوة والشرف قادا إلى فتوحات مجيدة وهيمنة على كل الأراضي من إسبانيا غرباً إلى سوريا شرقاً، بل بلغت أراضي البرابرة النائية في إنجلترا وألمانيا. وقد مُدحت العمارة والفنون الرومانية آلاف السنين وحسدتها كل الحضارات الأدنى التي تلتها.
O glorious Imperator, your people celebrate you and ask for the glory of Rome! In these times of darkness, the Pax Romana will be a beacon of light for all! Will your new empire shine through the ages of history? = أيها الإمبراطور المجيد، شعبك يحتفي بك ويطلب مجد روما! في هذه الأزمنة المظلمة سيكون السلام الروماني منارة نور للجميع! هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
