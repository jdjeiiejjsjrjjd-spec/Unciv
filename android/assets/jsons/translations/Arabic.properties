Ahmad al-Mansur = أحمد المنصور

Alexander the Great, born in Macedon, was one of the most skilled generals, even more by his young age, and in only 17 years he conquered all the Greek known world. = كان الإسكندر الأكبر، المولود في مقدونيا، من أمهر القادة العسكريين، ولا سيما في سنه الصغيرة، وفي 17 عاماً فقط فتح كل العالم اليوناني المعروف.

Ashurbanipal = آشوربانيبال

