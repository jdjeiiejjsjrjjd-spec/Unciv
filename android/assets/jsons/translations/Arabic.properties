Pachacuti = باتشاكوتي
Resistance is futile! You cannot hope to stand against the mighty Incan empire. If you will not surrender immediately, then prepare for war! = المقاومة عبث! لا يمكنك الأمل في الصمود أمام إمبراطورية الإنكا العظيمة. إن لم تستسلم فوراً، فاستعد للحرب!
Declare war on me?!? You can't, because I declare war on you first! = تعلن عليّ الحرب؟!؟ لا يمكنك، لأنني أعلن عليك الحرب أولاً!
How did you darken the sun? I ruled with diligence and mercy—see that you do so as well. = كيف أظلمت الشمس؟ لقد حكمت باجتهاد ورحمة—احرص على أن تفعل مثلي.
How are you? You stand before Pachacuti Inca Yupanqui. = كيف حالك؟ أنت تقف أمام باتشاكوتي إنكا يوبانكي.
The Incan people offer this fair trade. = شعب الإنكا يقدم هذه الصفقة العادلة.
How are you doing? = كيف حالك؟
What do you want now? = ماذا تريد الآن؟
Great Andean Road = الطريق الأنديزي العظيم
King Pachacuti Sapa Inca, maker of the world and ruler of Tawantinsuyu and the Inca people, your loyal subjects greet you! In the beginning, the small state of Cusco already showed the Incans were promised for greatness. They won many wars against powerful enemies, relentlessly crushing any army that dared oppose them, and forged a mighty empire stretching from Ecuador to Chile, the greatest ever seen in pre-Columbian America. Not just undaunted soldiers, Inca people were accomplished builders and artists, their magnificient and unequalled culture still fascinating the world today. = أيها الملك باتشاكوتي ساپا إنكا، صانع العالم وحاكم تاوانتينسويو وشعب الإنكا، رعاياك المخلصون يحيونك! في البداية أظهرت دولة كوسكو الصغيرة أن الإنكا موعودون بالعظمة. فازوا في حروب كثيرة ضد أعداء أقوياء، وسحقوا بلا هوادة أي جيش جرؤ على معارضتهم، وصاغوا إمبراطورية عظيمة تمتد من الإكوادور إلى تشيلي، أعظم ما شهدته أمريكا قبل كولومبوس.
O Emperor Pachacuti, honor your name of 'Earth Shaker'! Will you once again summon the power of the earth to unite all Incan people under the protection of Sapa Inca, the Son of the Sun? Will your new empire shine through the ages of history? = أيها الإمبراطور باتشاكوتي، شرّف اسمك 'مزلزل الأرض'! هل ستستدعي مرة أخرى قوة الأرض لتوحيد جميع شعب الإنكا تحت حماية ساپا إنكا، ابن الشمس؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
