Catherine = كاترين
You've behaved yourself very badly, you know it. Now it's payback time. = لقد أسأت التصرف كثيراً، وتعلم ذلك. والآن حان وقت الحساب.
You've mistaken my passion for a weakness, you'll regret about this. = لقد ظننت شغفي ضعفاً، وستندم على ذلك.
We were defeated, so this makes me your prisoner. I suppose there are worse fates. = لقد هُزمنا، وهذا يجعلني أسيرتك. أظن أن هناك مصائر أسوأ.
Fine then. It's your call. = حسناً إذن. القرار قرارك.
I greet you, stranger! If you are as intelligent and tactful as you are attractive, we'll get along just fine. = أحييك أيها الغريب! إن كنت ذكياً ولبقاً بقدر ما أنت جذاب، فسنتفاهم جيداً.
How would you like it if I propose this kind of exchange? = ما رأيك لو اقترحت عليك هذا النوع من التبادل؟
Hello! = أهلاً!
What do you need?! = ماذا تحتاج؟!
Siberian Riches = ثروات سيبيريا
Hail to Imperial Majesty Catherine, Empress of all Russians. Living in the largest country in the world, from the Pacific Ocean in the east to the Baltic Sea in the west, your people endured wars, droughts, and many disasters, imbuing the Russian society with heroism and tenacity, and producing artists and scientists among the best in the world. Russia is a powerful empire which rightfully claims its place in the world concert of superpowers. = السلام على جلالة الإمبراطورة كاترين، إمبراطورة جميع الروس. تعيشين في أكبر بلد في العالم، من المحيط الهادئ شرقاً إلى بحر البلطيق غرباً، وقد تحمل شعبك الحروب والجفاف وكوارث كثيرة، مما أضفى على المجتمع الروسي البطولة والصلابة، وأنجب فنانين وعلماء من أفضل ما في العالم. روسيا إمبراطورية قوية تطالب عن حق بمكانها في حفل القوى العظمى العالمية.
Empress Catherine, your people are eager for Russian glory, to revive the sacred light of the Motherland. Will your new empire shine through the ages of history? = أيتها الإمبراطورة كاترين، شعبك متشوق للمجد الروسي، ولإحياء النور المقدس للوطن الأم. هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
