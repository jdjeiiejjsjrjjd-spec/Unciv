Oda Nobunaga = أودا نوبوناغا
I hereby inform you of our intention to wipe out your civilization from this world. = أبلغك بهذا بنيتنا محو حضارتك من هذا العالم.
Pitiful fool! Now we shall destroy you! = أيها الأحمق المثير للشفقة! الآن سندمرك!
You were much wiser than I thought. = كنت أحكم بكثير مما ظننت.
I expected more for you from. = توقعت المزيد منك.
We hope for a fair and just relationship with you, who are renowned for military bravery. = نأمل في علاقة عادلة ومنصفة معك، أنت المشهور بالشجاعة العسكرية.
I would be grateful if you agreed on the following proposal. = سأكون ممتناً لو وافقت على الاقتراح التالي.
Oh, it's you... = آه، إنه أنت...
Bushido = البوشيدو
Lord Oda Nobunaga, ruler of Japan, the land of the Rising Sun is at your command! Through history, Japanese people lived and died with honor, proud of their rich culture of arts and letters. Years of bloody civil wars, invasions of foreign powers, wealth but also great poverty, have never altered the strong will of the Rising Sun island, as the Bushido spirit has imbued the fields of battle and the Japanese society for millenia. At the end of the 19th century, under foreign influence, your people took the path of modernity, and in a few decades, made of Japan a land of technological innovation and powerful industry, with which only few nations can compete. = أيها اللورد أودا نوبوناغا، حاكم اليابان، أرض الشمس المشرقة تحت أمرك! عبر التاريخ عاش اليابانيون وماتوا بشرف، فخورين بثقافتهم الغنية بالفنون والآداب. لم تغيّر سنوات الحروب الأهلية الدامية وغزوات القوى الأجنبية والثروة والفقر المدقع إرادة جزيرة الشمس المشرقة القوية، فقد تغلغلت روح البوشيدو في ساحات القتال والمجتمع الياباني آلاف السنين. وفي نهاية القرن التاسع عشر، تحت تأثير أجنبي، سلك شعبك طريق الحداثة، وفي عقود قليلة جعل من اليابان أرض الابتكار التقني.
O great daimyo, will you take on your hands the Japan destiny, for the Rising Sun to light the world? Will your new empire shine through the ages of history? = أيها الدايميو العظيم، هل ستتولى مصير اليابان بيديك لتضيء الشمس المشرقة العالم؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
