George Washington = جورج واشنطن
Your wanton aggression leaves us no choice. Prepare for war! = عدوانكم الطائش لا يترك لنا خياراً. استعدوا للحرب!
You have mistaken our love of peace for weakness. You shall regret this! = لقد ظننتم حبنا للسلام ضعفاً. ستندمون على هذا!
The day...is yours. I hope you will be merciful in your triumph. = اليوم...لك. آمل أن تكون رحيماً في انتصارك.
The people of the United States of America welcome you. = شعب الولايات المتحدة الأمريكية يرحب بكم.
Is the following trade of interest to you? = هل الصفقة التالية تهمك؟
Well? = حسناً؟
Manifest Destiny = القدر الجلي
President Washington, we salute you and the proud American civilization! Freed from the British dominion in the 18th century, then cleansed and reborn after a terrible civil war, the United States nation was ready to play its great role in the 20th century. At the height of its power, triumphant after two terrible world wars, United States of America, a land of immigration, opportunities, optimism and determination, has risen above all other weakening nations, unable to equal such power. = أيها الرئيس واشنطن، نحييك ونحيي الحضارة الأمريكية الفخورة! بعد تحررها من الهيمنة البريطانية في القرن الثامن عشر، ثم تطهرها وبعثها بعد حرب أهلية رهيبة، كانت الولايات المتحدة جاهزة للعب دورها العظيم في القرن العشرين. وفي أوج قوتها، منتصرة بعد حربين عالميتين رهيبتين، ارتفعت الولايات المتحدة الأمريكية، أرض الهجرة والفرص والتفاؤل والعزيمة، فوق كل الأمم الأخرى الضعيفة العاجزة عن مجاراة هذه القوة.
President Washington, will you show to the world the legitimacy of the American way of life, and spread the flame of liberty to all mankind? Will your new empire shine through the ages of history? = أيها الرئيس واشنطن، هل ستُري العالم شرعية أسلوب الحياة الأمريكي، وتنشر شعلة الحرية بين البشرية جمعاء؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
