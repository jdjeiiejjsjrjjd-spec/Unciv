A sacrifice unlike all others must be made! = يجب تقديم قربان لا مثيل له!
Muahahahahahaha! = هاهاهاهاهاها!
Today comes a great searing pain. With you comes the path to the black storm. = اليوم يأتي ألم عظيم حارق. معك يأتي الطريق إلى العاصفة السوداء.
Greetings, wayward one. I am known as Pacal. = تحياتي أيها التائه. أُعرف باسم باكال.
Friend, I believe I may have found a way to save us all! Look, look and accept my offering! = يا صديقي، أظنني وجدت طريقة لإنقاذنا جميعاً! انظر، انظر واقبل قرباني!
A fine day, it helps you. = يوم جميل، يساعدك.
The Long Count = العد الطويل
Kneel before King Pacal the Great, son of the gods and protector of the Palenque domain! After your kingdom has been harassed for years by neighboring rivals, you struck back at the enemies of your people, defeating each of them and sacrificing their leaders as a retribution to the insults made to your ancestors. Your wisdom and hard will not only restored the glory of Palenque, but turned it into a magnificient city, as your people built the greatest monuments and architecture the world has ever known. = اركع أمام الملك باكال العظيم، ابن الآلهة وحامي أرض بالينكي! بعد سنوات من مضايقة الخصوم المجاورين لمملكتك، رددت الضربة على أعداء شعبك، وهزمت كلاً منهم وضحيت بقادتهم قرباناً انتقاماً للإهانات الموجهة إلى أسلافك. حكمتك وإرادتك الصلبة لم تعيدا مجد بالينكي فحسب، بل حولتاها إلى مدينة رائعة.
Absolute King, your people need you to save the great Mayan culture and knowledge. Will you be able to read the movement of the stars, and find in the heavens the power to repel any foes? Will your new empire shine through the ages of history? = أيها الملك المطلق، شعبك يحتاجك لإنقاذ ثقافة المايا العظيمة ومعارفها. هل ستتمكن من قراءة حركة النجوم، وإيجاد القوة في السماوات لصد أي أعداء؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
