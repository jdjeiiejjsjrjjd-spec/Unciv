Harun al-Rashid = هارون الرشيد
The world will be more beautiful without you. Prepare for war. = سيكون العالم أجمل بدونك. استعد للحرب.
Fool! You will soon regret dearly! I swear it! = أيها الأحمق! سرعان ما ستندم أشد الندم! أقسم على ذلك!
You have won, congratulations. My palace is now in your possession, and I beg that you care well for the peacock. = لقد فزت، مبروك. قصري الآن في حوزتك، وأرجو أن تعتني جيداً بالطاووس.
Our future battle will be glorious. = معركتنا القادمة ستكون مجيدة.
Welcome foreigner, I am Harun Al-Rashid, Caliph of the Arabs. Come and tell me about your empire. = أهلاً بالغريب، أنا هارون الرشيد، خليفة العرب. تعالَ وحدثني عن إمبراطوريتك.
Come forth, let's do business. = تعال، لنتاجر.
Peace be upon you. = السلام عليكم.
Trade Caravans = قوافل التجارة
Blessings of the Great God be upon you, O great caliph Harun al-Rashid, leader of the mighty Arabian people! The Muslim Empire, the Caliphate, born from chaos after the death of the prophet Muhammad in 632 AD, intended to apply the rule of God to all Earth. And by the will of God, the caliphate reached its full power, ruling Spain, North Africa, the Middle East, Anatolia, the Balkans and Persia, to even surpass the Great Roman Empire. The arts and sciences were a holy gift of Arabia during the Middle Ages, as the infidel lands of Europe delved deep into ignorance and chaos. Lasting for six hundred years, the Caliphate finally fell before the Mongols, the plague of the civilized world. = بركات الله العظيم عليك يا خليفة هارون الرشيد، قائد الشعب العربي العظيم! أراد العالم الإسلامي، الخلافة، التي وُلدت من الفوضى بعد وفاة النبي محمد عام 632 م، أن يطبق حكم الله على الأرض كلها. وبمشيئة الله بلغت الخلافة أوج قوتها، فحكمت إسبانيا وشمال أفريقيا والشرق الأوسط والأناضول والبلقان وفارس، بل تجاوزت الإمبراطورية الرومانية العظيمة. وكانت الفنون والعلوم هبة مقدسة من بلاد العرب في العصور الوسطى، بينما غاصت أراضي أوروبا في الجهل والفوضى.
Great Caliph Harun al Rashid, all Arabian people long for greatness! Arabia must be once again the land of arts and knowledge, which under the radiant law of God, will fear no enemy! Will your new empire shine through the ages of history? = أيها الخليفة العظيم هارون الرشيد، كل الشعب العربي يتوق إلى العظمة! يجب أن تعود بلاد العرب أرض الفنون والمعرفة، التي لن تخشى أي عدو في ظل شريعة الله المنيرة! هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
