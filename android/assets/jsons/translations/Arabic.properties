Suleiman I = سليمان الأول
Your continued insolence and failure to recognize our preeminence leads us to war. = وقاحتك المستمرة وإخفاقك في الاعتراف بسيادتنا يقودنا إلى الحرب.
Good. The world shall witness the incontestable might of my armies and the glory of the Empire. = حسناً. سيشهد العالم القوة التي لا تُنازَع لجيوشي ومجد الإمبراطورية.
Ruin! Ruin! Istanbul becomes Iram of the Pillars, remembered only by the melancholy poets. = خراب! خراب! تصبح إسطنبول إرم ذات العماد، لا يتذكرها إلا الشعراء الحزانى.
From the magnificence of Topkapi, the Ottoman nation greets you, stranger! I'm Suleiman, Kayser-I Rum, and I bestow upon you my welcome! = من فخامة توبكابي، تحييك الأمة العثمانية أيها الغريب! أنا سليمان، قيصر الروم، وأرحب بك!
Let us do business! Would you be interested? = لنتاجر! هل أنت مهتم؟
Barbary Corsairs = قراصنة البربر
O Great Sultan Suleiman, may the God bless you! You are revered for your power, wealth and generosity, and you truly deserves to be called the 'Magnificent'! The Ottoman Empire was born in Bithynia, starting as a small country in Eastern Anatolia in 12th century, then expanded to west into Anatolia. Over the next century, your people vanquished the empire of Byzantium, annexing Turkey and the Balkans, and smartly assimilating all wonders and knowledge of the Byzantine civilization. In the mid 15th century, the Ottomans added Constantinople to their empire, establishing a strategic link between Europe and the Middle East. The Empire would continue to expand for centuries reaching North Africa, Middle East and Eastern Europe at its height, but brutally disappeared in the chaos of the first world war, in early 20th century. = أيها السلطان العظيم سليمان، ليباركك الله! أنت موقر لقوتك وثروتك وكرمك، وتستحق حقاً لقب 'القانوني'! وُلدت الإمبراطورية العثمانية في بيثينيا، بدأت دولة صغيرة في شرق الأناضول في القرن الثاني عشر، ثم توسعت غرباً داخل الأناضول. وفي القرن التالي هزم شعبك إمبراطورية بيزنطة، وضم تركيا والبلقان، واستوعب بذكاء كل عجائب الحضارة البيزنطية ومعارفها. وفي منتصف القرن الخامس عشر أضاف العثمانيون القسطنطينية إلى إمبراطوريتهم.
Mighty Caliph, your people ask you to build again the Empire, to the level of power and glory it once achieved, and beyond! Will you revive the Ottoman golden age? Will your new empire shine through the ages of history? = أيها الخليفة القوي، شعبك يطلب منك إعادة بناء الإمبراطورية إلى مستوى القوة والمجد الذي بلغته يوماً، وما بعده! هل ستحيي العصر الذهبي العثماني؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
