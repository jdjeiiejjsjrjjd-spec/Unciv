Montezuma I = مونتيزوما الأول
Xi-miqa-can! Xi-miqa-can! Xi-miqa-can! (Die, die, die!) = شي-ميكا-كان! شي-ميكا-كان! شي-ميكا-كان! (موتوا، موتوا، موتوا!)
Excellent! Let the blood flow in raging torrents! = ممتاز! لتجرِ الدماء في سيول هائجة!
Monster! Who are you to destroy my greatness? = وحش! من أنت لتدمر عظمتي؟
What do I see before me? Another beating heart for my sacrificial fire. = ماذا أرى أمامي؟ قلب نابض آخر لنار قرباني.
Accept this agreement or suffer the consequences. = اقبل هذه الاتفاقية أو عانِ العواقب.
Welcome, friend. = مرحباً بك يا صديقي.
Sacrificial Captives = الأسرى القرابين
O divine Montezuma, your people welcome you! May your magnificence inspire all living things! The mighty Aztecs were nomads until the 12th century, when they choose to settle in the mesa central, which would later be called Mexico. Wars were frequent with other tribes to control the rich land surrounding the sacred lakes of Texcoco, Xaltocan and Zampango. In some 200 years, double-sided alliances and martial prowess made of the Aztecs the dominant power in the Central American basin, forming a mighty empire stretching from sea to sea. Alas, the empire fell under the assault of foreign devils - the Spaniards and many curses they brought with them! Wars between tribes and weaponry of doom used by the invaders made the great Aztec civilization crumble in only a few decades. = أيها مونتيزوما الإلهي، شعبك يرحب بك! لتلهم روعتك كل الكائنات الحية! كان الأزتك الأقوياء رحّلاً حتى القرن الثاني عشر، حين اختاروا الاستقرار في الهضبة الوسطى، التي ستُسمى لاحقاً المكسيك. وكانت الحروب متكررة مع القبائل الأخرى للسيطرة على الأرض الغنية المحيطة ببحيرات تكسكوكو وكسالتوكان وزامبانغو. وفي نحو 200 عام جعلت التحالفات المزدوجة والبراعة القتالية من الأزتك القوة المهيمنة في حوض أمريكا الوسطى.
O mighty King Montezuma, do you hear the call of your people seeking for revenge? Will you lead them to victory under the light of the Five Suns? Will your new empire shine through the ages of history? = أيها الملك العظيم مونتيزوما، هل تسمع نداء شعبك الساعي للانتقام؟ هل ستقودهم إلى النصر تحت ضوء الشموس الخمس؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
