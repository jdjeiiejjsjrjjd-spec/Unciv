Gandhi = غاندي
I have just received a report that large numbers of my troops have crossed your borders. = لقد تلقيت للتو تقريراً بأن أعداداً كبيرة من جنودي عبرت حدودكم.
My attempts to avoid violence have failed. An eye for an eye only makes the world blind. = فشلت محاولاتي لتجنب العنف. العين بالعين لا تصنع إلا عالماً أعمى.
You can chain me, you can torture me, you can even destroy this body, but you will never imprison my mind. = يمكنك أن تقيدني، يمكنك أن تعذبني، يمكنك حتى أن تدمر هذا الجسد، لكنك لن تسجن عقلي أبداً.
Curious. = غريب.
Hello, I am Mohandas Gandhi. My people call me Bapu, but please, call me friend. = مرحباً، أنا موهانداس غاندي. شعبي يسميني باپو، لكن أرجوك، ناديني صديقاً.
My friend, are you interested in this arrangement? = يا صديقي، هل أنت مهتم بهذا الترتيب؟
I wish you peace. = أتمنى لك السلام.
Population Growth = نمو السكان
Wise Mahatma Gandhi, great leader of India, we honor you! India is one of the oldest countries in the world with 10,000 years of history, built on spirit and religion, as three of the world's great religions - Hinduism, Buddhism and Jainism - appeared on this sacred land. Every aspect of India society reveres art, music and color, showing great wealth but also grinding poverty. For centuries, India was torn between local kingdoms fighting each other but also repelling invaders. In the 12th century AD, Muslim Turks tried to conquer India, then the Mongols took their place. In the early 17th century, India, still fragmented, was colonized by the English and their diplomacy and technological superiority. After two centuries of British dominion, Indian nationalism woke up, and you, Great Mahatma, have led a peaceful and victorious rebellion never seen anywhere in history! = أيها المهاتما غاندي الحكيم، قائد الهند العظيم، نحن نكرمك! الهند من أقدم بلدان العالم بتاريخ يمتد 10000 عام، بُنيت على الروح والدين، إذ ظهرت على هذه الأرض المقدسة ثلاثة من أديان العالم الكبرى - الهندوسية والبوذية والجاينية. كل جانب من المجتمع الهندي يجل الفن والموسيقى واللون، مظهراً ثروة عظيمة وفقراً مدقعاً. قروناً تمزقت الهند بين ممالك محلية يقاتل بعضها بعضاً وتصد الغزاة. وفي القرن الثاني عشر الميلادي حاول الأتراك المسلمون غزو الهند، ثم حل المغول مكانهم.
Gandhi, your people ask again to be led on the path of freedom. Under protection of Ganesha and Surya, can India accomplish its great potential? Will your new empire shine through the ages of history? = يا غاندي، شعبك يطلب مجدداً أن تقوده على درب الحرية. تحت حماية غانيشا وسوريا، هل تستطيع الهند تحقيق إمكاناتها العظيمة؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
