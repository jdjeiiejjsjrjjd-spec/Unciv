Hiawatha = هياواثا
You are a plague upon Mother Earth! Prepare for battle! = أنت وباء على الأرض الأم! استعد للمعركة!
You evil creature! My braves will slaughter you! = أيها المخلوق الشرير! سيذبحك محاربيّ!
You have defeated us... but our spirits will never be vanquished! We shall return! = لقد هزمتنا... لكن أرواحنا لن تُقهر أبداً! سنعود!
Words alone cannot shake the roots of peace I have planted among my people. = الكلمات وحدها لا تهز جذور السلام التي زرعتها بين شعبي.
Greetings, stranger. I am Hiawatha, speaker for the Iroquois. We seek peace with all, but we do not shrink from war. = تحياتي أيها الغريب. أنا هياواثا، متحدث الإيروكوا. نسعى إلى السلام مع الجميع، لكننا لا نتراجع عن الحرب.
Does this trade work for you, my friend? = هل تناسبك هذه الصفقة يا صديقي؟
The Great Warpath = درب الحرب العظيم
Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Your people lived near the great and holy lake Ontario since the ancient ages, on a land that will be later known as New York city. Long ago, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida became one nation, the Haudenosaunee, the Iroquois. Although not having a written language, the wise Iroquois created the Great Law of Peace, which can be considered the first established constitution. For decades, your people fought powerful enemies, such as the Huron, and then the French and English colonists. With less warriors and inferior weaponry, the Iroquois still survived and walk on the path of peace and harmony, until their way of living faded away under the crush of the newborn United States nation. = تحياتي أيها النبيل هياواثا، قائد أمم الإيروكوا العظيمة! عاش شعبك قرب بحيرة أونتاريو العظيمة المقدسة منذ العصور القديمة، على أرض ستُعرف لاحقاً بمدينة نيويورك. منذ زمن بعيد صارت الشعوب الخمسة، السنيكا والأونونداغا والموهوك والكايوغا والأونيدا، أمة واحدة هي الهودينوسوني، الإيروكوا. ورغم عدم امتلاكهم لغة مكتوبة، أنشأ الإيروكوا الحكماء قانون السلام العظيم، الذي يمكن اعتباره أول دستور مُقرَّ. وقاتل شعبك عقوداً أعداء أقوياء كالهورون ثم المستعمرين الفرنسيين والإنجليز.
Great Sachem Hiawatha, do you hear the complaints of your people? Can you light the path leading to the ancient Iroquois union? Will your new empire shine through the ages of history? = أيها الساشيم العظيم هياواثا، هل تسمع شكاوى شعبك؟ هل تستطيع إضاءة الدرب المؤدي إلى اتحاد الإيروكوا القديم؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
