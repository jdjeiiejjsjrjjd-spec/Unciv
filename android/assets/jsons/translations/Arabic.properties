Great King Alexander, leader of the mighty Greek nation, you are truly blessed by the gods. In 480 BC, quarrelsome city-states such as Athens, Sparta, Thebes, found a way to join their forces, allowing Greece to defeat the mighty Persia in the 5th century BC, both on land and sea. Following their example, you lead a Greek coalition and finally struck down the Persian Empire in 331 BC. You conquered almost all the known world, and from Europe to Africa to India, you built an empire unmatched by any before it. = أيها الملك العظيم الإسكندر، قائد الأمة اليونانية العظيمة، لقد باركتك الآلهة حقاً. في عام 480 ق.م وجدت دول المدن المتخاصمة كأثينا وإسبرطة وطيبة طريقة لتوحيد قواها، فتمكنت اليونان من هزيمة بلاد فارس العظيمة في القرن الخامس ق.م براً وبحراً. وعلى مثالها قدت تحالفاً يونانياً وحطمت أخيراً الإمبراطورية الفارسية عام 331 ق.م. فتحت كل العالم المعروف تقريباً، ومن أوروبا إلى أفريقيا إلى الهند بنيت إمبراطورية لم يسبقها مثيل.
