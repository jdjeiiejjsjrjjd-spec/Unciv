Otto von Bismarck = أوتو فون بسمارك
I cannot wait until ye grow even mightier. Therefore, prepare for war! = لا أطيق الانتظار حتى تزداد قوة. لذلك استعدوا للحرب!
Corrupted villain! We will bring you into the ground! = أيها الشرير الفاسد! سندكّك في الأرض!
Germany has been destroyed. I weep for the future generations. = لقد دُمرت ألمانيا. أبكي على الأجيال القادمة.
That wild bravado? It's a ticking time bomb, especially when you're all bark and no bite! = تلك الجرأة الهوجاء؟ إنها قنبلة موقوتة، خاصة حين تكون كثير النباح قليل العض!
Guten Tag. In the name of the great German people, I bid you welcome. = يوم سعيد. باسم الشعب الألماني العظيم، أرحب بكم.
It would be in your best interest, to carefully consider this proposal. = من مصلحتك أن تنظر في هذا الاقتراح بعناية.
What now? = ماذا الآن؟
So, out with it! = هيا، قلها!
Furor Teutonicus = الغضب التوتوني
All hail to Otto von Bismarck, first chancellor of Germany and its empire! During the ancient era, Germany was a land fragmented in several tribes but already showed great promise as the Roman Empire itself struggled to bend the Germans to its will. Germany, as one nation, was slowly built on the ruins of the Holy Roman Empire, and waited 1871 to be finally unified after the glorious victory on France and Napoleon III. The German people are creative, intelligent, industrious and proven to be talented warriors through history. Despite great catastrophes and failures in the first half of the 20th century, Germany can always rely on its people will and strength to be among the greatest and powerful nations in the world. = المجد لأوتو فون بسمارك، أول مستشار لألمانيا وإمبراطوريتها! في العصور القديمة كانت ألمانيا أرضاً مجزأة إلى عدة قبائل لكنها أظهرت وعداً كبيراً أصلاً حتى كافحت الإمبراطورية الرومانية نفسها لإخضاع الألمان. وبُنيت ألمانيا كأمة واحدة ببطء على أنقاض الإمبراطورية الرومانية المقدسة، وانتظرت عام 1871 لتتوحد أخيراً بعد النصر المجيد على فرنسا ونابليون الثالث. الشعب الألماني مبدع وذكي ومجتهد وأثبت عبر التاريخ أنه محارب موهوب.
Great Prince Bismarck, glory and power are at the heart of the German nation. Your people are bright, and lend you their iron will to lead Germany once again. Will your new empire shine through the ages of history? = أيها الأمير العظيم بسمارك، المجد والقوة في قلب الأمة الألمانية. شعبك ذكي ويمنحك إرادته الحديدية لتقود ألمانيا مرة أخرى. هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
