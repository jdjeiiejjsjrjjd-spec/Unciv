#################### Lines from Global Tutorials ####################

Welcome to Unciv!\nBecause this is a complex game, there are basic tasks to help familiarize you with the game.\nThese are completely optional, and you're welcome to explore the game on your own! = مرحباً بك في Unciv!\nلأن هذه لعبة معقدة، هناك مهام أساسية تساعدك على التعرف عليها.\nهي اختيارية تماماً، ولك أن تستكشف اللعبة بنفسك!

Welcome to Unciv! = مرحباً بك في Unciv!
Because this is a complex game, there are some tutorials to help familiarize you with it. These can be disabled in the Options -> Display menu, but please hang on if you're new here! = لأن هذه لعبة معقدة، هناك بعض الإرشادات التي تساعدك على التعرف عليها. يمكن تعطيلها من الخيارات ← العرض، لكن يرجى الاستمرار إن كنت جديداً هنا!
Your first mission is to found your capital city. This is actually an important task because your capital city will probably be your most prosperous. Many game bonuses apply only to your capital city, and it will be the center of your empire. = مهمتك الأولى هي تأسيس عاصمتك. وهذه مهمة مهمة فعلاً لأن عاصمتك ستكون على الأرجح أكثر مدنك ازدهاراً. كثير من مكافآت اللعبة تنطبق على العاصمة فقط، وستكون مركز إمبراطوريتك.
How do you know a city location is appropriate? Luckily, the game has already chosen a good location for you. You can settle in this place, or maybe move a turn to found on a Hill (for Production and defence) or next to a Mountain (to gain access to the Observatory building later on). = كيف تعرف أن موقع المدينة مناسب؟ لحسن الحظ اختارت اللعبة لك موقعاً جيداً بالفعل. يمكنك الاستيطان في هذا المكان، أو التحرك دوراً لتأسيسها على تل (للإنتاج والدفاع) أو بجانب جبل (للوصول إلى مبنى المرصد لاحقاً).
You'll likely want more cities later on. For these cities, you must go and find a good place. Looking for and founding on or near Luxury resources is a good rule of thumb. = ستحتاج على الأرجح إلى مدن أخرى لاحقاً. لهذه المدن عليك أن تبحث عن موقع جيد. والبحث عن موارد الرفاهية والتأسيس عليها أو بقربها قاعدة جيدة.
Luxury resources are tiles that have things like Gems, Cotton, or Silk (indicated by a yellow background of the resource icon). These resources make your civilization happy. You should also keep an eye out for resources needed to build units, such as Iron. Cities cannot be built within 3 tiles of existing cities, which is another thing to keep in mind! = موارد الرفاهية هي مربعات فيها أشياء مثل الأحجار الكريمة أو القطن أو الحرير (يشار إليها بخلفية صفراء لأيقونة المورد). هذه الموارد تجعل حضارتك سعيدة. وعليك أيضاً مراقبة الموارد اللازمة لبناء الوحدات مثل الحديد. ولا يمكن بناء المدن ضمن 3 مربعات من المدن الموجودة، وهو أمر آخر يجب وضعه في الحسبان!
Cities will house Citizens, which can work tiles up to 3 tiles away from the city. This means you don’t have to settle cities right on or next to good tiles. Let’s say, for example, that you want access to some Iron – but the resource is in a desert area. You don’t have to settle your city in the desert. You can settle a few tiles away in more prosperous lands. Your city will grow and eventually gain access to the resource. You only need to settle right on top of resources if you need them immediately. = ستحوي المدن مواطنين، يستطيعون العمل في مربعات تبعد حتى 3 مربعات عن المدينة. وهذا يعني أنه لا يجب أن تستوطن المدن فوق المربعات الجيدة أو بجانبها مباشرة. لنفترض مثلاً أنك تريد الوصول إلى بعض الحديد – لكن المورد في منطقة صحراوية. لا يلزمك أن تستوطن مدينتك في الصحراء. يمكنك الاستيطان على بعد بضعة مربعات في أراضٍ أكثر ازدهاراً. ستنمو مدينتك وتصل في النهاية إلى المورد. لا تحتاج إلى الاستيطان فوق الموارد مباشرة إلا إذا كنت تحتاجها فوراً.
The first thing coming out of your city depends on the strategy you want to follow, but the 'classic' build order is to build first two Scouts, then a Shrine, and three Settlers, and adopt Tradition, to explore the map quickly (Scouts ignore terrain cost), and to get an early Pantheon (if you're playing with religion enabled). = أول ما يخرج من مدينتك يعتمد على الاستراتيجية التي تريد اتباعها، لكن ترتيب البناء 'الكلاسيكي' هو بناء كشافين أولاً، ثم ضريح، وثلاثة مستوطنين، واعتماد التقليد، لاستكشاف الخريطة بسرعة (فالكشافة تتجاهل تكلفة التضاريس) والحصول على مجمع آلهة مبكر (إذا كنت تلعب والدين مفعّل).
But feel free to experiment with your own build orders! = لكن لا تتردد في تجربة ترتيبات البناء الخاصة بك!

In your first couple of turns, you will have very little options, but as your civilization grows, so do the number of things requiring your attention. = في أول دورات قليلة ستكون خياراتك محدودة جداً، لكن مع نمو حضارتك يزداد عدد الأمور التي تتطلب اهتمامك.

Culture and Policies = الثقافة والسياسات
Each turn, the culture you gain from all your cities is added to your Civilization's culture.\nWhen you have enough culture, you may pick a Social Policy, each one giving you a certain bonus. = في كل دورة تُضاف الثقافة التي تكسبها من جميع مدنك إلى ثقافة حضارتك.\nعندما تملك ثقافة كافية، يمكنك اختيار سياسة اجتماعية، وكل واحدة تمنحك مكافأة معينة.
The policies are organized into branches, with each branch providing a bonus ability when all policies in the branch have been adopted. = السياسات منظمة في فروع، وكل فرع يمنح قدرة إضافية عند اعتماد جميع سياساته.
With each policy adopted, and with each city built,\n  the cost of adopting another policy rises - so choose wisely! = مع كل سياسة تُعتمد، ومع كل مدينة تُبنى،\n  ترتفع تكلفة اعتماد السياسة التالية - فاختر بحكمة!

City Expansion = توسع المدينة
Once a city has gathered enough Culture, it will expand into a neighboring tile.\nYou have no control over the tile it will expand into, but tiles with resources and higher yields are prioritized. = بمجرد أن تجمع المدينة ثقافة كافية، ستتوسع إلى مربع مجاور.\nلا تملك سيطرة على المربع الذي ستتوسع إليه، لكن المربعات ذات الموارد والعائدات الأعلى لها الأولوية.
Each additional tile will require more culture, but generally your first cities will eventually expand to a wide tile range. = كل مربع إضافي سيتطلب ثقافة أكبر، لكن عموماً ستتوسع مدنك الأولى في النهاية إلى نطاق واسع من المربعات.
Although your city will keep expanding forever, your citizens can only work 3 tiles away from city center.\nThis should be taken into account when placing new cities. = رغم أن مدينتك ستستمر في التوسع إلى الأبد، يستطيع مواطنوك العمل حتى 3 مربعات فقط من مركز المدينة.\nيجب أخذ هذا في الحسبان عند وضع المدن الجديدة.

Food is the resource fundamental to your Cities', and as a result Nation's, population and health. = الطعام هو المورد الأساسي لسكان مدنك، وبالتالي لسكان أمتك وصحتها.
Every Citizen in each City consumes Food per turn. Any left over is considered Growth and is stored in the City Center. Once enough accumulates, the City Grows and a new Citizen is added. = كل مواطن في كل مدينة يستهلك طعاماً في الدورة. وما يتبقى يُعدّ نمواً ويُخزَّن في مركز المدينة. وحين يتراكم ما يكفي، تنمو المدينة ويُضاف مواطن جديد.
Initially your main source of Food is the City Center itself and working a surrounding tile with a Citizen. You can increase how much is generated by gaining more Citizens to work more tiles, improving the tiles so that they yield more Food, and eventually Buildings and Policies. = في البداية مصدرك الرئيسي للطعام هو مركز المدينة نفسه والعمل في مربع محيط بمواطن. ويمكنك زيادة الإنتاج بكسب مواطنين أكثر للعمل في مربعات أكثر، وبتحسين المربعات لتعطي طعاماً أكثر، وفي النهاية بالمباني والسياسات.
Since a city's number of Citizens, or Population, determines how many tiles a City can work, Food is often the most important Resource. = ولأن عدد مواطني المدينة، أو سكانها، يحدد عدد المربعات التي يمكنها العمل بها، فالطعام غالباً أهم الموارد.

Production is the resource that lets a City Center build new things. = الإنتاج هو المورد الذي يتيح لمركز المدينة بناء أشياء جديدة.
This can be new Buildings that are added to the City Center, or new Units that can go out across the World Map to advance your Nation's goals. = قد تكون مباني جديدة تُضاف إلى مركز المدينة، أو وحدات جديدة تخرج عبر خريطة العالم لتحقق أهداف أمتك.
Everything you can build has a Production Cost. Every turn each City generates a certain amount of Production and puts it towards whatever is at the top of the Build Queue. Once the total cost is collected, the Building or Unit is built! = كل ما يمكنك بناؤه له تكلفة إنتاج. وفي كل دورة تولّد كل مدينة قدراً من الإنتاج وتوجهه نحو ما في أعلى قائمة البناء. وبمجرد جمع التكلفة الإجمالية، يُبنى المبنى أو الوحدة!
Any excess Production after something is built is overflowed to the next thing the City builds. Up to it's total Production Cost. = أي فائض إنتاج بعد بناء شيء ما يُرحَّل إلى الشيء التالي الذي تبنيه المدينة، حتى حد تكلفته الإجمالية.
Since this determines how quickly you can build more stuff, your Nation's Production Capacity is crucial to it's advancement and survival. = ولأن هذا يحدد سرعة بنائك للمزيد من الأشياء، فإن قدرة أمتك الإنتاجية حاسمة لتقدمها وبقائها.

⍾Science is the resource that unlocks new and exciting Technologies for your Nation. = ⍾العلوم هي المورد الذي يفتح تقنيات جديدة ومثيرة لأمتك.
Once you've Founded your Capital, you'll be prompted to Pick a Technology to Research. = بمجرد تأسيس عاصمتك، ستُطالَب باختيار تقنية للبحث.
Every Technology costs an amount of ⍾Science. Every turn the ⍾Science your Nation produces is paid towards Researching your chosen Technology. = كل تقنية تكلف قدراً من ⍾العلوم. وفي كل دورة تُدفع ⍾العلوم التي تنتجها أمتك نحو بحث التقنية التي اخترتها.
Once a Technology has it's cost fully paid, you unlock the benefits for your Nation! This could be new Units, Buildings, or other advantages. Any surplus will overflow into the next Technology you pick to Research. = وحين تُدفع تكلفة التقنية كاملة، تفتح فوائدها لأمتك! قد تكون وحدات جديدة أو مباني أو مزايا أخرى. وأي فائض يُرحَّل إلى التقنية التالية التي تختار بحثها.
Researching a Technology in the next Era will advance you into that Era and trigger a notification to other Nations about how amazing you are! = بحث تقنية في العصر التالي سيدخلك ذلك العصر ويطلق إشعاراً للأمم الأخرى عن مدى روعتك!
Since new Technologies tend to give access to better Units, Buildings, and even unlock powerful new Policies, staying ahead of the competition is one of the best ways to secure your Victory! = ولأن التقنيات الجديدة تمنح عادةً وحدات ومباني أفضل، بل وتفتح سياسات قوية جديدة، فالبقاء متقدماً على المنافسين من أفضل السبل لضمان نصرك!

Ah Gold. The Universal Medium of Exchange. Everyone loves Gold! They say it can't buy Happiness, but nuclear submarines are almost as good. = آه، الذهب. وسيلة التبادل العالمية. الجميع يحب الذهب! يقولون إنه لا يشتري السعادة، لكن الغواصات النووية تكاد تضاهيها.
You can earn more Gold from Tiles, Resources, Improvements, and eventually Buildings, Specialists, and Trade Routes. Ancient Ruins, meeting new City-States, and Pillaging are also great sources of Gold. During a Golden Age every Tile that already yields Gold will yield an additional Gold! = يمكنك كسب المزيد من الذهب من المربعات والموارد والتحسينات، ومن المباني والمتخصصين والطرق التجارية في النهاية. كما أن الأطلال القديمة ومقابلة الدول المدن الجديدة والنهب مصادر رائعة للذهب. وخلال العصر الذهبي سيعطي كل مربع يوفر الذهب أصلاً ذهباً إضافياً!
Gold is how you pay for Building Maintenance, Transportation Upkeep, and Unit Upkeep. If you run out of Gold, first you'll receive penalties to your ⍾Science production, then eventually your Units will start Disbanding as you can't pay their upkeep. = الذهب هو ما تدفع به صيانة المباني وتكلفة النقل وصيانة الوحدات. إذا نفد ذهبك، ستتلقى أولاً عقوبات على إنتاج ⍾العلوم، ثم ستبدأ وحداتك بالتسريح لأنك لا تستطيع دفع صيانتها.
Gold can be used to Buy Buildings and Units, helping bring up a new City or quickly build an Army. It can also buy Tiles to add to your City. It's also used to Upgrade your units from their older, obsolete forms to new, stronger versions. And investing it into a Research Agreement is a great way to convert it into ⍾Science. = يمكن استخدام الذهب لشراء المباني والوحدات، مما يساعد على إنشاء مدينة جديدة أو بناء جيش بسرعة. ويمكنه أيضاً شراء مربعات لإضافتها إلى مدينتك. ويُستخدم كذلك لترقية وحداتك من أشكالها القديمة العتيقة إلى نسخ أقوى. والاستثمار به في اتفاقية بحثية طريقة رائعة لتحويله إلى ⍾علوم.
Gold is also very valuable in Diplomacy. You can directly Gift Gold to City-States to gain their favor. Use it to balance a Trade Deal with other Nations. Or demand every last drop after a successful war and your enemy sues for peace. = الذهب ثمين جداً أيضاً في الدبلوماسية. يمكنك إهداء الذهب مباشرة إلى الدول المدن لكسب ودّها. استخدمه لموازنة صفقة تجارية مع الأمم الأخرى. أو اطلب كل قطرة منه بعد حرب ناجحة حين يطلب عدوك السلام.
Ironically, some may consider Gold to be one of the less important Resources. But it's flexible nature and importance to keep your Nation running makes it a precious thing to pay attention to. After all, everyone loves Gold. = من المفارقة أن البعض قد يعتبر الذهب من الموارد الأقل أهمية. لكن مرونته وأهميته في إبقاء أمتك تعمل تجعله شيئاً ثميناً يستحق الاهتمام. فالجميع في النهاية يحب الذهب.
Not to be confused with the Resource of the same name, Gold Ore = لا تخلطه بالمورد المسمى بالاسم نفسه، خام الذهب
Trade Route = طريق تجاري
See also: [param] = انظر أيضاً: [param]
Research Agreements = الاتفاقيات البحثية

As cities grow in size and influence, you have to deal with a happiness mechanic that is no longer tied to each individual city.\nInstead, your entire empire shares the same level of satisfaction.\nAs your cities grow in population you’ll find that it is more and more difficult to keep your empire happy. = مع نمو المدن في الحجم والنفوذ، عليك التعامل مع آلية سعادة لم تعد مرتبطة بكل مدينة على حدة.\nبدلاً من ذلك، تتشارك إمبراطوريتك بأكملها مستوى الرضا نفسه.\nومع نمو سكان مدنك ستجد أن إبقاء إمبراطوريتك سعيدة يزداد صعوبة.
In addition, you can’t even build any city improvements that increase happiness until you’ve done the appropriate research.\nIf your empire’s happiness ever goes below zero the growth rate of your cities will be hurt.\nIf your empire becomes severely unhappy (as indicated by the smiley-face icon at the top of the interface)\n  your armies will have a big penalty slapped on to their overall combat effectiveness. = إضافة إلى ذلك، لا يمكنك حتى بناء أي تحسينات للمدينة ترفع السعادة قبل أن تنجز البحث المناسب.\nإذا انخفضت سعادة إمبراطوريتك عن الصفر فسيتضرر معدل نمو مدنك.\nوإذا أصبحت إمبراطوريتك مستاءة بشدة (كما يشير رمز الوجه المبتسم أعلى الواجهة)\n  فستتلقى جيوشك عقوبة كبيرة على فعاليتها القتالية الإجمالية.
This means that it is very difficult to expand quickly in Unciv.\nIt isn’t impossible, but as a new player you probably shouldn't do it.\nSo what should you do? Chill out, scout, and improve the land that you do have by building Workers.\nOnly build new cities once you have found a spot that you believe is appropriate. = هذا يعني أن التوسع السريع صعب جداً في Unciv.\nليس مستحيلاً، لكن كلاعب جديد لا ينبغي أن تفعل ذلك على الأرجح.\nفماذا تفعل إذن؟ اهدأ، واستكشف، وحسّن الأرض التي تملكها ببناء العمال.\nلا تبنِ مدناً جديدة إلا بعد أن تجد موقعاً تراه مناسباً.

Unhappiness = الاستياء
It seems that your citizens are unhappy!\nWhile unhappy, your civilization will suffer many detrimental effects, increasing in severity as unhappiness gets higher. = يبدو أن مواطنيك مستاؤون!\nبينما هم مستاؤون، ستعاني حضارتك من آثار ضارة كثيرة تزداد حدتها مع ارتفاع الاستياء.
Unhappiness has two main causes: Population and cities.\n  Each city causes 3 unhappiness, and each population, 1 = للاستياء سببان رئيسيان: السكان والمدن.\n  كل مدينة تسبب 3 استياء، وكل نسمة 1
There are 2 main ways to combat unhappiness:\n  by building happiness buildings for your population\n  or by having improved luxury resources within your borders. = هناك طريقتان رئيسيتان لمكافحة الاستياء:\n  ببناء مباني السعادة لسكانك\n  أو بامتلاك موارد رفاهية محسّنة داخل حدودك.

You have entered a Golden Age!\nGolden age points are accumulated each turn by the total happiness \n  of your civilization\nWhen in a golden age, culture and production generation increases +20%,\n  and every tile already providing at least one gold will provide an extra gold. = لقد دخلت العصر الذهبي!\nتتراكم نقاط العصر الذهبي كل دورة من إجمالي سعادة\n  حضارتك\nفي العصر الذهبي يزداد توليد الثقافة والإنتاج بنسبة 20%،\n  وكل مربع يوفر ذهباً واحداً على الأقل سيوفر ذهباً إضافياً.

Roads and Railroads = الطرق والسكك الحديدية
Roads reduce the Movement Points required to move between two tiles connected by Roads. = الطرق تقلل نقاط الحركة اللازمة للتنقل بين مربعين متصلين بالطرق.
Railroads improve this reduction even more! = والسكك الحديدية تحسّن هذا التقليل أكثر!
This greatly improves the speed you can get Units around the map. = وهذا يحسّن كثيراً سرعة تنقل الوحدات عبر الخريطة.
Until you research the technology that removes it, Roads do not cross Rivers = إلى أن تبحث التقنية التي تزيل ذلك، لا تعبر الطرق الأنهار
Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. = ربط مدنك بالعاصمة بالطرق و/أو السكك الحديدية سيولّد ذهباً عبر الطريق التجاري.
However, since each Road and Railroad have a Maintenance Cost, it may be more economical to wait until the cities grow and only place where needed. = لكن بما أن كل طريق وسكة حديدية لها تكلفة صيانة، فقد يكون الأوفر الانتظار حتى تنمو المدن وعدم وضعها إلا حيث يلزم.

Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. You earn more Gold the more Population the City and your Capital has. = ربط مدنك بالعاصمة بالطرق و/أو السكك الحديدية سيولّد ذهباً عبر الطريق التجاري. وتكسب ذهباً أكثر كلما زاد سكان المدينة وعاصمتك.
Note that each road costs 1 Gold Maintenance per turn, and each Railroad costs 2 Gold, so it may be more economical to wait until the cities grow! = لاحظ أن كل طريق يكلف 1 ذهب صيانة في الدورة، وكل سكة حديدية 2 ذهب، فقد يكون الأوفر الانتظار حتى تنمو المدن!
Railroads connecting a city to the Capital also provide a 25% Production Boost to the City, but not the Capital. = السكك الحديدية التي تربط مدينة بالعاصمة توفر أيضاً دفعة إنتاج بنسبة 25% للمدينة، لا للعاصمة.
Trade Routes are also connected over Water via certain buildings like the Harbor. As long as there is a chain that can reach the Capital, there's a Trade Route. Look for this symbol in Yellow below the City Name to mean you have an active Trade Route to your Capital. = الطرق التجارية تتصل أيضاً عبر الماء بواسطة مبانٍ معينة كالميناء. وما دامت هناك سلسلة تصل إلى العاصمة، فهناك طريق تجاري. ابحث عن هذا الرمز الأصفر أسفل اسم المدينة ليعني أن لديك طريقاً تجارياً نشطاً إلى عاصمتك.
Trade Routes can get broken either by Blockades or by Removing/Pillaging the connecting Road/Railroad chain. = يمكن قطع الطرق التجارية إما بالحصار أو بإزالة/نهب سلسلة الطريق/السكة الحديدية الواصلة.
City Blockade = حصار المدينة

Once you’ve settled 3-4 cities and build universities, you’re probably already 100 to 150 turns into the game.\nNow is a good time to start thinking about how, exactly, you want to win – if you haven’t already. = بمجرد أن تستوطن 3-4 مدن وتبني جامعات، تكون على الأرجح قد قطعت 100 إلى 150 دورة في اللعبة.\nحان الوقت الآن للتفكير كيف بالضبط تريد أن تفوز - إن لم تكن قد فعلت.
There are four ways to win in Unciv. They are:\n - Cultural Victory: Complete 5 Social Policy Trees and build the Utopia Project\n - Domination Victory: Conquer the original capital of all other Major civs\n - Science Victory: Be the first to construct a Spaceship\n - Diplomatic Victory: Build the United Nations and win the vote = هناك أربع طرق للفوز في Unciv. وهي:\n - النصر الثقافي: أكمل 5 أشجار سياسات اجتماعية وابنِ مشروع اليوتوبيا\n - نصر الهيمنة: احتل العاصمة الأصلية لجميع الحضارات الكبرى الأخرى\n - النصر العلمي: كن أول من يبني مركبة فضائية\n - النصر الدبلوماسي: ابنِ الأمم المتحدة وافز بالتصويت
So to sum it up, these are the basics of Unciv – Found a prosperous first city, expand slowly to manage happiness, and set yourself up for the victory condition you wish to pursue.\nObviously, there is much more to it than that, but it is important not to jump into the deep end before you know how to swim. = إذن، لتلخيص الأمر، هذه أساسيات Unciv - أسّس مدينة أولى مزدهرة، وتوسع ببطء لإدارة السعادة، وهيّئ نفسك لشرط النصر الذي تريد السعي إليه.\nبالطبع هناك أكثر من ذلك بكثير، لكن من المهم ألا تقفز إلى العمق قبل أن تتعلم السباحة.

Enemy City = مدينة معادية
Cities can be conquered by reducing their health to 1, and entering the city with a melee unit.\nSince cities heal each turn, it is best to attack with ranged units and use your melee units to defend them until the city has been defeated! = يمكن احتلال المدن بخفض صحتها إلى 1 ثم دخول المدينة بوحدة قتال قريب.\nولأن المدن تشفى كل دورة، فالأفضل الهجوم بوحدات الرمي واستخدام وحدات القتال القريب لحمايتها حتى تُهزم المدينة!

Luxury Resource = مورد رفاهية
Luxury resources within your domain and with their specific improvement are connected to your trade network.\nEach unique Luxury resource you have adds 5 happiness to your civilization, but extra resources of the same type don't add anything, so use them for trading with other civilizations! = موارد الرفاهية داخل أراضيك ومع تحسينها الخاص تتصل بشبكتك التجارية.\nكل مورد رفاهية فريد تملكه يضيف 5 سعادة لحضارتك، لكن النسخ الإضافية من النوع نفسه لا تضيف شيئاً، فاستخدمها للتبادل مع الحضارات الأخرى!

Strategic Resource = مورد استراتيجي
Strategic resources within your domain and with their specific improvement are connected to your trade network.\nStrategic resources allow you to train units and construct buildings that require those specific resources, for example the Horseman requires Horses. = الموارد الاستراتيجية داخل أراضيك ومع تحسينها الخاص تتصل بشبكتك التجارية.\nتتيح لك الموارد الاستراتيجية تدريب وحدات وبناء مبانٍ تتطلب هذه الموارد تحديداً، فمثلاً الفارس يتطلب الخيول.
Unlike Luxury Resources, each Strategic Resource on the map provides more than one of that resource.\nThe top bar keeps count of how many unused strategic resources you own.\nA full drilldown of resources is available in the Resources tab in the Overview screen. = بخلاف موارد الرفاهية، كل مورد استراتيجي على الخريطة يوفر أكثر من نسخة واحدة من ذلك المورد.\nيحصي الشريط العلوي عدد الموارد الاستراتيجية غير المستخدمة التي تملكها.\nوتتوفر تفاصيل كاملة للموارد في تبويب الموارد في شاشة النظرة العامة.

The city can no longer put up any resistance!\nHowever, to conquer it, you must enter the city with a melee unit = لم تعد المدينة قادرة على المقاومة!\nلكن لاحتلالها يجب أن تدخلها بوحدة قتال قريب

After Conquering = بعد الاحتلال
When conquering a city, you can choose to liberate, annex, puppet, or raze the city. = عند احتلال مدينة، يمكنك اختيار تحريرها أو ضمها أو جعلها تابعة أو هدمها.
\nLiberating the city will return it to its original owner, giving you a massive diplomatic boost with them!\n\nAnnexing the city will give you full control over it, but also increase the citizens' unhappiness to 2x!\nThis can be mitigated by building a courthouse in the city, returning the citizen's unhappiness to normal.\n\nPuppeting the city will mean that you have no control on the city's production.\nThe city will not increase your tech or policy cost.\nA puppeted city can be annexed at any time, but annexed cities cannot be returned to a puppeted state!\n\nRazing the city will lower its population by 1 each turn until the city is destroyed!\nYou cannot raze a city that is either the starting capital of a civilization or the holy city of a religion. = \nتحرير المدينة سيعيدها إلى مالكها الأصلي، مما يمنحك دفعة دبلوماسية كبيرة لديه!\n\nضم المدينة سيمنحك سيطرة كاملة عليها، لكنه يضاعف استياء المواطنين مرتين!\nويمكن تخفيف ذلك ببناء دار قضاء في المدينة، لإعادة استياء المواطنين إلى طبيعته.\n\nجعل المدينة تابعة يعني أنه لا سيطرة لك على إنتاجها.\nولن ترفع المدينة تكلفة تقنياتك أو سياساتك.\nويمكن ضم المدينة التابعة في أي وقت، لكن المدن المضمومة لا يمكن إعادتها إلى حالة التبعية!\n\nهدم المدينة سيخفض سكانها بمقدار 1 كل دورة حتى تُدمَّر المدينة!\nلا يمكنك هدم مدينة هي العاصمة الأولى لحضارة أو المدينة المقدسة لدين.

You have encountered a barbarian unit!\nBarbarians attack everyone indiscriminately, so don't let your \n  civilian units go near them, and be careful of your scout! = لقد صادفت وحدة برابرة!\nالبرابرة يهاجمون الجميع دون تمييز، فلا تدع \n  وحداتك المدنية تقترب منهم، واحذر على كشّافك!

You have encountered another civilization!\nOther civilizations start out peaceful, and you can trade with them,\n  but they may choose to declare war on you later on = لقد صادفت حضارة أخرى!\nالحضارات الأخرى تبدأ مسالمة، ويمكنك التجارة معها،\n  لكنها قد تختار إعلان الحرب عليك لاحقاً

Injured Units = الوحدات الجريحة
Injured units deal less damage, but recover after turns that they have been inactive.\nUnits heal 10 health per turn in enemy territory or neutral land,\n  20 inside your territory and 25 in your cities. = الوحدات الجريحة تلحق ضرراً أقل، لكنها تتعافى بعد الدورات التي تبقى فيها خاملة.\nتشفى الوحدات 10 صحة في الدورة في أراضي العدو أو الأراضي المحايدة،\n  و20 داخل أراضيك و25 في مدنك.

Workers = العمال
Workers are vital to your cities' growth, since only they can construct improvements on tiles.\nImprovements raise the yield of your tiles, allowing your city to produce more and grow faster while working the same amount of tiles! = العمال حيويون لنمو مدنك، فهم وحدهم القادرون على بناء التحسينات على المربعات.\nالتحسينات ترفع عائد مربعاتك، مما يتيح لمدينتك إنتاجاً أكثر ونمواً أسرع مع عدد المربعات نفسه!

Embarking = الإبحار
Once a certain tech is researched, your land units can embark, allowing them to traverse water tiles.\nEntering or leaving water takes the entire turn. = بمجرد بحث تقنية معينة، تستطيع وحداتك البرية الإبحار، فتعبر مربعات الماء.\nدخول الماء أو مغادرته يستهلك الدور بأكمله.
Units are defenseless while embarked (cannot use modifiers), and have a fixed Defending Strength based on your tech Era, so be careful!\nRanged Units can't attack, Melee Units have a Strength penalty, and all have limited vision. = الوحدات عزلاء أثناء الإبحار (لا يمكنها استخدام المعدّلات)، ولها قوة دفاع ثابتة حسب عصرك التقني، فاحذر!\nوحدات الرمي لا تستطيع الهجوم، ووحدات القتال القريب تتلقى عقوبة قوة، وجميعها ذات رؤية محدودة.

Idle Units = الوحدات الخاملة
Clicking 'Next unit' moves to the next idle unit in the queue (as listed in Overview -> Units). After issuing an order to a unit, if 'Auto Unit Cycle' in Options -> Gameplay is enabled, you will automatically select the next idle unit. = النقر على 'الوحدة التالية' ينقلك إلى الوحدة الخاملة التالية في القائمة (كما في نظرة عامة ← الوحدات). بعد إعطاء أمر لوحدة، إذا كان 'التنقل التلقائي بين الوحدات' مفعّلاً في الخيارات ← اللعب، فستُحدَّد الوحدة الخاملة التالية تلقائياً.
If you don't want to move a unit this turn, you can skip it by clicking 'Next unit' again, or command the unit to 'Skip turn'. = إذا لم ترد تحريك وحدة هذا الدور، فيمكنك تخطيها بالنقر على 'الوحدة التالية' مرة أخرى، أو أمر الوحدة بـ 'تخطي الدور'.
If you want to disable the 'Next unit' feature entirely, you can toggle it in Options -> Gameplay -> Check for idle units. = إذا أردت تعطيل ميزة 'الوحدة التالية' بالكامل، فيمكنك تبديلها في الخيارات ← اللعب ← التحقق من الوحدات الخاملة.
If you'd rather 'Next unit' cycle the units and not mark them as Done, you can change it in the Options -> Gameplay menu. = إذا فضّلت أن تتنقل 'الوحدة التالية' بين الوحدات دون تعليمها كمنتهية، فيمكنك تغيير ذلك في قائمة الخيارات ← اللعب.
You can also cycle through the idle units using the left and right triangles on the Unit Table in the lower left of the screen. Or by default using the Cycle button next to the 'Next Unit' button. = يمكنك أيضاً التنقل بين الوحدات الخاملة باستخدام المثلثين الأيسر والأيمن في جدول الوحدات أسفل يسار الشاشة. أو افتراضياً باستخدام زر التبديل بجانب زر 'الوحدة التالية'.

Contact Me = اتصل بي
Hi there! If you've played this far, you've probably seen that the game is currently incomplete.\n Unciv is meant to be open-source and free, forever.\n That means no ads or any other nonsense. = مرحباً! إن كنت قد لعبت حتى الآن، فربما رأيت أن اللعبة غير مكتملة حالياً.\n Unciv مصممة لتكون مفتوحة المصدر ومجانية للأبد.\n وهذا يعني لا إعلانات ولا أي هراء آخر.
What motivates me to keep working on it, \n  besides the fact I think it's amazingly cool that I can,\n  is the support from the players - you guys are the best! = ما يحفزني على مواصلة العمل عليها،\n  إلى جانب أنني أراه رائعاً أن أستطيع فعل ذلك،\n  هو دعم اللاعبين - أنتم الأفضل!
Every rating and review that I get puts a smile on my face =)\n  So contact me! Send me an email, review, Github issue\n  or mail pigeon, and let's figure out how to make the game \n  even more awesome!\n(Contact info is in the Play Store) = كل تقييم ومراجعة أحصل عليها ترسم ابتسامة على وجهي =)\n  فتواصل معي! أرسل لي بريداً أو مراجعة أو مشكلة على Github\n  أو حمامة زاجلة، ولنعرف كيف نجعل اللعبة\n  أروع!\n(معلومات الاتصال في متجر Play)

Pillaging = النهب
Military units can pillage improvements, which heals them 25 health and ruins the improvement.\nThe tile can still be worked, but advantages from the improvement - stat bonuses and resources - will be lost.\nWorkers can repair these improvements, which takes less time than building the improvement from scratch.\nPillaging certain improvements will result in your units looting gold from the improvement. = يمكن للوحدات العسكرية نهب التحسينات، مما يشفيها 25 صحة ويدمر التحسين.\nيمكن العمل في المربع بعدها، لكن مزايا التحسين - مكافآت الإحصائيات والموارد - ستُفقد.\nيستطيع العمال إصلاح هذه التحسينات، وهذا يستغرق وقتاً أقل من بناء التحسين من الصفر.\nنهب بعض التحسينات سيجعل وحداتك تنهب ذهباً من التحسين.

Experience = الخبرة
Units that enter combat gain experience, which can then be used on promotions for that unit.\nUnits gain more experience when in Melee combat than Ranged, and more when attacking than when defending. = الوحدات التي تدخل القتال تكسب خبرة، يمكن استخدامها بعدئذ في ترقيات لتلك الوحدة.\nتكسب الوحدات خبرة أكثر في القتال القريب منها في الرمي، وأكثر عند الهجوم منها عند الدفاع.
Units can only gain up to 30 XP from Barbarian units - meaning up to 2 promotions. After that, Barbarian units will provide no experience. = لا يمكن للوحدات كسب أكثر من 30 خبرة من وحدات البرابرة - أي حتى ترقيتين. بعد ذلك لن توفر وحدات البرابرة أي خبرة.

Combat = القتال
Unit and cities are worn down by combat, which is affected by a number of different values.\nEach unit has a certain 'base' combat value, which can be improved by certain conditions, promotions and locations. = الوحدات والمدن تُستنزف بالقتال، الذي يتأثر بعدد من القيم المختلفة.\nلكل وحدة قيمة قتال 'أساسية' معينة، يمكن تحسينها بشروط وترقيات ومواقع معينة.
Units use the 'Strength' value as the base combat value when melee attacking and when defending.\nWhen using a ranged attack, they will the use the 'Ranged Strength' value instead. = تستخدم الوحدات قيمة 'القوة' كقيمة قتال أساسية عند الهجوم القريب وعند الدفاع.\nوعند استخدام هجوم بعيد المدى ستستخدم قيمة 'قوة الرمي' بدلاً منها.
Ranged attacks can be done from a distance, dependent on the 'Range' value of the unit.\nWhile melee attacks allow the defender to damage the attacker in retaliation, ranged attacks do not. = يمكن تنفيذ الهجمات بعيدة المدى من مسافة، حسب قيمة 'المدى' للوحدة.\nبينما تتيح هجمات القتال القريب للمدافع إلحاق الضرر بالمهاجم رداً، فإن الهجمات بعيدة المدى لا تفعل.

Embassies = السفارات
Establishing an embassy in other players' Capital city shows the location of their Capital, likewise other players who establish an embassy in your Capital can see location of your Capital. = إنشاء سفارة في عاصمة لاعب آخر يكشف موقع عاصمته، وكذلك يستطيع اللاعبون الآخرون الذين ينشئون سفارة في عاصمتك رؤية موقع عاصمتك.
Embassies thus allow Spies to be placed in another players' Capital City if Espionage is enabled. = وبذلك تتيح السفارات وضع الجواسيس في عاصمة لاعب آخر إذا كان التجسس مفعّلاً.
Mutual embassies are required to allow trading open borders and to sign Research Agreement and Defensive Pact. = السفارات المتبادلة مطلوبة للسماح بتبادل الحدود المفتوحة وتوقيع الاتفاقية البحثية والحلف الدفاعي.
Declaring war on another player or denouncing them will remove embassies from both players' Capitals. You will have to re-establish them to use their effect. = إعلان الحرب على لاعب آخر أو استنكاره سيزيل السفارات من عاصمتي اللاعبين. وسيتعين عليك إعادة إنشائها لتستخدم تأثيرها.
Re-establishing an embassy after denunciation from either side becomes available next turn, while re-establishing them when at war requires a peace treaty. = إعادة إنشاء سفارة بعد الاستنكار من أي جانب تصبح متاحة في الدور التالي، بينما إعادة إنشائها أثناء الحرب تتطلب معاهدة سلام.
Be cautious when accepting embassy from other players because they can spy on your capital, or worse may start planning to attack you. = كن حذراً عند قبول سفارة من لاعبين آخرين لأنهم قد يتجسسون على عاصمتك، أو الأسوأ أن يبدأوا بالتخطيط لمهاجمتك.
Note that before you can offer an embassy, you need the required Technology. = لاحظ أنه قبل أن تتمكن من عرض سفارة تحتاج إلى التقنية المطلوبة.
Embassies are available using the Gods and Kings ruleset. = السفارات متاحة باستخدام مجموعة قواعد الآلهة والملوك.
Defensive Pacts = الأحلاف الدفاعية

Open Borders from other player and vice versa allow units to freely pass through their territory. = الحدود المفتوحة من لاعب آخر وبالعكس تتيح للوحدات المرور بحرية عبر أراضيه.
They also let Missionaries to enter other players' territory without suffering attrition. = كما تتيح للمبشرين دخول أراضي اللاعبين الآخرين دون التعرض للاستنزاف.
Open Borders expire depending on game speed and are canceled upon Declaration of War, the closure however takes effect only after war ends and need to be traded again. = تنتهي الحدود المفتوحة حسب سرعة اللعبة وتُلغى عند إعلان الحرب، لكن الإغلاق لا يسري إلا بعد انتهاء الحرب ويجب تبادلها من جديد.
You gain diplomatic boost with other AI player if you both have Open Borders to each other = تكسب دفعة دبلوماسية لدى لاعب الذكاء الاصطناعي الآخر إذا كان لدى كل منكما حدود مفتوحة للآخر
Be cautious when giving Open Borders because other player may settle a City near your lands in an area you are planning to use, they may also use your territory to attack your friends or City State allies. = كن حذراً عند منح الحدود المفتوحة لأن اللاعب الآخر قد يؤسس مدينة قرب أراضيك في منطقة تخطط لاستخدامها، وقد يستخدم أراضيك لمهاجمة أصدقائك أو حلفائك من الدول المدن.
Note that before you can offer or accept open borders, both Nations need the required Technology. = لاحظ أنه قبل أن تتمكن من عرض أو قبول الحدود المفتوحة، تحتاج كلتا الأمتين إلى التقنية المطلوبة.
When playing with the Gods and Kings ruleset mutual embassies need to be established before Open Borders can be traded. = عند اللعب بمجموعة قواعد الآلهة والملوك يجب إنشاء سفارات متبادلة قبل تبادل الحدود المفتوحة.

In Research Agreements, you and another civilization decide to jointly research technology.\nAt the end of the agreement, you will both receive a 'lump sum' of ⍾Science, which will go towards one of your unresearched technologies. = في الاتفاقيات البحثية، تقرر أنت وحضارة أخرى بحث التقنية معاً.\nعند نهاية الاتفاقية ستحصل كلتاكما على مبلغ إجمالي من ⍾العلوم، يذهب نحو إحدى تقنياتك غير المبحوثة.
The amount of ⍾Science you receive at the end is dependent on the ⍾Science generated by your cities and the other civilization's cities during the agreement - the more, the better! = مقدار ⍾العلوم التي تتلقاها في النهاية يعتمد على ⍾العلوم التي تولّدها مدنك ومدن الحضارة الأخرى أثناء الاتفاقية - كلما زادت كان أفضل!
Note that before you can invest in a research agreement, you must have a Declaraction of Friendship, both Nations need the required Technology, and both Nations need enough Gold on hand for the agreement. = لاحظ أنه قبل أن تتمكن من الاستثمار في اتفاقية بحثية، يجب أن يكون لديك إعلان صداقة، وكلتا الأمتين تحتاجان إلى التقنية المطلوبة، وكلتاهما تحتاجان إلى ذهب كافٍ للاتفاقية.
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Research Agreement can be signed. = عند اللعب بمجموعة قواعد الآلهة والملوك يجب إنشاء سفارات متبادلة قبل توقيع اتفاقية بحثية.

Defensive pacts allow you and another civ to protect one another from aggressors.\nOnce the defensive pact is signed, you will be drawn into their future defensive wars, just as they will be drawn into your future defensive wars. Declaring war on any Civ will remove all of your defensive pacts. You will have to re-sign them to use their effect. = تتيح الأحلاف الدفاعية لك ولحضارة أخرى حماية بعضكما من المعتدين.\nبمجرد توقيع الحلف الدفاعي، ستنجر إلى حروبهم الدفاعية المستقبلية، تماماً كما سينجرون إلى حروبك الدفاعية المستقبلية. إعلان الحرب على أي حضارة سيزيل جميع أحلافك الدفاعية. وسيتعين عليك إعادة توقيعها لتستخدم تأثيرها.
Be cautious when signing defensive pacts because they can bring you into wars that you might not want to be in. = كن حذراً عند توقيع الأحلاف الدفاعية لأنها قد تجرك إلى حروب قد لا ترغب بخوضها.
The AI is very careful and will not accept defensive pacts with less than 80 influence. = الذكاء الاصطناعي حذر جداً ولن يقبل أحلافاً دفاعية بنفوذ أقل من 80.
Note that before you can sign a defensive pact, you must have a Declaraction of Friendship, and both Nations need the required Technology. = لاحظ أنه قبل أن تتمكن من توقيع حلف دفاعي يجب أن يكون لديك إعلان صداقة، وكلتا الأمتين تحتاجان إلى التقنية المطلوبة.
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Defensive Pact can be signed. = عند اللعب بمجموعة قواعد الآلهة والملوك يجب إنشاء سفارات متبادلة قبل توقيع حلف دفاعي.

Not all nations are contending with you for victory.\nCity-States are nations that can't win, can't be traded with, and instead confer certain bonuses to friendly civilizations. = ليست كل الأمم تنافسك على النصر.\nالدول المدن أمم لا يمكنها الفوز ولا يمكن التجارة معها، وإنما تمنح مكافآت معينة للحضارات الصديقة.
Instead, diplomatic relations with City-States are determined by Influence - a meter of 'how much the City-State likes you'.\nInfluence can be increased by attacking their enemies, liberating their city, and giving them sums of gold. = بدلاً من ذلك، تُحدَّد العلاقات الدبلوماسية مع الدول المدن بالنفوذ - مقياس لـ 'مقدار حب دولة المدينة لك'.\nيمكن زيادة النفوذ بمهاجمة أعدائها وتحرير مدينتها وإعطائها مبالغ من الذهب.
Certain bonuses are given when you are at above 30 influence.\nWhen you have above 60 Influence, and you have the highest influence with them of all civilizations, you are considered their 'Ally', and gain further bonuses and access to the Luxury and Strategic resources in their lands. = تُمنح مكافآت معينة حين يكون نفوذك فوق 30.\nوحين يكون نفوذك فوق 60 وأعلى نفوذ لديها بين جميع الحضارات، تُعتبر 'حليفها' وتحصل على مكافآت إضافية وعلى موارد الرفاهية والموارد الاستراتيجية في أراضيها.

While working the land is good, eventually your Citizens will want to Specialize. = العمل في الأرض جيد، لكن مواطنيك سيرغبون في النهاية بالتخصص.
Certain Buildings will also provide Specialist Slots. These slots will show up in the Citizen Management within the City Screen under Specialists. Each slot can be filled with a Citizen which will then become a Specialist. = بعض المباني توفر أيضاً خانات للمتخصصين. تظهر هذه الخانات في إدارة المواطنين داخل شاشة المدينة تحت المتخصصين. يمكن ملء كل خانة بمواطن يصبح بعدها متخصصاً.
Each Specialist will generate a certain amount of yield as indicated to the right of the available slots. = كل متخصص سيولّد قدراً معيناً من العائد كما هو موضح على يمين الخانات المتاحة.
While these are a great way to specialize the yield production of a City outside of the surrounding Tile Yields, Specialists have an additional value. Each one also generates Great Person Points each turn. With enough of them, a new Great Person will join your Nation. = رغم أنها طريقة رائعة لتخصيص إنتاج عائد المدينة بعيداً عن عائدات المربعات المحيطة، فللمتخصصين قيمة إضافية. كل واحد منهم يولّد أيضاً نقاط شخصيات عظيمة كل دورة. ومع عدد كافٍ منهم، ستنضم شخصية عظيمة جديدة إلى أمتك.
Great People = الشخصيات العظيمة

Certain buildings, and specialists in cities, generate Great Person points per turn.\nThere are several types of Great People, and their points accumulate separately.\nThe number of points per turn and accumulated points can be viewed in the Overview screen. = بعض المباني والمتخصصون في المدن يولّدون نقاط شخصيات عظيمة في الدورة.\nهناك عدة أنواع من الشخصيات العظيمة، وتتراكم نقاطها بشكل منفصل.\nيمكن عرض عدد النقاط في الدورة والنقاط المتراكمة في شاشة النظرة العامة.
Alternatively, the Great Person points breakdown per city can be viewed in each City Screen (see UI Tips article). = بدلاً من ذلك، يمكن عرض تفصيل نقاط الشخصيات العظيمة لكل مدينة في كل شاشة مدينة (انظر مقال نصائح الواجهة).
Once enough points have been accumulated, a Great Person of that type will be created!\nEach Great Person can construct a certain Great Improvement which gives large yields over time, or immediately consumed to provide a certain bonus now. = بمجرد تراكم نقاط كافية، ستُنشأ شخصية عظيمة من ذلك النوع!\nيمكن لكل شخصية عظيمة بناء تحسين عظيم معين يمنح عائدات كبيرة بمرور الوقت، أو استهلاكها فوراً للحصول على مكافأة معينة الآن.
Great Improvements also provide any strategic resources that are under them, so you don't need to worry if resources are revealed underneath your improvements! = التحسينات العظيمة توفر أيضاً أي موارد استراتيجية تحتها، فلا داعي للقلق إن كُشفت الموارد تحت تحسيناتك!

Removing Terrain Features = إزالة ميزات التضاريس
Certain tiles have terrain features - like Flood plains or Forests -  on top of them. Some of these layers, like Jungle, Marsh and Forest, can be removed by workers.\nRemoving the terrain feature does not remove any resources in the tile, and is usually required in order to add improvements exploiting those resources. = بعض المربعات فيها ميزات تضاريس - مثل سهول الفيضان أو الغابات - فوقها. بعض هذه الطبقات، كالأدغال والمستنقعات والغابات، يمكن للعمال إزالتها.\nإزالة ميزة التضاريس لا تزيل أي موارد في المربع، وهي عادةً مطلوبة لإضافة تحسينات تستغل تلك الموارد.

Natural Wonders, such as the Mt. Fuji, the Rock of Gibraltar and the Great Barrier Reef, are unique, impassable terrain features, masterpieces of mother Nature, which possess exceptional qualities that make them very different from the average terrain.\nThey benefit by giving you large sums of Culture, ⍾Science, Gold or Production if worked by your Cities, which is why you might need to bring them under your empire as soon as possible. = العجائب الطبيعية، مثل جبل فوجي وصخرة جبل طارق والحاجز المرجاني العظيم، ميزات تضاريس فريدة غير قابلة للعبور، وتحف من صنع الطبيعة الأم، تتمتع بخصائص استثنائية تجعلها مختلفة تماماً عن التضاريس العادية.\nتفيدك بمنحك مبالغ كبيرة من الثقافة أو ⍾العلوم أو الذهب أو الإنتاج إذا عملت بها مدنك، ولهذا قد تحتاج إلى ضمها تحت إمبراطوريتك في أقرب وقت ممكن.

Keyboard = لوحة المفاتيح
If you have a keyboard, some shortcut keys become available. Unit command or improvement picker keys, for example, are shown directly in their corresponding buttons. = إذا كان لديك لوحة مفاتيح، تتاح بعض مفاتيح الاختصار. فمفاتيح أوامر الوحدة أو منتقي التحسينات، مثلاً، تظهر مباشرة في أزرارها المقابلة.
On the world screen the hotkeys are as follows: = في شاشة العالم تكون مفاتيح الاختصار كالتالي:
Space or 'N' - Next unit or turn\n'E' - Empire overview (last viewed page)\n'+', '-' - Zoom in / out\nHome - center on capital or open its City Screen if already centered = Space أو 'N' - الوحدة أو الدور التالي\n'E' - نظرة عامة على الإمبراطورية (آخر صفحة عُرضت)\n'+', '-' - تكبير / تصغير\nHome - التمركز على العاصمة أو فتح شاشة مدينتها إن كانت في المركز بالفعل
F1 - Open Civilopedia\nF2 - Empire overview Trades\nF3 - Empire overview Units\nF4 - Empire overview Diplomacy\nF5 - Social policies\nF6 - Technologies\nF7 - Empire overview Cities\nF8 - Victory Progress\nF9 - Empire overview Stats\nF10 - Empire overview Resources\nF11 - Quicksave\nF12 - Quickload = F1 - فتح الموسوعة\nF2 - نظرة عامة: الصفقات\nF3 - نظرة عامة: الوحدات\nF4 - نظرة عامة: الدبلوماسية\nF5 - السياسات الاجتماعية\nF6 - التقنيات\nF7 - نظرة عامة: المدن\nF8 - تقدم النصر\nF9 - نظرة عامة: الإحصائيات\nF10 - نظرة عامة: الموارد\nF11 - حفظ سريع\nF12 - تحميل سريع
Ctrl-R - Toggle tile resource display\nCtrl-Y - Toggle tile yield display\nCtrl-O - Game options\nCtrl-S - Save game\nCtrl-L - Load game\nCtrl-U - Toggle UI (World Screen only) = Ctrl-R - تبديل عرض موارد المربعات\nCtrl-Y - تبديل عرض عائدات المربعات\nCtrl-O - خيارات اللعبة\nCtrl-S - حفظ اللعبة\nCtrl-L - تحميل لعبة\nCtrl-U - تبديل الواجهة (شاشة العالم فقط)
All of these can be reassigned. = يمكن إعادة تعيين كل هذه المفاتيح.

This is where you spend most of your time playing Unciv. See the world, control your units, access other screens from here. = هنا تقضي معظم وقتك في لعب Unciv. شاهد العالم، وتحكم بوحداتك، وادخل الشاشات الأخرى من هنا.
①: The menu button - civilopedia, save, load, options... = ①: زر القائمة - الموسوعة، الحفظ، التحميل، الخيارات...
②: The player/nation whose turn it is - click for diplomacy overview. = ②: اللاعب/الأمة صاحب الدور - انقر لنظرة عامة على الدبلوماسية.
③: The Technology Button - shows the tech tree which allows viewing or researching technologies. = ③: زر التقنيات - يعرض شجرة التقنيات التي تتيح عرض التقنيات أو بحثها.
④: The Social Policies Button - shows enacted and selectable policies, and with enough culture points you can enact new ones. = ④: زر السياسات الاجتماعية - يعرض السياسات المعتمدة والقابلة للاختيار، وبنقاط ثقافة كافية يمكنك اعتماد سياسات جديدة.
⑤: The Diplomacy Button - shows the diplomacy manager where you can talk to other civilizations. = ⑤: زر الدبلوماسية - يعرض مدير الدبلوماسية حيث يمكنك التحدث إلى الحضارات الأخرى.
⑥: Unit Action Buttons - while a unit is selected its possible actions appear here. = ⑥: أزرار إجراءات الوحدة - عند تحديد وحدة تظهر هنا إجراءاتها الممكنة.
⑦: The unit/city info pane - shows information about a selected unit or city. = ⑦: لوحة معلومات الوحدة/المدينة - تعرض معلومات عن الوحدة أو المدينة المحددة.
⑧: The name (and unit icon) of the selected unit or city, with current health if wounded. Clicking a unit name or icon will open its civilopedia entry. = ⑧: اسم (وأيقونة) الوحدة أو المدينة المحددة، مع الصحة الحالية إن كانت جريحة. النقر على اسم الوحدة أو أيقونتها يفتح مدخلها في الموسوعة.
⑨: The arrow buttons allow jumping to the next/previous idle unit. = ⑨: أزرار الأسهم تتيح القفز إلى الوحدة الخاملة التالية/السابقة.
⑩: For a selected unit, its promotions appear here, and clicking leads to the promotions screen for that unit. = ⑩: للوحدة المحددة، تظهر ترقياتها هنا، والنقر يؤدي إلى شاشة الترقيات لتلك الوحدة.
⑪: Remaining/per turn movement points, strength and experience / XP needed for promotion. For cities, you get its combat strength. = ⑪: نقاط الحركة المتبقية/في الدورة، والقوة والخبرة / الخبرة اللازمة للترقية. وللمدن تحصل على قوة قتالها.
⑫: This button closes the selected unit/city info pane. = ⑫: يغلق هذا الزر لوحة معلومات الوحدة/المدينة المحددة.
⑬: This pane appears when you order a unit to attack an enemy. On top are attacker and defender with their respective base strengths. = ⑬: تظهر هذه اللوحة عند أمر وحدة بمهاجمة عدو. في الأعلى المهاجم والمدافع بقوتيهما الأساسيتين.
⑭: Below that are strength bonuses or penalties and health bars projecting before / after the attack. = ⑭: تحتها مكافآت أو عقوبات القوة وأشرطة الصحة المتوقعة قبل/بعد الهجوم.
⑮: The Attack Button - let blood flow! = ⑮: زر الهجوم - لتسِل الدماء!
⑯: The minimap shows an overview over the world, with known cities, terrain and fog of war. Clicking will position the main map. = ⑯: تعرض الخريطة المصغرة نظرة عامة على العالم، مع المدن المعروفة والتضاريس وضباب الحرب. النقر عليها يحدد موضع الخريطة الرئيسية.
⑰: To the side of the minimap are display feature toggling buttons - tile yield, worked indicator, show/hide resources. These mirror setting on the options screen and are hidden if you deactivate the minimap. = ⑰: على جانب الخريطة المصغرة أزرار تبديل ميزات العرض - عائد المربع، مؤشر المشغول، إظهار/إخفاء الموارد. وهي تعكس إعدادات شاشة الخيارات وتختفي إذا عطّلت الخريطة المصغرة.
⑱: Tile information for the selected hex - current or potential yield, terrain, effects, present units, city located there and such. Where appropriate, clicking a line opens the corresponding civilopedia entry. = ⑱: معلومات المربع السداسي المحدد - العائد الحالي أو المحتمل، التضاريس، التأثيرات، الوحدات الموجودة، المدينة الواقعة هناك وما إلى ذلك. وحيث يناسب، يفتح النقر على سطر مدخل الموسوعة المقابل.
⑲: Notifications - what happened during the last 'next turn' phase. Some are clickable to show a relevant place on the map, some even show several when you click repeatedly. = ⑲: الإشعارات - ما حدث خلال مرحلة 'الدور التالي' الأخيرة. بعضها قابل للنقر لإظهار مكان ذي صلة على الخريطة، وبعضها يُظهر أكثر من موضع عند النقر المتكرر.
⑳: The Next Turn Button - unless there are things to do, in which case the label changes to 'next unit', 'pick policy' and so on. = ⑳: زر الدور التالي - ما لم تكن هناك أمور لتفعلها، وعندها تتغير التسمية إلى 'الوحدة التالية' أو 'اختر سياسة' وهكذا.
㉑: The Multiplayer Button - Here you can easily check your active multiplayer games. = ㉑: زر اللعب الجماعي - هنا يمكنك بسهولة فحص ألعابك الجماعية النشطة.
ⓐ: The overview button leads to the empire overview screen with various tabs (the last one viewed is remembered) holding vital information about the state of your civilization in the world. = ⓐ: زر النظرة العامة يؤدي إلى شاشة نظرة عامة على الإمبراطورية بتبويبات متنوعة (يُحفظ آخر تبويب عُرض) تحتوي معلومات حيوية عن حالة حضارتك في العالم.
ⓑ: The ♪Culture icon shows accumulated ♪Culture and ♪Culture needed for the next policy - in this case, the exclamation mark tells us a next policy can be enacted. Clicking is another way to the policies manager. = ⓑ: تعرض أيقونة ♪الثقافة الثقافة المتراكمة والثقافة اللازمة للسياسة التالية - وفي هذه الحالة تخبرنا علامة التعجب أنه يمكن اعتماد سياسة تالية. النقر طريقة أخرى للوصول إلى مدير السياسات.
ⓒ: Your known strategic resources are displayed here with the available (usage already deducted) number - click to go to the resources overview screen. = ⓒ: تُعرض هنا مواردك الاستراتيجية المعروفة بالعدد المتاح (بعد خصم المستخدم) - انقر للذهاب إلى شاشة نظرة عامة على الموارد.
ⓓ: Happiness/unhappiness balance and either golden age with turns left or accumulated happiness with amount needed for a golden age is shown next to the smiley. Clicking also leads to the resources overview screen as luxury resources are a way to improve happiness. = ⓓ: يظهر بجانب الوجه المبتسم رصيد السعادة/الاستياء، إما العصر الذهبي مع الدورات المتبقية أو السعادة المتراكمة مع المقدار اللازم للعصر الذهبي. والنقر يؤدي أيضاً إلى شاشة نظرة عامة على الموارد إذ إن موارد الرفاهية طريقة لتحسين السعادة.
ⓔ: The ⍾Science icon shows the number of ⍾Science points produced per turn. Clicking leads to the technology tree. = ⓔ: تعرض أيقونة ⍾العلوم عدد نقاط ⍾العلوم المنتجة في الدورة. النقر يؤدي إلى شجرة التقنيات.
ⓕ: Number of turns played with translation into calendar years. Click to see the victory overview. = ⓕ: عدد الدورات المُلعَبة مع ترجمتها إلى سنوات تقويمية. انقر لرؤية نظرة عامة على النصر.
ⓖ: The number of gold coins in your treasury and income. Clicks lead to the Stats overview screen. = ⓖ: عدد قطع الذهب في خزينتك والدخل. النقر يؤدي إلى شاشة نظرة عامة على الإحصائيات.
ⓗ: The quantity of ☮Faith your citizens have generated, or 'off' if religion is disabled. Clicking it makes you go to the religion overview screen. = ⓗ: كمية ☮الإيمان التي ولّدها مواطنوك، أو 'متوقف' إذا كان الدين معطلاً. النقر عليها يأخذك إلى شاشة نظرة عامة على الدين.
ⓧ: In the center of all this - the world map! Here, the "X" marks a spot outside the map. Yes, unless the wrap option was used, Unciv worlds are flat. Don't worry, your ships won't fall off the edge. = ⓧ: في مركز كل هذا - خريطة العالم! هنا تحدد علامة "X" موضعاً خارج الخريطة. نعم، ما لم يُستخدم خيار الالتفاف فعوالم Unciv مسطحة. لا تقلق، لن تسقط سفنك من الحافة.
ⓨ: By the way, here's how an empire border looks like - it's in the national colours of the nation owning the territory. = ⓨ: بالمناسبة، هكذا تبدو حدود الإمبراطورية - بالألوان الوطنية للأمة التي تملك الأراضي.
ⓩ: And this is the red targeting circle that led to the attack pane back under ⑬. = ⓩ: وهذه الدائرة الحمراء للاستهداف التي أدت إلى لوحة الهجوم تحت ⑬.
What you don't see: The phone/tablet's back button will pop the question whether you wish to leave Unciv and go back to Real Life. On desktop versions, you can use the ESC key. = ما لا تراه: زر الرجوع في الهاتف/اللوحي سيطرح سؤال هل تريد مغادرة Unciv والعودة إلى الحياة الواقعية. وفي نسخ سطح المكتب يمكنك استخدام مفتاح ESC.

When at later stages of the game, you might have a lot of units but only a little to do. To help you we have implemented an AutoPlay feature that lets you use the AI to play part or all of your turn. = في مراحل متأخرة من اللعبة قد يكون لديك وحدات كثيرة لكن القليل لتفعله. لمساعدتك نفّذنا ميزة اللعب التلقائي التي تتيح لك استخدام الذكاء الاصطناعي للعب جزء من دورك أو كله.
To enable AutoPlay, go to options and open the AutoPlay tab and press "Show AutoPlay button". = لتفعيل اللعب التلقائي، اذهب إلى الخيارات وافتح تبويب اللعب التلقائي واضغط "عرض زر اللعب التلقائي".
Clicking on the AutoPlay button opens a popup menue for choosing to AutoPlay parts or all of your turn. = النقر على زر اللعب التلقائي يفتح قائمة منبثقة لاختيار لعب أجزاء من دورك أو كله تلقائياً.
Clicking Start AutoPlay in the pop-up menue or long pressing the AutoPlay button begins the multi-turn AutoPlay. This will play your next turns as if you were an AI. = النقر على بدء اللعب التلقائي في القائمة المنبثقة أو الضغط المطوّل على زر اللعب التلقائي يبدأ اللعب التلقائي متعدد الدورات. وسيلعب هذا دوراتك التالية كأنك ذكاء اصطناعي.
To cancel multi-turn AutoPlay you can press the AutoPlay button, next turn button or open the options menue. = لإلغاء اللعب التلقائي متعدد الدورات يمكنك الضغط على زر اللعب التلقائي أو زر الدور التالي أو فتح قائمة الخيارات.
Multi-turn AutoPlay is not advised on harder difficulty levels as your AI will not play better against an AI with modifiers. = لا يُنصح باللعب التلقائي متعدد الدورات في مستويات الصعوبة الأعلى لأن الذكاء الاصطناعي الخاص بك لن يلعب أفضل ضد ذكاء اصطناعي بمعدّلات.
Multi-turn AutoPlay for multiplayer is not yet supported. = اللعب التلقائي متعدد الدورات للعب الجماعي غير مدعوم بعد.

After building a shrine, your civilization will start generating ☮Faith. = بعد بناء ضريح، ستبدأ حضارتك بتوليد ☮الإيمان.
When enough ☮Faith has been generated, you will be able to found a pantheon. = عند توليد ☮إيمان كافٍ، ستتمكن من تأسيس مجمع آلهة.
A pantheon will provide a small bonus for your civilization that will apply to all cities that have it as a majority religion. = سيوفر مجمع الآلهة مكافأة صغيرة لحضارتك تنطبق على جميع المدن التي يكون دين أغلبيتها.
Each civilization can only choose a single pantheon belief, and each pantheon can only be chosen once. = كل حضارة يمكنها اختيار معتقد مجمع آلهة واحد فقط، وكل مجمع آلهة لا يمكن اختياره إلا مرة واحدة.
Generating more ☮Faith will allow you to found a religion. = توليد المزيد من ☮الإيمان سيتيح لك تأسيس دين.

Keep generating ☮Faith, and eventually a great prophet will be born in one of your cities. = واصل توليد ☮الإيمان، وفي النهاية سيولد نبي عظيم في إحدى مدنك.
This great prophet can be used for multiple things: Constructing a holy site, founding a religion and spreading your religion. = يمكن استخدام هذا النبي العظيم لعدة أمور: بناء موقع مقدس، وتأسيس دين، ونشر دينك.
When founding your religion, you may choose another two beliefs. The founder belief will only apply to you, while the follower belief will apply to all cities following your religion. = عند تأسيس دينك يمكنك اختيار معتقدين آخرين. معتقد المؤسس سينطبق عليك فقط، بينما معتقد التابع سينطبق على جميع المدن التي تتبع دينك.
Additionally, the city where you used your great prophet will become the holy city of that religion. = وإضافة إلى ذلك، ستصبح المدينة التي استخدمت فيها نبيك العظيم المدينة المقدسة لذلك الدين.
Once you have founded a religion, great prophets will keep being born every so often, though the amount of Faith☮ you have to save up will be higher. = بعد تأسيس دين، سيستمر ميلاد أنبياء عظماء بين حين وآخر، لكن مقدار الإيمان☮ الذي عليك ادخاره سيكون أعلى.
One of these great prophets can then be used to enhance your religion. = يمكن استخدام أحد هؤلاء الأنبياء العظماء لتعزيز دينك.
This will allow you to choose another follower belief, as well as an enhancer belief, that only applies to you. = وهذا سيتيح لك اختيار معتقد تابع آخر، إضافة إلى معتقد معزّز ينطبق عليك فقط.
Do take care founding a religion soon, only about half the players in the game are able to found a religion! = احرص على تأسيس دين مبكراً، فنحو نصف اللاعبين في اللعبة فقط قادرون على تأسيس دين!

Religion inside cities = الدين داخل المدن
When founding a city, it won't follow a religion immediately. = عند تأسيس مدينة، لن تتبع ديناً فوراً.
The religion a city follows depends on the total pressure each religion has within the city. = الدين الذي تتبعه المدينة يعتمد على إجمالي الضغط الذي يملكه كل دين داخل المدينة.
Followers are allocated in the same proportions as these pressures, and these followers can be viewed in the City Screen. = يُوزَّع الأتباع بنفس نسب هذه الضغوط، ويمكن عرض هؤلاء الأتباع في شاشة المدينة.
You are allowed to check religious followers and pressures in cities you do not own by selecting them. = يُسمح لك بفحص الأتباع الدينيين والضغوط في مدن لا تملكها بتحديدها.
In both places, a tap/click on the icon of a religion will show detailed information with its effects. = في كلا المكانين، النقر على أيقونة دين سيعرض معلومات مفصلة عن تأثيراته.
Based on this, you can get a feel for which religions have a lot of pressure built up in the city, and which have almost none. = بناءً على هذا يمكنك تكوين فكرة عن الأديان التي تراكم عليها ضغط كبير في المدينة والتي لا ضغط عليها تقريباً.
The city follows a religion if a majority of its population follows that religion, and will only then receive the effects of Follower and Pantheon beliefs of that religion. = تتبع المدينة ديناً إذا كانت أغلبية سكانها تتبع ذلك الدين، وعندها فقط ستتلقى تأثيرات معتقدات التابع ومجمع الآلهة لذلك الدين.

Spreading Religion = نشر الدين
Spreading religion happens naturally, but can be sped up using missionaries or great prophets. = ينتشر الدين بشكل طبيعي، لكن يمكن تسريعه باستخدام المبشرين أو الأنبياء العظماء.
Missionaries can be bought in cities following a major religion, and will take the religion of that city. = يمكن شراء المبشرين في المدن التي تتبع ديناً رئيسياً، وسيتبعون دين تلك المدينة.
So do take care where you are buying them! If another civilization has converted one of your cities to their religion, missionaries bought there will follow their religion. = فانتبه أين تشتريهم! إذا حولت حضارة أخرى إحدى مدنك إلى دينها، فالمبشرون المشتراة هناك سيتبعون دينها.
Great prophets always have your religion when they appear, even if they are bought in cities following other religions, but captured great prophets do retain their original religion. = الأنبياء العظماء يحملون دينك دائماً عند ظهورهم، حتى لو اشتُروا في مدن تتبع أديانا أخرى، لكن الأنبياء العظماء المأسورين يحتفظون بدينهم الأصلي.
Both great prophets and missionaries are able to spread religion to cities when they are inside its borders, even cities of other civilizations. = يستطيع كل من الأنبياء العظماء والمبشرين نشر الدين إلى المدن حين يكونون داخل حدودها، حتى مدن الحضارات الأخرى.
These two units can even enter tiles of civilizations with whom you don't have an open borders agreement! = وهاتان الوحدتان تستطيعان حتى دخول مربعات الحضارات التي ليس لديك معها اتفاقية حدود مفتوحة!
But do take care, missionaries will lose 250 religious strength each turn they end while in foreign lands. = لكن انتبه، سيفقد المبشرون 250 قوة دينية كل دورة ينهونها في أراضٍ أجنبية.
This diminishes their effectiveness when spreading religion, and if their religious strength ever reaches 0, they have lost their faith and disappear. = وهذا يقلل فعاليتهم عند نشر الدين، وإذا بلغت قوتهم الدينية 0 فقد فقدوا إيمانهم ويختفون.
When you do spread your religion, the religious strength of the unit is added as pressure for that religion. = عندما تنشر دينك، تُضاف القوة الدينية للوحدة كضغط لذلك الدين.
Cities also passively add pressure of their majority religion to nearby cities. = كما أن المدن تضيف سلبياً ضغط دين أغلبيتها إلى المدن القريبة.
Each city provides +6 pressure per turn to all cities within 10 tiles, though the exact amount of pressure depends on the game speed. = كل مدينة توفر +6 ضغط في الدورة لجميع المدن ضمن 10 مربعات، رغم أن المقدار الدقيق للضغط يعتمد على سرعة اللعبة.
This pressure can also be seen in the City Screen, and gives you an idea of how religions in your cities will evolve if you don't do anything. = يمكن رؤية هذا الضغط أيضاً في شاشة المدينة، ويعطيك فكرة عن كيفية تطور الأديان في مدنك إن لم تفعل شيئاً.
Holy cities also provide +30 pressure of the religion founded there to themselves, making it very difficult to effectively convert a holy city. = المدن المقدسة توفر أيضاً +30 ضغطاً للدين الذي تأسس فيها، مما يجعل تحويل مدينة مقدسة فعلياً صعباً جداً.
Lastly, before founding a religion, new cities you settle will start with 200 pressure for your pantheon. = أخيراً، قبل تأسيس دين، ستبدأ المدن الجديدة التي تستوطنها بـ 200 ضغط لمجمع آلهتك.
This way, all your cities will starting following your pantheon as long as you haven't founded a religion yet. = وبهذه الطريقة ستبدأ جميع مدنك باتباع مجمع آلهتك ما دمت لم تؤسس ديناً بعد.

Inquisitors = المفتشون
Inquisitors are the last religious unit, and their strength is removing other religions. = المفتشون هم آخر وحدة دينية، وقوتهم في إزالة الأديان الأخرى.
They can remove all other religions from one of your own cities, removing any pressures built up. = يمكنهم إزالة جميع الأديان الأخرى من إحدى مدنك، وإزالة أي ضغوط متراكمة.
Great prophets also have this ability, and remove all other religions in the city when spreading their religion. = الأنبياء العظماء لديهم هذه القدرة أيضاً، ويزيلون جميع الأديان الأخرى في المدينة عند نشر دينهم.
Often this results in the city immediately converting to their religion = وغالباً ينتج عن هذا تحول المدينة فوراً إلى دينهم
Additionally, when an inquisitor is stationed in or directly next to a city center, units of other religions cannot spread their faith there, though natural spread is unaffected. = إضافة إلى ذلك، عندما يتمركز مفتش في مركز مدينة أو بجانبه مباشرة، لا تستطيع وحدات الأديان الأخرى نشر إيمانها هناك، رغم أن الانتشار الطبيعي لا يتأثر.

The Mayan unique ability, 'The Long Count', comes with a side effect: = القدرة الفريدة للمايا، 'العد الطويل'، لها أثر جانبي:
Once active, the game's year display will use mayan notation. = بمجرد تفعيلها، سيستخدم عرض السنة في اللعبة ترقيم المايا.
The Maya measured time in days from what we would call 11th of August, 3114 BCE. A day is called K'in, 20 days are a Winal, 18 Winals are a Tun, 20 Tuns are a K'atun, 20 K'atuns are a B'ak'tun, 20 B'ak'tuns a Piktun, and so on. = كان المايا يقيسون الزمن بالأيام منذ ما نسميه 11 أغسطس 3114 قبل الميلاد. اليوم يُسمى كين، و20 يوماً وينال، و18 وينالاً تون، و20 تون كاتون، و20 كاتون باكتون، و20 باكتون بيكتون، وهكذا.
Unciv only displays ය B'ak'tuns, ඹ K'atuns and ම Tuns (from left to right) since that is enough to approximate gregorian calendar years. The Maya numerals are pretty obvious to understand. Have fun deciphering them! = يعرض Unciv فقط ය باكتون و ඹ كاتون و ම تون (من اليسار إلى اليمين) لأن ذلك كافٍ لتقريب السنوات الميلادية. أرقام المايا واضحة الفهم تماماً. استمتع بفك رموزها!

Your cities will periodically demand different luxury goods to satisfy their desire for new things in life. = ستطالب مدنك دورياً بسلع رفاهية مختلفة لإشباع رغبتها في أشياء جديدة في الحياة.
If you manage to acquire the demanded luxury by trade, expansion, or conquest, the city will celebrate We Love The King Day for 20 turns. = إذا نجحت في الحصول على الرفاهية المطلوبة بالتجارة أو التوسع أو الغزو، فستحتفل المدينة بيوم نحب الملك لمدة 20 دورة.
During the We Love The King Day, the city will grow 25% faster. = خلال يوم نحب الملك، ستنمو المدينة أسرع بنسبة 25%.
This means exploration and trade is important to grow your cities! = وهذا يعني أن الاستكشاف والتجارة مهمان لنمو مدنك!

Air Combat and Interception = القتال الجوي والاعتراض
Air Combat is very similar to normal Combat, with a few wrinkles. Damage is still dealt using the same equations based on the relative Strength of the Attacking and Defending Unit. = القتال الجوي مشابه جداً للقتال العادي مع بعض الفروق. ما زال الضرر يُحسب بالمعادلات نفسها بناءً على القوة النسبية للوحدة المهاجمة والمدافعة.
However, before the Attacker and Defender fight, there is an added combat phase called Interception. If there is any unit with Interception Range that covers the target attacked tile, then it will attempt to Intercept the Attacking Air Unit. If multiple units can Intercept, the one with higher Intercept chance does it. = لكن قبل أن يقاتل المهاجم والمدافع، هناك مرحلة قتال إضافية تسمى الاعتراض. إذا كانت أي وحدة لها مدى اعتراض يغطي المربع المستهدف بالهجوم، فستحاول اعتراض الوحدة الجوية المهاجمة. وإذا كان بإمكان عدة وحدات الاعتراض، فتلك ذات فرصة الاعتراض الأعلى هي من تفعل.
Generally Land/Naval Units have an Intercept Range of 2 Tiles, and Air Units have an Intercept Range of their Attack Range. = عموماً تملك الوحدات البرية/البحرية مدى اعتراض مربعين، وتملك الوحدات الجوية مدى اعتراض يساوي مدى هجومها.
Ground and Naval Units don't require movement points to Intercept, just Attacks. Air Units cannot have moved nor attacked in the preceding turn. = الوحدات البرية والبحرية لا تحتاج نقاط حركة للاعتراض، بل هجمات فقط. أما الوحدات الجوية فلا يجوز أن تكون قد تحركت أو هاجمت في الدور السابق.
The Intercepting Unit rolls to see if it hits. Whether it hits or not costs an Attack, and most units (without Promotions) can only Attack Once per Nation's Turn. It does NOT cost Movement Points, but Air Units that have used their Movement cannot Intercept between turns. = تُلقي الوحدة المعترضة النرد لترى هل تصيب. إصابتها أو عدمها تكلف هجوماً، ومعظم الوحدات (دون ترقيات) تستطيع الهجوم مرة واحدة فقط في دور الأمة. ولا يكلف نقاط حركة، لكن الوحدات الجوية التي استخدمت حركتها لا تستطيع الاعتراض بين الأدوار.
If the Intercepting Unit Hits, it deals damage according to the Combat Strength calculation to the Attacking Air Unit, potentially with any Strength Bonuses that apply to Interception. It does not receive damage from the Attacking Air Unit. = إذا أصابت الوحدة المعترضة، فإنها تلحق ضرراً بحسب حساب قوة القتال بالوحدة الجوية المهاجمة، مع أي مكافآت قوة تنطبق على الاعتراض. ولا تتلقى ضرراً من الوحدة الجوية المهاجمة.
After Interception resolves, the Attacking Air Unit and the Defending Unit in the targeted tile do Combat as normal, with damage dealt to both sides. = بعد حسم الاعتراض، تقاتل الوحدة الجوية المهاجمة والوحدة المدافعة في المربع المستهدف كالمعتاد، مع إلحاق الضرر بالجانبين.
To help deal with Interceptions, see Air Sweeps. = للمساعدة في التعامل مع الاعتراضات، انظر المسوح الجوية.

Air Sweeps = المسوح الجوية
Fighter units are able to perform Air Sweeps over a tile helping clear out potential enemy Air, Sea, or Land Interceptions that can reach that tile. = وحدات المقاتلات قادرة على تنفيذ مسوح جوية فوق مربع، مما يساعد في تطهير اعتراضات جوية أو بحرية أو برية معادية محتملة تصل إلى ذلك المربع.
While this Action will take an Attack, the benefit is drawing out Interceptions to help protect your other Air Units. Especially your Bombers. = وبينما سيكلف هذا الإجراء هجوماً، فإن الفائدة هي استدراج الاعتراضات لحماية وحداتك الجوية الأخرى. ولا سيما قاذفاتك.
Your unit will always draw an Interception, if one can reach the target tile, even if the Intercepting unit has a chance to miss. = ستستدرج وحدتك دائماً اعتراضاً إذا كان بإمكان أحدها الوصول إلى المربع المستهدف، حتى لو كانت للوحدة المعترضة فرصة للخطأ.
If the Interceptor is not an Air Unit (eg Land or Sea), the Air Sweeping unit and Interceptor take no damage! = إذا لم يكن المعترض وحدة جوية (مثل بري أو بحري)، فلن تتلقى وحدة المسح الجوي والمعترض أي ضرر!
If the Interceptor is an Air Unit, the two units will damage each other in a straight fight with no Interception bonuses. And only the Attacking Air Sweep Unit gets any Air Sweep strength bonuses. = إذا كان المعترض وحدة جوية، ستلحق الوحدتان الضرر ببعضهما في قتال مباشر دون مكافآت اعتراض. ووحدة المسح الجوي المهاجمة وحدها تحصل على أي مكافآت قوة للمسح الجوي.

Fortify, Guard, Withdraw = التحصين والحراسة والانسحاب
Most Land units have the ability to Fortify. As they spend time without moving, they will slowly gain a Fortification Bonus to their Combat Strength representing digging in and preparing in case of an attack. = لمعظم الوحدات البرية القدرة على التحصين. وبقضائها وقتاً دون تحرك، ستكسب ببطء مكافأة تحصين لقوة قتالها تمثل التحصن والاستعداد تحسباً لهجوم.
Some units have the ability to Withdraw before a melee attack is struck. However, perhaps you wish for them to stand their ground to protect a particular tile. If you do, then give them the Guard command and they will stay fixed until they die or you give them fresh orders. = بعض الوحدات لديها القدرة على الانسحاب قبل توجيه هجوم قتال قريب. لكن قد ترغب في أن تثبت في مكانها لحماية مربع معين. إن كان الأمر كذلك فأعطها أمر الحراسة وستبقى ثابتة حتى تموت أو تعطيها أوامر جديدة.
This is NOT the same as Fortify but they will still gain the Fortification Bonus. They will simply not utilize their Withdraw ability. Fortified units with the Withdraw ability will try to flee when attacked. = هذا ليس مثل التحصين لكنها ستظل تكسب مكافأة التحصين. فقط لن تستخدم قدرتها على الانسحاب. والوحدات المحصنة ذات قدرة الانسحاب ستحاول الفرار عند مهاجمتها.

City Tile Blockade = حصار مربع المدينة
One of your tiles is blocked by an enemy: when an enemy unit stands on a tile you own, the tile will not produce yields and cannot be worked by a city this turn. City will reallocate population from a blocked tile automatically. = أحد مربعاتك محاصَر من عدو: عندما تقف وحدة معادية على مربع تملكه، لن ينتج المربع عائدات ولن تستطيع المدينة العمل به هذا الدور. ستعيد المدينة تلقائياً توزيع السكان من المربع المحاصَر.
Enemy military land units block tiles they are standing on. Enemy military naval units additionally block adjacent water tiles. To protect your tiles from blockade, place a friendly military unit on it or fight off invaders. = وحدات العدو البرية العسكرية تحاصر المربعات التي تقف عليها. ووحدات العدو البحرية العسكرية تحاصر أيضاً مربعات الماء المجاورة. لحماية مربعاتك من الحصار، ضع عليها وحدة عسكرية صديقة أو قاتل الغزاة.

One of your cities is under a naval blockade! When all adjacent water tiles of a coastal city are blocked - city loses harbor connection to all other cities, including capital. Make sure to de-blockade cities by deploying friendly military naval units to fight off invaders. = إحدى مدنك تحت حصار بحري! عندما تُحاصَر جميع مربعات الماء المجاورة لمدينة ساحلية - تفقد المدينة اتصال الميناء بجميع المدن الأخرى، بما فيها العاصمة. احرص على فك حصار المدن بنشر وحدات بحرية عسكرية صديقة لمقاتلة الغزاة.

Spies! = الجواسيس!
The first time a civ reaches the Renaissance era each nation gets one spy. Every time a civ reaches an era afterwards they get one more spy. = عند وصول حضارة إلى عصر النهضة أول مرة تحصل كل أمة على جاسوس واحد. وفي كل مرة تصل حضارة إلى عصر بعدها تحصل على جاسوس إضافي.
Spies can be sent out to foreign cities to steal technology, rigging elections or stage coups. Place them in your own cities to do counter-intelligence work. = يمكن إرسال الجواسيس إلى المدن الأجنبية لسرقة التقنيات أو تزوير الانتخابات أو تدبير الانقلابات. وضعهم في مدنك للقيام بأعمال مكافحة التجسس.
Only one spy per civ is allowed in each city. Spies that are not in any city are on vacation in your spy hideout. = يُسمح بجاسوس واحد فقط لكل حضارة في كل مدينة. والجواسيس غير الموجودين في أي مدينة في إجازة في مخبأ جواسيسك.
Spies set up in cities of major civilizations will try to steal technology at a rate which is based off of the science production in the city. Succeeding to steal technology will level up your spy. Failing to succeed will level up the defending spy if it is present. = الجواسيس المعيّنون في مدن الحضارات الكبرى سيحاولون سرقة التقنية بمعدل يعتمد على إنتاج العلوم في المدينة. نجاح سرقة التقنية يرفع مستوى جاسوسك. وفشله يرفع مستوى الجاسوس المدافع إن كان موجوداً.
Spies set in city-states will try to rig the elections in order to gain influence and reduce the influence of other civilizations. Only one spy partaking in rigging the election can win. = الجواسيس المعيّنون في الدول المدن سيحاولون تزوير الانتخابات لكسب النفوذ وتقليل نفوذ الحضارات الأخرى. جاسوس واحد فقط مشارك في تزوير الانتخابات يمكنه الفوز.
A spy that is rigging an election in a city-state may also stage a coup. The likelihood of success for the coup depends on your relative influence to the current ally of the city-state, your spy level, and the level of the spy that the current ally has in the city-state if present. Succeeding a coup will make you their new ally and reduce the influence of all other civs. Failing a coup will kill your spy and level up the defending spy if present. = الجاسوس الذي يزوّر الانتخابات في دولة مدينة قد يدبّر أيضاً انقلاباً. يعتمد احتمال نجاح الانقلاب على نفوذك النسبي مقارنة بالحليف الحالي لدولة المدينة، ومستوى جاسوسك، ومستوى جاسوس الحليف الحالي في دولة المدينة إن وُجد. نجاح الانقلاب سيجعلك حليفها الجديد ويقلل نفوذ جميع الحضارات الأخرى. وفشله سيقتل جاسوسك ويرفع مستوى الجاسوس المدافع إن وُجد.
Spies that are set up in your own cities will be conducting counter-intelligence. They reduce the success chance of other spies trying to steal your technology. = الجواسيس المعيّنون في مدنك سيقومون بمكافحة التجسس. يقللون فرصة نجاح الجواسيس الآخرين الذين يحاولون سرقة تقنيتك.
Spies at a higher rank have a higher chance of success. The max rank a spy can reach is rank 3. After a spy is killed it will revive after a certain amount of turns back at rank 1. = الجواسيس ذوو الرتب الأعلى لديهم فرصة نجاح أعلى. أقصى رتبة يمكن أن يبلغها الجاسوس هي الرتبة 3. وبعد قتل الجاسوس يحيا بعد عدد معين من الدورات عائداً إلى الرتبة 1.
Building buildings like the constabulary and police station will reduce the technology steal rate of spies in that city. = بناء مبانٍ كالشرطة ومركز الشرطة سيقلل معدل سرقة التقنية للجواسيس في تلك المدينة.
Espionage is available using the Gods and Kings ruleset. To enable it in a new game click advanced settings, then click on the Enable Espionage option. = التجسس متاح باستخدام مجموعة قواعد الآلهة والملوك. لتفعيله في لعبة جديدة انقر على الإعدادات المتقدمة ثم على خيار تفعيل التجسس.

Keyboard Bindings = تعيينات المفاتيح
Limitations = القيود
This is a work in progress. = هذا عمل قيد التطوير.
For technical reasons, only direct keys or Ctrl-Letter combinations can be used. = لأسباب تقنية، لا يمكن استخدام سوى المفاتيح المباشرة أو تركيبات Ctrl-حرف.
Using the Keys page = استخدام صفحة المفاتيح
Each binding has a button with an image looking like this: = لكل تعيين زر بصورة تشبه هذه:
While hovering the mouse over the key button, you can press a desired key directly to assign it. = أثناء تحويم الماوس فوق زر المفتاح، يمكنك الضغط على المفتاح المطلوب مباشرة لتعيينه.
Double-click the image to reset the binding to default. = انقر مرتين على الصورة لإعادة التعيين إلى الافتراضي.
Bindings mapped to their default keys are displayed in gray, those reassigned by you in white. = التعيينات المرتبطة بمفاتيحها الافتراضية تظهر باللون الرمادي، وتلك التي أعدت تعيينها بالأبيض.
Conflicting assignments are marked red. Conflicts can exist across categories, like World Screen / Unit Actions. Note that at the moment, the game does not prevent saving conflicting assignments, though the result may be unexpected. = التعيينات المتعارضة تُعلَّم بالأحمر. قد توجد تعارضات عبر الفئات، مثل شاشة العالم / إجراءات الوحدة. لاحظ أن اللعبة حالياً لا تمنع حفظ التعيينات المتعارضة، رغم أن النتيجة قد تكون غير متوقعة.
For discussion about missing entries, see the linked github issue. = لمناقشة الإدخالات المفقودة، انظر مشكلة github المرتبطة.

Welcome to the Civilopedia! = مرحباً بك في الموسوعة!
Here you can find information - general help, rules, and what makes up the game world. = هنا يمكنك العثور على المعلومات - المساعدة العامة والقواعد وما يشكل عالم اللعبة.
How to find information = كيف تجد المعلومات
Select categories with the buttons on top of the screen. Also up there is the button to leave Civilopedia and go back to where you were before. = اختر الفئات بالأزرار أعلى الشاشة. وهناك أيضاً زر مغادرة الموسوعة والعودة إلى حيث كنت.
Each category has a list of entries on the left of the screen, sorted alphabetically (with few exceptions). Clicking an entry will update the center pane were you are currently reading this. = لكل فئة قائمة بالمدخلات على يسار الشاشة، مرتبة أبجدياً (مع استثناءات قليلة). النقر على مدخل سيحدّث اللوحة الوسطى حيث تقرأ هذا الآن.
Lines can link to other Civilopedia entries, they are marked with a chain link symbol like this one. You can click anywhere on the line to follow the link. = يمكن أن تربط الأسطر بمدخلات أخرى في الموسوعة، وهي معلَّمة برمز حلقة سلسلة مثل هذا. يمكنك النقر في أي مكان على السطر لاتباع الرابط.
The current category is special - all articles on general concepts are here. It is called 'Tutorials' because you can revisit these here, too. = الفئة الحالية خاصة - جميع المقالات عن المفاهيم العامة هنا. تُسمى 'الإرشادات' لأنه يمكنك إعادة زيارتها هنا أيضاً.
What information can I find = ما المعلومات التي يمكنني العثور عليها
The data shown is not dependent on your current game's situation, e.g. bonuses for the nation you are playing or difficulty modifiers will not affect the numbers. = البيانات المعروضة لا تعتمد على حالة لعبتك الحالية، فمثلاً مكافآت الأمة التي تلعب بها أو معدّلات الصعوبة لن تؤثر في الأرقام.
However, it will reflect the mods you are playing! The combination of base ruleset and extension mods you select define the rules of a game, what objects exist and how they interact, and the Civilopedia mirrors these rules. = لكنها ستعكس التعديلات التي تلعب بها! فمزيج المجموعة الأساسية للقواعد وتعديلات الإضافة التي تختارها يحدد قواعد اللعبة، وما الكائنات الموجودة وكيف تتفاعل، والموسوعة تعكس هذه القواعد.
If you opened the Civilopedia from the main menu, the "Ruleset" will be that of the last game you started. = إذا فتحت الموسوعة من القائمة الرئيسية، فستكون "مجموعة القواعد" هي مجموعة آخر لعبة بدأتها.
Letters can select categories, and when there are multiple categories matching the same letter, you can press that repeatedly to cycle between these. = يمكن للأحرف اختيار الفئات، وعند وجود عدة فئات تطابق الحرف نفسه يمكنك الضغط عليه مراراً للتنقل بينها.
The arrow keys allow navigation as well - left/right for categories, up/down for entries. = تتيح مفاتيح الأسهم التنقل أيضاً - يسار/يمين للفئات، أعلى/أسفل للمدخلات.

UI Tips = نصائح الواجهة
World screen = شاشة العالم
Skip all units to end a turn quickly = تخطَّ جميع الوحدات لإنهاء الدور بسرعة
Right-click or long press the "Next unit" button to open a popup menu which allows to end a turn without having to cycle through all units. If some units are automated, a dedicated button is available to move them before ending the turn. = انقر بزر الماوس الأيمن أو اضغط مطولاً على زر "الوحدة التالية" لفتح قائمة منبثقة تتيح إنهاء الدور دون التنقل بين جميع الوحدات. وإذا كانت بعض الوحدات آلية، يتوفر زر مخصص لتحريكها قبل إنهاء الدور.
Toggle notification list display = تبديل عرض قائمة الإشعارات
On the World screen, swipe the notification list to the right to temporarily hide it. Click the "Bell" button to display them again. = في شاشة العالم، اسحب قائمة الإشعارات إلى اليمين لإخفائها مؤقتاً. انقر على زر "الجرس" لعرضها مرة أخرى.
The default state for the notification list can be set in Options > Display > UI - Notifications on world screen. = يمكن ضبط الحالة الافتراضية لقائمة الإشعارات في الخيارات > العرض > الواجهة - الإشعارات في شاشة العالم.
Entering a City Screen quickly = الدخول إلى شاشة المدينة بسرعة
You can Right-click or long press a city button on the World screen. The result is the same as tapping it twice - once to select and move the button, again to trigger a reaction: show the City Screen (if the city is yours to inspect), or offer the foreign city info popup. = يمكنك النقر بالزر الأيمن أو الضغط مطولاً على زر مدينة في شاشة العالم. النتيجة نفسها كالنقر عليها مرتين - مرة للتحديد ونقل الزر، ومرة أخرى لإطلاق رد فعل: عرض شاشة المدينة (إن كانت المدينة لك لتفحصها)، أو تقديم نافذة معلومات المدينة الأجنبية.
Upgrade multiple units of the same type = ترقية عدة وحدات من النوع نفسه
On the World screen, select a unit that can be upgraded, then right-click or long press the "Upgrade" button to open a popup menu allowing to upgrade all units of this type at once. = في شاشة العالم، حدد وحدة قابلة للترقية، ثم انقر بالزر الأيمن أو اضغط مطولاً على زر "ترقية" لفتح قائمة منبثقة تتيح ترقية جميع وحدات هذا النوع دفعة واحدة.
In the Units overview, the same upgrade menu is available by clicking the unit icon in the "Upgrade" column. When a unit is upgradeable, the icon is lit if conditions are met (enough gold and/or resources), otherwise it is dimmed. = في نظرة عامة على الوحدات، تتوفر قائمة الترقية نفسها بالنقر على أيقونة الوحدة في عمود "ترقية". وعندما تكون الوحدة قابلة للترقية تكون الأيقونة مضاءة إن تحققت الشروط (ذهب و/أو موارد كافية)، وإلا فتكون خافتة.
Additional controls for the construction queue = عناصر تحكم إضافية لقائمة البناء
Right-click or long press a construction item to open a popup menu with additional controls, allowing to manage production of the same item in all cities, by issuing the commands from the same City Screen. = انقر بالزر الأيمن أو اضغط مطولاً على عنصر بناء لفتح قائمة منبثقة بعناصر تحكم إضافية، تتيح إدارة إنتاج العنصر نفسه في جميع المدن، بإصدار الأوامر من شاشة المدينة نفسها.
The "Disable" option (in a single city or all cities) moves an item to a separated "Disabled" tab, to prevent its automatic queueing by the "Auto-assign city production" option or to remove irrelevant objects from the production planning. To move a disabled item back to its initial place, re-enter its popup menu, and choose "Enable". = خيار "تعطيل" (في مدينة واحدة أو في جميع المدن) ينقل عنصراً إلى تبويب "معطّل" منفصل، لمنع إضافته تلقائياً إلى القائمة بخيار "تعيين إنتاج المدن تلقائياً" أو لإزالة الكائنات غير ذات الصلة من تخطيط الإنتاج. ولإعادة عنصر معطّل إلى مكانه الأصلي، أعد فتح قائمته المنبثقة واختر "تفعيل".
Disabled items are set for the current game only and are carried over when founding a new city. = العناصر المعطلة تُحدَّد للعبة الحالية فقط وتنتقل عند تأسيس مدينة جديدة.
Show Great Person Points breakdown = عرض تفصيل نقاط الشخصيات العظيمة
In the right sidepanel, click a Great People row to display the details of Great Person Points (GPP) accumulated each turn by the current city, for this type of Great People. = في اللوحة الجانبية اليمنى، انقر على صف الشخصيات العظيمة لعرض تفاصيل نقاط الشخصيات العظيمة (GPP) المتراكمة كل دورة في المدينة الحالية، لهذا النوع من الشخصيات العظيمة.
Click any of the Great People icons to display all GPP accumulated each turn by the current city, for all types of Great People. = انقر على أي من أيقونات الشخصيات العظيمة لعرض جميع نقاط GPP المتراكمة كل دورة في المدينة الحالية لجميع أنواع الشخصيات العظيمة.
Tech screen = شاشة التقنيات
Queue multiple technologies in different branches = ضع عدة تقنيات في قائمة الانتظار في فروع مختلفة
On the Tech screen, right-click or long press a technology to automatically queue it, even if this tech is in another branch than the item currently researched. Prerequisite techs to research will also be automatically queued. = في شاشة التقنيات، انقر بالزر الأيمن أو اضغط مطولاً على تقنية لوضعها تلقائياً في قائمة الانتظار، حتى لو كانت هذه التقنية في فرع آخر غير العنصر قيد البحث حالياً. وستوضع التقنيات المتطلبة للبحث في القائمة تلقائياً أيضاً.
Right-click or long press multiple techs to append them to the research queue, whatever their branch is. = انقر بالزر الأيمن أو اضغط مطولاً على عدة تقنيات لإلحاقها بقائمة البحث، أياً كان فرعها.
Overview screens = شاشات النظرة العامة
Reveal known resources on world screen = كشف الموارد المعروفة على شاشة العالم
In the Resources overview, click on a resource icon to center the world screen on tiles already discovered and providing this resource. = في نظرة عامة على الموارد، انقر على أيقونة مورد لتوسيط شاشة العالم على المربعات المكتشفة بالفعل والتي توفر هذا المورد.
Alternatively, click on the "Unimproved" number to center the world screen only on owned (by you or your allied City-states) tiles where the resource is not improved. = بدلاً من ذلك، انقر على رقم "غير محسّن" لتوسيط شاشة العالم على المربعات المملوكة (لك أو لحلفائك من الدول المدن) حيث المورد غير محسّن.
If more than one tile is available, click repeatedly on the notification to cycle through all of them. = إذا كان أكثر من مربع متاحاً، فانقر مراراً على الإشعار للتنقل بينها جميعاً.
Show diagram line colors = عرض ألوان خطوط المخطط
In Politics overview > Show diagram, you can click anywhere inside the diagram to display a table listing all relationship line colors and their meaning. = في نظرة عامة على السياسة > عرض المخطط، يمكنك النقر في أي مكان داخل المخطط لعرض جدول يسرد جميع ألوان خطوط العلاقات ومعانيها.
Reading "Toast" popups = قراءة نوافذ "Toast" المنبثقة
"Toasts" can be clicked to make them stay on the screen for easier reading. = يمكن النقر على نوافذ "Toast" لإبقائها على الشاشة لقراءة أسهل.
Click it again to close (or use the close button). = انقر عليها مرة أخرى لإغلاقها (أو استخدم زر الإغلاق).
Miscellaneous = متفرقات
External links = الروابط الخارجية
External links support right-click or long press to copy the link to the clipboard instead of launching the browser. = تدعم الروابط الخارجية النقر بالزر الأيمن أو الضغط المطوّل لنسخ الرابط إلى الحافظة بدلاً من فتح المتصفح.
Example: The 'Open Github page' button on the Mod management screen. = مثال: زر 'فتح صفحة Github' في شاشة إدارة التعديلات.
View change log = عرض سجل التغييرات
After updating, you might want to see what has changed. The "About" in "Options" has the version number linked to the change log. You can also see that info by clicking the version number on the main menu. = بعد التحديث قد ترغب في رؤية ما تغيّر. "حول" في "الخيارات" فيه رقم الإصدار مرتبطاً بسجل التغييرات. ويمكنك أيضاً رؤية هذه المعلومات بالنقر على رقم الإصدار في القائمة الرئيسية.

Differences from Civilization V = الفروق عن Civilization V
Production Focus\nIn Civilization V, the Food yield in a city is calculated first, then population grows by consuming stored food (growth), then production is calculated, and so on one by one the other stats are calculated. Thus, citizens can produce yields in the same turn as they are born. The city focus is set to Production to assign the newborn citizen to a hill so they'll contribute Production, and then manually reassigned to a growth tile on the next turn. Alternatively, you can set city focus to Gold (e.g. with Cerro de Potosi), Faith (e.g. with Mount Sinai) or whatever gains the most yields. In Unciv, citizens only start producing yields on the next turn, so you can ignore this whole concept. = التركيز على الإنتاج\nفي Civilization V يُحسب عائد الطعام في المدينة أولاً، ثم يزداد السكان باستهلاك الطعام المخزّن (النمو)، ثم يُحسب الإنتاج، وهكذا تُحسب بقية الإحصائيات واحدة تلو الأخرى. وبذلك يستطيع المواطنون إنتاج العائدات في الدور نفسه الذي وُلدوا فيه. يُضبط تركيز المدينة على الإنتاج لتعيين المواطن المولود حديثاً على تل ليسهم في الإنتاج، ثم يُعاد تعيينه يدوياً إلى مربع نمو في الدور التالي. أو يمكنك ضبط تركيز المدينة على الذهب (مثلاً مع سيرو دي بوتوسي) أو الإيمان (مثلاً مع جبل سيناء) أو أي شيء يحقق أكبر العائدات. في Unciv لا يبدأ المواطنون الإنتاج إلا في الدور التالي، فيمكنك تجاهل هذا المفهوم كله.
Science Queueing\nIn Civilization V, Science yield is calculated after production, so if you finish an item and have Science (or Gold) queued as a perpetual construction, the Production overflow from item will be converted into Science (or Gold), but the Production is not consumed, as this will only happen again on the next turn. By immediately swapping out your perpetual construction for an item on the next turn, you'll get this Science (or Gold) for free. This doesn't apply to Unciv, so don't bother. = طابور العلوم\nفي Civilization V يُحسب عائد العلوم بعد الإنتاج، فإذا أنهيت عنصراً ولديك العلوم (أو الذهب) في قائمة البناء كمشروع دائم، فسيتحول فائض الإنتاج من العنصر إلى علوم (أو ذهب)، لكن الإنتاج لا يُستهلك، إذ لن يحدث ذلك إلا في الدور التالي. وباستبدال مشروعك الدائم بعنصر آخر مباشرة في الدور التالي، ستحصل على هذه العلوم (أو الذهب) مجاناً. لا ينطبق هذا على Unciv، فلا تكلف نفسك عناء ذلك.
Double Aqueducts\nIn Civilization V, the game sells existing copies of the building for you before providing a free copy of the building. So, if you build an aqueduct in a city, and then in the turn of adopting Tradition Complete you sell a cheap building (e.g a shrine) beforehand, the game is unable to sell more than 1 building per turn, and thus you'll keep your aqueduct, together with the new free aqueduct. Not applicable to Unciv. = القنوات المائية المزدوجة\nفي Civilization V تبيع اللعبة النسخ الموجودة من المبنى نيابة عنك قبل منحك نسخة مجانية منه. فإذا بنيت قناة مائية في مدينة، ثم في دور اعتماد اكتمال التقليد بعت مبنى رخيصاً (مثل ضريح) قبل ذلك، فلا تستطيع اللعبة بيع أكثر من مبنى واحد في الدور، وبالتالي ستحتفظ بقناتك المائية مع القناة المجانية الجديدة. لا ينطبق على Unciv.
Legalism Oxford\nIn Civilization V, national wonders such as Oxford University are considered culture buildings, so you can get them for free with Legalism. Not applicable to Unciv. = أكسفورد والشرعانية\nفي Civilization V تُعدّ العجائب الوطنية مثل جامعة أكسفورد مباني ثقافية، فيمكنك الحصول عليها مجاناً بالشرعانية. لا ينطبق هذا على Unciv.
Roads and Forts\nIn Civilization V, you can't use roads and forts in enemy territory. In Unciv, you can use them, so instead of mindlessly constructing them everywhere when at war, you need to decide if and when they'll benefit you more than your opponents. = الطرق والحصون\nفي Civilization V لا يمكنك استخدام الطرق والحصون في أراضي العدو. في Unciv يمكنك استخدامها، فبدلاً من بنائها في كل مكان دون تفكير أثناء الحرب، عليك أن تقرر إن كانت ستفيدك أكثر من خصومك ومتى.
Citizen Conversion\nIn Civilization V, a citizen is born religious if the parent city is already converted. This is not the case in Unciv, which can lead to temporary deconversion of a city when it grows. = تحويل المواطنين\nفي Civilization V يولد المواطن متديناً إذا كانت المدينة الأم قد تحولت بالفعل. وليس هذا هو الحال في Unciv، مما قد يؤدي إلى إلغاء تحول مؤقت للمدينة عند نموها.
Unassigned Citizens\nIn Civilization V, unassigned citizens are considered specialists, and subject to the same type of bonuses (e.g. Korea's ability). It can be worthwhile to leave citizens unassigned, instead of being assigned to a tile. Not applicable to Unciv. = المواطنون غير المعيّنين\nفي Civilization V يُعدّ المواطنون غير المعيّنين متخصصين، ويخضعون للأنواع نفسها من المكافآت (مثل قدرة كوريا). قد يكون من المجدي ترك المواطنين دون تعيين بدلاً من تعيينهم في مربع. لا ينطبق هذا على Unciv.
Settler Construction\nIn Civilization V, cities can't starve when constructing settlers, so you can assign all citizens to production tiles and none to food tiles. In Unciv, citizens keep consuming two food per turn. = بناء المستوطنين\nفي Civilization V لا تستطيع المدن أن تتضور جوعاً أثناء بناء المستوطنين، فيمكنك تعيين جميع المواطنين في مربعات الإنتاج وبلا أحد في مربعات الطعام. في Unciv يواصل المواطنون استهلاك طعامين في الدورة.
Water Melee Attack\nAs result of a Discord poll, Water Melee units can attack military land units on the shore, unlike in Civilization V. = هجوم القتال القريب المائي\nنتيجة استطلاع على Discord، يمكن لوحدات القتال القريب المائية مهاجمة الوحدات البرية العسكرية على الشاطئ، بخلاف Civilization V.
Tile improvements\nIn Civilzation V, workers start working on an improvement-under-construction at the beginning of movement. Unciv changes this, to allow players to assign workers to tiles, and then reconsider and change improvement or move them elsewhere. = تحسينات المربعات\nفي Civilization V يبدأ العمال العمل على تحسين قيد الإنشاء عند بداية الحركة. يغير Unciv هذا للسماح للاعبين بتعيين العمال على المربعات ثم إعادة النظر وتغيير التحسين أو نقلهم إلى مكان آخر.
Forest and Jungle Visibility\nIn Unciv, forests and jungles are visible 1 tile outside visibility range. In Civilization V, this is the behaviour of hills and mountains, but not of forests and jungles, yet jungle and forest can block hills, and hill + forest can block mountain, indicating they're on the same elevation. This is considered to be a bug in the otherwise well-structured visibility logic in Civilization V. = رؤية الغابات والأدغال\nفي Unciv تكون الغابات والأدغال مرئية على بعد مربع خارج مدى الرؤية. في Civilization V هذا سلوك التلال والجبال، لا الغابات والأدغال، ومع ذلك يمكن للأدغال والغابات حجب التلال، والتل مع الغابة قد يحجب الجبل، مما يدل على أنها على الارتفاع نفسه. ويُعدّ هذا خللاً في منطق الرؤية الجيد البنية في Civilization V.
City razing\nIn Civilization V, the player can never raze any of the cities he/she founded. Not applicable to Unciv. = هدم المدن\nفي Civilization V لا يستطيع اللاعب هدم أي من المدن التي أسسها. لا ينطبق هذا على Unciv.

Founding Cities\nThe Settler is a unit that can found a new city. You can build a Settler unit in a city with at least 2 population, and then move them to a good location to found a new city. This will usually be your main way of acquiring more cities. = تأسيس المدن\nالمستوطن وحدة يمكنها تأسيس مدينة جديدة. يمكنك بناء وحدة مستوطن في مدينة بها نسمتان على الأقل، ثم نقلها إلى موقع جيد لتأسيس مدينة جديدة. وستكون هذه عادةً طريقتك الرئيسية للحصول على مزيد من المدن.
Food conversion to Production\nDuring the construction of a Settler, the city will not grow. Instead, the 1st, 2nd, 4th, and from there on every 4th, excess Food (Growth) is converted into Production, with the rest of the excess Food being lost. = تحويل الطعام إلى إنتاج\nأثناء بناء مستوطن لن تنمو المدينة. بدلاً من ذلك يتحول فائض الطعام (النمو) الأول والثاني والرابع، ثم كل رابع بعد ذلك، إلى إنتاج، ويُفقد ما تبقى من فائض الطعام.

Default Promotions = الترقيات الافتراضية
Allow the player to apply a set of promotions when a unit is built. = السماح للاعب بتطبيق مجموعة من الترقيات عند بناء وحدة.
To make a promotion the default, check 'Default promotions for [unit]' then click 'Pick promotions'. = لجعل ترقية افتراضية، حدد 'الترقيات الافتراضية لـ [unit]' ثم انقر على 'اختر الترقيات'.
To disable default promotions for a unit, uncheck 'Use default promotions' under the buy button for the unit. = لتعطيل الترقيات الافتراضية لوحدة، ألغِ تحديد 'استخدام الترقيات الافتراضية' تحت زر الشراء للوحدة.
Default promotion only applies to the same units that you selected. It only applies per cities. It can't be used in puppeted cities or cities that you don't own. = الترقية الافتراضية تنطبق فقط على الوحدات نفسها التي حددتها. وتنطبق لكل مدينة فقط. ولا يمكن استخدامها في المدن التابعة أو المدن التي لا تملكها.
If the city doesn't have enough XP it will not apply all the promotions. And default promotions doesn't affect the civ AI in anyway. = إذا لم تملك المدينة خبرة كافية فلن تطبق جميع الترقيات. والترقيات الافتراضية لا تؤثر في الذكاء الاصطناعي للحضارات بأي شكل.

