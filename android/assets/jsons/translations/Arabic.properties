Kamehameha I = كاميهاميها الأول
The ancient fire flashing across the sky is what proclaimed that this day would come, though I had foolishly hoped for a different outcome. = النار القديمة التي لمعت في السماء هي ما أعلن أن هذا اليوم سيأتي، رغم أنني أملت بحماقة في نتيجة مختلفة.
It is obvious now that I misjudged you and your true intentions. = من الواضح الآن أنني أسأت تقديرك وتقدير نواياك الحقيقية.
The hard-shelled crab yields, and the lion lies down to sleep. Kanaloa comes for me now. = السلطعون صلب القشرة يستسلم، والأسد يستلقي لينام. كانالوا يأتي من أجلي الآن.
The ocean's tide may rise and fall, but my resolve stands steady. = مد المحيط قد يعلو ويهبط، لكن عزمي ثابت.
Aloha! Greetings and blessings upon you, friend. I am Kamehameha, Great King of this strand of islands. = ألوها! تحياتي وبركاتي لك يا صديقي. أنا كاميهاميها، الملك العظيم لهذه السلسلة من الجزر.
Come, let our people feast together! = تعال، لنتناول الوليمة معاً!
Welcome, friend! = مرحباً بك يا صديقي!
Wayfinding = إيجاد الطريق
Aloha to Kamehameha the Great, who the heavens allowed to unite your people! O great King, under your reign, the Big Island of Hawai'i became one in 1791 AD, and many other islands joined your vision of union in 1810. As the first King of Hawai'i, law and taxation systems were stabilized, and you promoted the Kanawai Mamalahoe, an edict to protect civilian people in times of war. Unification and sovereignty of all the islands continued thanks to your fair laws and deeds, even after you joined your ancestors in paradise in 1819. = ألوها لكاميهاميها العظيم، الذي سمحت له السماء بتوحيد شعبه! أيها الملك العظيم، في عهدك أصبحت جزيرة هاواي الكبرى واحدة عام 1791 م، وانضمت جزر أخرى كثيرة إلى رؤيتك للاتحاد عام 1810. وكأول ملك لهاواي، استقرت أنظمة القانون والضرائب، وأعلنت قانون كاناواي ماماهوي، مرسوماً لحماية المدنيين في أوقات الحرب. واستمر توحيد الجزر وسيادتها بفضل قوانينك وأعمالك العادلة، حتى بعد التحاقك بأسلافك في الجنة عام 1819.
Wise and benevolent King, will you unite your people once again by wearing the bright mantle of the Lion of the Pacific? Will your new empire shine through the ages of history? = أيها الملك الحكيم الرحيم، هل ستوحد شعبك مرة أخرى بارتداء عباءة أسد المحيط الهادئ المشرقة؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
