You are but a pest on this Earth, prepare to be eliminated! = أنت مجرد آفة على هذه الأرض، استعد للإبادة!
You are a fool who evokes pity. You have brought my hostility upon yourself and your repulsive civilization! = أنت أحمق يثير الشفقة. لقد جلبت عداوتي على نفسك وعلى حضارتك المقيتة!
Strike me down and my soul will torment yours forever, you have won nothing. = اضربني وستعذب روحي روحك إلى الأبد، فأنت لم تكسب شيئاً.
Greetings, I am Ramesses the god. I am the living embodiment of Egypt, mother and father of all civilizations. = تحياتي، أنا رمسيس الإله. أنا التجسيد الحي لمصر، أم الحضارات وأبوها.
Generous Egypt makes you this offer. = مصر الكريمة تقدم لك هذا العرض.
Good day. = يوم سعيد.
Oh, it's you. = آه، إنه أنت.
Monument Builders = بناة النصب
O great Ramesses, Pharaoh of Egypt, bright as the Sun and mighty as the Nile! Lord of all living things, you lead the greatest of all civilizations, which has gifted the world with writing, advanced mathematics, sculpture, and architecture. Egyptian monuments and culture will continue to amaze the world for thousands of years. = أيها الفرعون رمسيس العظيم، حاكم مصر، المشرق كالشمس والقوي كالنيل! يا سيد كل الكائنات الحية، أنت تقود أعظم الحضارات جميعاً، التي أهدت العالم الكتابة والرياضيات المتقدمة والنحت والعمارة. ستظل نصب مصر وثقافتها تدهش العالم آلاف السنين.
Mighty and eternal Ramesses, Egypt lasted for millenia, whereas other civilisations disappeared into dust after a few centuries. Amun-Ra blesses you again to lead Egypt and its people on the path of light. Will your new empire shine through the ages of history? = يا رمسيس القوي الخالد، دامت مصر آلاف السنين بينما اختفت حضارات أخرى كالغبار بعد بضعة قرون. يباركك آمون-رع مرة أخرى لتقود مصر وشعبها على درب النور. هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
