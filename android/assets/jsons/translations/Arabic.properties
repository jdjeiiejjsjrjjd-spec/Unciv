Sejong = سيجونغ
Jip-hyun-jun (Hall of Worthies) will no longer tolerate your irksome behavior. We will liberate the citizens under your oppression even with force, and enlighten them! = لن تتسامح قاعة العلماء (جيب-هيون-جون) مع سلوكك المزعج بعد الآن. سنحرر المواطنين الذين تضطهدهم ولو بالقوة، وننيرهم!
Foolish, miserable wretch! You will be crushed by this country's magnificent scientific power! = أيها البائس الأحمق! ستسحقك قوة هذا البلد العلمية الرائعة!
Now the question is who will protect my people. A dark age has come. = الآن السؤال من سيحمي شعبي. لقد حل عصر مظلم.
Your words reveal more of your own prejudice than any fault in my own. = كلماتك تكشف عن تحيزك أكثر مما تكشف عن أي عيب في.
Welcome to the palace of Choson, stranger. I am the learned King Sejong, who looks after his great people. = مرحباً بك في قصر جوسون أيها الغريب. أنا الملك العالم سيجونغ، الذي يرعى شعبه العظيم.
We have many things to discuss and have much to benefit from each other. = لدينا أمور كثيرة نتحدث فيها ونستفيد منها معاً.
Oh, it's you = آه، إنه أنت
Scholars of the Jade Hall = علماء قاعة اليشم
Greetings to you, King Sejong the Great, heir of the Choson Dynasty! Prosperity and benevolence towards the common man are the principles of your reign, and made of you the most beloved Korean king. You always aimed to provide a fair and equal society for all your people, and also to favor knowledge and technological discoveries. Your wisdom and intelligence imbued all the Korean society, and the scholars of the Jade Hall developed Korea's first written language, Hangul, sharing further literature and science to the people after centuries of darkness. = تحياتي لك أيها الملك سيجونغ العظيم، وريث سلالة جوسون! الازدهار والإحسان إلى عامة الناس مبدآن في حكمك، وقد جعلاك أحب ملك كوري. كنت تهدف دوماً إلى توفير مجتمع عادل ومتساوٍ لجميع شعبك، وإلى تشجيع المعرفة والاكتشافات التقنية. وقد عمّت حكمتك وذكاؤك المجتمع الكوري كله، وطور علماء قاعة اليشم أول لغة مكتوبة في كوريا، الهانغول، ناشرين الأدب والعلم بين الناس بعد قرون من الظلام.
Wise Sejong, will you gift your people with the radiance of harmony and knowledge to dispel the darkness once again? Will your new empire shine through the ages of history? = أيها السيجونغ الحكيم، هل ستهدي شعبك إشراق الوئام والمعرفة لتبديد الظلام مرة أخرى؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
