Isabella = إيزابيلا
God will probably forgive you... but I shall not. Prepare for war. = الله على الأرجح سيغفر لك... لكنني لن أفعل. استعد للحرب.
Repugnant spawn of the devil! You will pay! = يا نسل الشيطان البغيض! ستدفع الثمن!
If my defeat is, without any doubt, the will of God, then I will accept it. = إن كانت هزيمتي، بلا شك، مشيئة الله، فسأقبلها.
God blesses those who deserve it. I am Isabel of Spain. = الله يبارك من يستحق. أنا إيزابيل ملكة إسبانيا.
I hope this deal will receive your blessing. = آمل أن تنال هذه الصفقة بركتك.
Seven Cities of Gold = مدن الذهب السبع
Holy Isabella, envoy of God, Great Queen of Castille and León, your people celebrate you! Spain is a beautiful and ancient country, a link between Europe and Africa, one shore on the Mediterranean and the other on the mighty Atlantic Ocean. The Spanish culture had taken the best of the Christian and Muslim worlds, and was ready to dominate the world for centuries. Powerful Spanish military fleets and brave explorers found and conquered much of the New World. Exploiting a whole new continent and its riches, Spain reached a state of power few could compete with for hundreds of years. = أيتها المقدسة إيزابيلا، رسولة الله، ملكة قشتالة وليون العظيمة، شعبك يحتفي بك! إسبانيا بلد جميل وقديم، حلقة وصل بين أوروبا وأفريقيا، شاطئ على المتوسط وآخر على المحيط الأطلسي العظيم. أخذت الثقافة الإسبانية أفضل ما في العالمين المسيحي والإسلامي، وكانت جاهزة للهيمنة على العالم قروناً. وقد اكتشفت الأساطيل العسكرية الإسبانية القوية والمستكشفون الشجعان معظم العالم الجديد وفتحوه.
O splendid and virtuous Isabella! By the will of the heavens, will Spain reborn to achieve its holy destiny and become a new El Dorado? Will your new empire shine through the ages of history? = أيتها الإيزابيلا الرائعة الفاضلة! بإرادة السماء، هل ستُبعث إسبانيا لتحقق قدرها المقدس وتصبح إلدورادو جديدة؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
