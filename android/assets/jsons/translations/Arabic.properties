Harald Bluetooth = هارالد بلوتوث
If I am to be honest, I tire of those pointless charades. Why don't we settle our disputes on the field of battle, like true men? Perhaps the skalds will sing of your valor... or mine! = إن كنت صادقاً، فقد سئمت من هذه المسرحيات العقيمة. لماذا لا نحسم خلافاتنا في ساحة المعركة، كالرجال الحقيقيين؟ لعل الشعراء يغنون عن شجاعتك... أو شجاعتي!
Ahahah! You seem to show some skills of a true Viking! Too bad that I'll probably kill you! = هاهاها! يبدو أنك تظهر بعض مهارات الفايكنغ الحقيقي! للأسف سأقتلك على الأرجح!
Loki must have stood by you, for a common man alone could not have defeated me... Oh well! I will join the einherjar in Valhalla and feast, while you toil away here. = لا بد أن لوكي وقف إلى جانبك، فرجل عادي وحده ما كان ليهزمني... حسناً! سأنضم إلى الأينهيريار في فالهالا وأتنعم، بينما تكدح أنت هنا.
Our future battle will be glorious! = معركتنا القادمة ستكون مجيدة!
Harald Bluetooth bids you welcome to his lands, a Viking unlike any the seas and lands have ever known! Hah, are you afraid? = هارالد بلوتوث يرحب بك في أراضيه، فايكنغ لا مثيل له في البحار والأراضي! هاه، هل أنت خائف؟
This is a fine deal! Even a drunk beggar would agree! = هذه صفقة رائعة! حتى متسول سكران سيوافق!
Hail to you. = السلام عليك.
Viking Fury = غضب الفايكنغ
Skal, Harald Bluetooth Gormsson, son of King Gorm of the Old and Thyra Dannebod! After crushing the armies of Norway, you achieved great construction projects all across the land of mighty Denmark. Numerous Ring Fortresses were built under your reign to protect the people from foreign invasions, but also from local quarrels. In 983 AD, you successfully repelled several waves of German settlers trying to colonize your land, and then always kept your kingdom free from any foreign pressure. = سكول، هارالد بلوتوث غورمسون، ابن الملك غورم القديم وثيرا دانبود! بعد سحق جيوش النرويج، حققت مشاريع بناء عظيمة في أنحاء أرض الدنمارك القوية. بُنيت حصون حلقية كثيرة في عهدك لحماية الشعب من الغزوات الأجنبية، وكذلك من الخلافات المحلية. وفي عام 983 م صددت بنجاح عدة موجات من المستوطنين الألمان الذين حاولوا استعمار أرضك، ثم أبقيت مملكتك دائماً حرة من أي ضغط أجنبي.
As a true Viking, who knows not fear, time has come to unleash mighty armies of Northsmen to bring despair upon your enemies! By the will of the Gods, it will be either a glorious triumph or a sumptuous feast in the Valhalla! Will your new empire shine through the ages of history? = كفايكنغ حقيقي لا يعرف الخوف، حان الوقت لإطلاق جيوش النورمان الجبارة لتجلب اليأس على أعدائك! بإرادة الآلهة سيكون إما نصراً مجيداً وإما وليمة فاخرة في فالهالا! هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
