You leave us no choice. War it must be. = لم تترك لنا خياراً. لا بد أن تكون الحرب.
Very well, this shall not be forgotten. = حسناً، هذا لن يُنسى.
I guess you weren't here for the sprouts after all... = أظن أنك لم تكن هنا من أجل براعم الكرنب في النهاية...
Brussels = بروكسل

Bucharest = بوخارست

And so the flower of Florence falls to barbaric hands... = وهكذا تسقط زهرة فلورنسا في أيدٍ همجية...
Florence = فلورنسا

Geneva = جنيف

Unacceptable! = غير مقبول!

We... defeated? No... we had so much work to do! = نحن... هُزمنا؟ لا... كان لدينا عمل كثير!
Kathmandu = كاتماندو

Today, the Malay people obey you, but do not think this is over... = اليوم، الشعب الماليزي يطيعك، لكن لا تظن أن هذا انتهى...
Kuala Lumpur = كوالالمبور

Perhaps now we will find peace in death... = ربما سنجد السلام الآن في الموت...
Lhasa = لهاسا

You fiend! History shall remember this! = أيها الشرير! سيذكر التاريخ هذا!
Milan = ميلانو

Monaco = موناكو

I have failed. May you, at least, know compassion towards our people. = لقد فشلت. ليتك على الأقل تعرف الرحمة تجاه شعبنا.
Cape Town = كيب تاون

How barbaric. Those who live by the sword shall perish by the sword. = يا للهمجية. من عاش بالسيف فبالسيف يموت.
Genoa = جنوة

The day of judgement has come to us. But rest assured, the same will go for you! = لقد حل علينا يوم الحساب. لكن اطمئن، سيكون الأمر نفسه لك!
Helsinki = هلسنكي

Ah, Gods! Why have you forsaken us? = آه يا آلهة! لماذا تخليتم عنا؟
Manila = مانيلا

Congratulations, conqueror. This tribe serves you now. = تهانينا أيها الفاتح. هذه القبيلة في خدمتك الآن.
Mogadishu = مقديشو

We were too weak to protect ourselves... = كنا أضعف من أن نحمي أنفسنا...
Quebec City = مدينة كيبك

Ragusa = راغوزا

I have to do this, for the sake of progress if nothing else. You must be opposed! = عليّ أن أفعل هذا، من أجل التقدم إن لم يكن لشيء آخر. يجب مقاومتك!
You can see how fruitless this will be for you... right? = ترى كم سيكون هذا عديم الجدوى لك... أليس كذلك؟
May God grant me these last wishes - peace and prosperity for Brazil. = ليمنحني الله هذه الأمنيات الأخيرة - السلام والازدهار للبرازيل.
Rio de Janeiro = ريو دي جانيرو

Perhaps, in another world, we could have been friends... = ربما، في عالم آخر، كنا سنصبح أصدقاء...
Singapore = سنغافورة

After thorough deliberation, Australia finds itself at a crossroads. Prepare yourself, for war is upon us. = بعد تفكير مستفيض، تجد أستراليا نفسها عند مفترق طرق. استعد، فالحرب حلت علينا.
We will mobilize every means of resistance to stop this transgression against our nation! = سنحشد كل وسائل المقاومة لوقف هذا التعدي على أمتنا!
The principles for which we have fought will survive longer than any nation you could ever build. = المبادئ التي ناضلنا من أجلها ستبقى أطول من أي أمة تستطيع بناءها.
Sydney = سيدني

I will enjoy hearing your last breath as you witness the destruction of your realm! = سأستمتع بسماع أنفاسك الأخيرة وأنت تشهد دمار مملكتك!
Why do we fight? Because Inanna demands it. Now, witness the power of the Sumerians! = لماذا نقاتل؟ لأن إنانا تأمر بذلك. الآن، شاهد قوة السومريين!
What treachery has struck us? No, what evil? = أي خيانة ضربتنا؟ لا، أي شر؟
Ur = أور

In responding to the unstinting malignancy that has heretofore defined your relationship with Canada, we can have no recourse but war! = رداً على الخبث الذي لا ينقطع والذي ميّز علاقتك بكندا حتى الآن، لا يمكننا سوى الحرب!
As we can reach no peaceful resolution with you, Canada must turn, with reluctance, to war. = بما أننا لا نستطيع التوصل إلى حل سلمي معك، فعلى كندا أن تلجأ على كره إلى الحرب.
I regret not defending my country to the last, although it was not of use. = أندم لأنني لم أدافع عن بلدي حتى النهاية، رغم أن ذلك لم يكن مجدياً.
Vancouver = فانكوفر

You have revealed your purposes a bit too early, my friend... = لقد كشفت عن مقاصدك مبكراً قليلاً يا صديقي...
A wrong calculation, on my part. = حسابي كان خاطئاً.
Venice = البندقية

They will write songs of this.... pray that they shall be in your favor. = سيكتبون الأغاني عن هذا.... فادعُ أن تكون في صالحك.
Antwerp = أنتويرب

May the Heavens forgive you for inflicting this humiliation to our people. = لتغفر لك السماوات إهانتك لشعبنا.
Zanzibar = زنجبار

How could we fall to the likes of you?! = كيف نسقط أمام أمثالك؟!
Almaty = ألماتي

Let's have a nice little War, shall we? = لنخض حرباً صغيرة جميلة، أليس كذلك؟
If you need your nose bloodied, we'll happily serve. = إن احتجت إلى أنف مدمّى، فسنخدمك بكل سرور.
The serbian guerilla will never stop haunting you! = الغوريلا الصربية لن تكف عن ملاحقتك أبداً!
Belgrade = بلغراد

Budapest = بودابست

War lingers in our hearts. Why carry on with a false peace? = الحرب تسكن قلوبنا. فلماذا نواصل سلاماً زائفاً؟
You gormless radger! You'll dine on your own teeth before you set foot in Ireland! = أيها الأحمق التافه! ستأكل أسنانك قبل أن تطأ قدمك أيرلندا!
A lonely wind blows through the highlands today. A dirge for Ireland. Can you hear it? = ريح موحشة تهب عبر المرتفعات اليوم. مرثية لأيرلندا. هل تسمعها؟
Dublin = دبلن

You shall stain this land no longer with your vileness! To arms, my countrymen - we ride to war! = لن تدنس هذه الأرض بخستك بعد الآن! إلى السلاح يا أبناء وطني - نخرج إلى الحرب!
Traitorous man! The Celtic peoples will not stand for such wanton abuse and slander - I shall have your head! = أيها الرجل الخائن! لن تتحمل الشعوب السلتية مثل هذا الإساءة والافتراء العابث - سآخذ رأسك!
Vile ruler, know that you 'won' this war in name only! = أيها الحاكم الخسيس، اعلم أنك 'فزت' بهذه الحرب بالاسم فقط!
Edinburgh = إدنبرة

So this is how it feels to die... = إذن هكذا هو الشعور بالموت...
Hanoi = هانوي

Do you really think you can walk over us so easily? I will not let it happen. Not to Kongo - not to my people! = هل تظن حقاً أنك تستطيع أن تدوس علينا بهذه السهولة؟ لن أدع ذلك يحدث. ليس لمملكة الكونغو - ليس لشعبي!
We are no strangers to war. You have strayed from the right path, and now we will correct it. = لسنا غرباء عن الحرب. لقد حدت عن الطريق الصحيح، والآن سنصحح ذلك.
You are nothing but a glorified barbarian. Cruel, and ruthless. = أنت لست سوى همجي مُمجَّد. قاسٍ وبلا رحمة.
M'Banza-Kongo = مبانزا كونغو

What a fine battle! Sidon is willing to serve you! = يا لها من معركة رائعة! صيدا مستعدة لخدمتك!
Sidon = صيدا

We never fully trusted you from the start. = لم نثق بك تماماً منذ البداية.
Tyre = صور

We don't like your face. To arms! = لا يعجبنا وجهك. إلى السلاح!
You will see you have just bitten off more than you can chew. = سترى أنك عضضت أكثر مما تستطيع مضغه.
This ship may sink, but our spirits will linger. = قد تغرق هذه السفينة، لكن أرواحنا ستبقى.
Valletta = فاليتا


