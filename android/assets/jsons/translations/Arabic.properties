I am Sweden's king. You can take my lands, my people, my kingdom, but you will never reach the House of Vasa. = أنا ملك السويد. يمكنك أخذ أراضي وشعبي ومملكتي، لكنك لن تصل أبداً إلى بيت فاسا.
You actually seem sharper than what I had originally thought. = تبدو في الواقع أذكى مما ظننت في الأصل.
Stranger, welcome to the Snow King's kingdom! I am Gustavus Adolphus, member of the esteemed House of Vasa = أيها الغريب، مرحباً بك في مملكة ملك الثلج! أنا غوستاف أدولف، عضو بيت فاسا الموقر
My friend, it is my belief that this settlement can benefit both our peoples. = يا صديقي، أعتقد أن هذه التسوية قد تفيد شعبينا.
Oh, welcome! = آه، مرحباً!
Oh, it is you. = آه، إنه أنت.
Nobel Prize = جائزة نوبل
All hail Great King Gustavus Adolphus, founder of the Swedish Empire, and one of the most famous military tacticians. In the early 17th century, Sweden emerged as a great power in Europe under your reign, thanks to your wisdom, both in diplomacy and warfare. As king, you decided to reform Swedish laws to bring economic stability and prosperity to your people. Your allies, and also your enemies, called you the 'Lion of the North', witnessing your modern vision of warfare, and the prowess of your armies on the battlefield. As you triumphed in the Thirty Years' War, your name will be forever remembered as one of history's greatest generals. = المجد للملك العظيم غوستاف أدولف، مؤسس الإمبراطورية السويدية وأحد أشهر المخططين العسكريين. في أوائل القرن السابع عشر برزت السويد قوة عظمى في أوروبا في عهدك، بفضل حكمتك في الدبلوماسية والحرب. وكملك قررت إصلاح القوانين السويدية لجلب الاستقرار الاقتصادي والازدهار لشعبك. وقد دعاك حلفاؤك وأعداؤك 'أسد الشمال'.
O noble King, will you lend your leadership and brilliant ideas to Sweden once again, to conceive strategies never seen before? Will your new empire shine through the ages of history? = أيها الملك النبيل، هل ستمنح السويد قيادتك وأفكارك اللامعة مرة أخرى لابتكار استراتيجيات لم تُرَ من قبل؟ هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
