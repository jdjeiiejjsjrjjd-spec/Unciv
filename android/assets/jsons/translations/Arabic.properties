Theodora = ثيودورا
It is always a shame to destroy a thing of beauty. Happily, you are not one. = من المؤسف دائماً تدمير شيء جميل. لحسن الحظ أنك لست كذلك.
Now darling, tantrums are most unbecoming. I shall have to teach you a lesson. = الآن يا عزيزي، نوبات الغضب لا تليق بك. سأضطر إلى تلقينك درساً.
Like a child playing with toys you are. My people will never love you, nor suffer this indignation gracefully. = أنت كطفل يلعب بالألعاب. شعبي لن يحبك أبداً، ولن يتحمل هذه الإهانة بكرامة.
My, isn't this a pleasant surprise - what may I call you, oh mysterious stranger? I am Theodora, beloved of Byzantium. = يا للمفاجأة السارة - بماذا أناديك أيها الغريب الغامض؟ أنا ثيودورا، حبيبة بيزنطة.
I have heard that you adept at certain kinds of ... interactions. Show me. = سمعت أنك بارع في أنواع معينة من... التفاعلات. أرني.
Hello again. = أهلاً مجدداً.
Patriarchate of Constantinople = بطريركية القسطنطينية
Magnificent Empress Theodora, beloved of Byzantium and of Rome, your people salute you! With your beauty and intelligence, you rose up from actress and courtesan to the rank of the most powerful woman in the Roman Empire, as wife of Justinian I. In the late 520's AD, you helped your husband engage in spiritual and legal reforms, promugalting numerous laws to improve women's status and treatment in the empire. You also made of Constantinople the jewel of the Eastern Roman Empire with the restoration and construction of many aqueducts, bridges, and churches, its beauty culminating with the creation of the Hagia Sophia, one of the most splendid pieces of architecture in the world. = أيتها الإمبراطورة الرائعة ثيودورا، حبيبة بيزنطة وروما، شعبك يحييك! بجمالك وذكائك ارتقيت من ممثلة وخليلة إلى مرتبة أقوى امرأة في الإمبراطورية الرومانية، كزوجة لجستنيان الأول. وفي أواخر عشرينيات القرن السادس الميلادي ساعدت زوجك في إصلاحات روحية وقانونية، وسنّ قوانين عديدة لتحسين مكانة المرأة ومعاملتها في الإمبراطورية.
Beautiful Empress,the Byzantine Empire's magnificence is intact in all memories, and ready to reborn as the new jewel of humankind. Will your new empire shine through the ages of history? = أيتها الإمبراطورة الجميلة، روعة الإمبراطورية البيزنطية ما زالت سليمة في كل الذاكرات، وجاهزة لتُبعث كجوهرة جديدة للبشرية. هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
