# Capturing a city

What would you like to do with the city of [cityName]? = ماذا تريد أن تفعل بمدينة [cityName]؟
Annex = ضم
Annexed cities become part of your regular empire. = تصبح المدن المضمومة جزءاً من إمبراطوريتك العادية.
Their citizens generate 2x the unhappiness, unless you build a courthouse. = يولّد مواطنوها ضعف الاستياء، ما لم تبنِ دار قضاء.
Your civilization may not annex this city. = لا يجوز لحضارتك ضم هذه المدينة.
Puppet = تابعة
Puppeted cities do not increase your tech or policy cost. = المدن التابعة لا ترفع تكلفة تقنياتك أو سياساتك.
You have no control over the the production of puppeted cities. = لا تملك أي سيطرة على إنتاج المدن التابعة.
Puppeted cities also generate 25% less Science and Culture. = المدن التابعة تولّد أيضاً علوماً وثقافة أقل بنسبة 25%.
A puppeted city can be annexed at any time. = يمكن ضم المدينة التابعة في أي وقت.
Liberate (city returns to [originalOwner]) = تحرير (تعود المدينة إلى [originalOwner])
Liberating a city returns it to its original owner, giving you a massive relationship boost with them! = تحرير المدينة يعيدها إلى مالكها الأصلي، مما يمنحك دفعة كبيرة في العلاقة معه!
Raze = هدم
Razing the city annexes it, and starts burning the city to the ground. = هدم المدينة يضمها ويبدأ بحرقها حتى تُسوّى بالأرض.
Razing the city puppets it, and starts burning the city to the ground. = هدم المدينة يجعلها تابعة ويبدأ بحرقها حتى تُسوّى بالأرض.
The population will gradually dwindle until the city is destroyed. = سيتناقص السكان تدريجياً حتى تُدمَّر المدينة.
Original capitals and holy cities cannot be razed. = لا يمكن هدم العواصم الأصلية والمدن المقدسة.
Destroy = تدمير
Destroying the city instantly razes the city to the ground. = تدمير المدينة يسويها بالأرض فوراً.
Keep it = الاحتفاظ بها
Remove your troops in our border immediately! = أزل قواتك من حدودنا فوراً!
Sorry. = آسف.
Never! = مستحيل!
Those lands were not yours to take. This has not gone unnoticed. = تلك الأراضي لم تكن لك لتأخذها. هذا لم يمر دون ملاحظة.

