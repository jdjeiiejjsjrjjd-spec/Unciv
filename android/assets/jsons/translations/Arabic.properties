Attila the Hun = أتيلا الهوني
I grow tired of this throne. I think I should like to have yours instead. = لقد سئمت هذا العرش. أظن أنني أود أن يكون لي عرشك بدلاً منه.
Now what is this?! You ask me to add your riches to my great avails. The invitation is accepted. = ما هذا الآن؟! تطلب مني أن أضيف ثرواتك إلى غنائمي العظيمة. الدعوة مقبولة.
My people will mourn me not with tears, but with human blood. = شعبي لن يبكيني بالدموع، بل بدماء البشر.
Do you know who you're dealing with? = هل تعرف مع من تتعامل؟
You are in the presence of Attila, scourge of Rome. Do not let hubris be your downfall as well. = أنت في حضرة أتيلا، سوط روما. لا تدع الغرور يكون سقوطك أنت أيضاً.
This is better than you deserve, but let it not be said that I am an unfair man. = هذا أفضل مما تستحق، لكن لا يقال إنني رجل غير منصف.
Good day to you. = يوم سعيد لك.
Scourge of God = سوط الله
Great Attila, mighty warrior and leader of the Hunnic empire, your men bow down before you. During the 5th century, you and your brother Bleda have conquered many lands, forged a mighty empire and commanded the most powerful and frightening force of antiquity. You inspired fear to the Roman Emperors themselves, who called you 'Flagellum Dei', the 'Scourge of God', as you took kingdom after kingdom in the Balkans, invaded Eastern Roman Empire, into Gaul and Northern Italy, and planned to conquer Rome itself. Your empire didn't survive long after your death, but your name and your legend have, for millenia to come. = أيها العظيم أتيلا، المحارب الجبار وقائد الإمبراطورية الهونية، رجالك ينحنون أمامك. في القرن الخامس فتحت أنت وأخوك بليدا أراضي كثيرة، وصغتما إمبراطورية عظيمة، وقدتما أقوى قوة وأكثرها رعباً في العصور القديمة. وبثثتَ الخوف في قلوب أباطرة الرومان أنفسهم، الذين دعوك 'فلاجيلوم دي'، 'سوط الله'، بينما أخذت مملكة بعد مملكة في البلقان وغزوت الإمبراطورية الرومانية الشرقية.
Fearsome General, your mighty hordes are at your command, waiting to crush your foes once again and to conquer all the riches the world has to offer! Will your new empire shine through the ages of history? = أيها القائد المرعب، جحافلك الجبارة تحت أمرك، تنتظر سحق أعدائك مرة أخرى وفتح كل الثروات التي يقدمها العالم! هل ستتألق إمبراطوريتك الجديدة عبر العصور؟
